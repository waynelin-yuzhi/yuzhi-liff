<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>植間員工｜養護報告</title>
<link rel="stylesheet" href="staff.css?v=3">
<style>
  .seg{display:flex;background:var(--paper);border-radius:10px;padding:4px;margin-bottom:12px;box-shadow:0 4px 16px rgba(27,26,23,.06)}
  .seg button{flex:1;border:none;background:none;padding:10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--moss);color:var(--paper)}
  .fld{margin-bottom:12px}.fld label{display:block;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
  input[type=date],input[type=time],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
  textarea{resize:vertical;min-height:70px}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}.hint.ok{color:var(--moss)}.hint.warn{color:var(--amber)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip-btn{border:1.5px solid var(--line);background:#fff;color:var(--body);border-radius:20px;padding:8px 14px;font-size:14px}
  .chip-btn.on{border-color:var(--moss);background:var(--sage-tint);color:var(--moss-deep);font-weight:600}
  .chip-btn.custom{border-style:dashed}
  .zone{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
  .zone-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .zone-num{width:26px;height:26px;border-radius:13px;background:var(--moss);color:var(--paper);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .zone-head input{flex:1;border:none;border-bottom:1.5px solid var(--line);border-radius:0;padding:8px 4px;font-size:16px;font-weight:600;background:transparent}
  .zone-del{border:none;background:none;color:var(--muted);font-size:22px;padding:0 6px}
  .ph-lab{font-size:12px;color:var(--muted);margin:8px 0 6px;display:flex;justify-content:space-between}
  .ph-btns{display:flex;gap:8px;margin-bottom:8px}
  .ph-btn{flex:1;text-align:center;border:1.5px solid var(--moss);color:var(--moss);border-radius:8px;padding:9px 0;font-size:13.5px;font-weight:600;position:relative;overflow:hidden;background:#fff}
  .ph-btn.cam{background:var(--moss);color:var(--paper)}
  .ph-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
  .thumbs{display:flex;flex-wrap:wrap;gap:6px}
  .thumb{width:72px;height:72px;border-radius:8px;overflow:hidden;position:relative;background:var(--rice)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .st{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;color:#fff;padding:2px 0;background:rgba(0,0,0,.5)}
  .thumb .st.done{background:rgba(95,110,88,.85)}.thumb .st.fail{background:rgba(184,90,61,.9)}
  .thumb .del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:10px;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:20px;padding:0}
  .thumb.pick{outline:3px solid var(--amber)}
  .iss{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:10px;margin-top:10px;background:var(--paper)}
  .iss-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .badge{font-size:12px;padding:3px 9px;border-radius:10px;background:var(--amber-tint);color:var(--amber);font-weight:600}
  .badge.cont{background:var(--sage-tint);color:var(--moss-deep)}
  .segsm{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .segsm button{border:none;background:#fff;padding:6px 10px;font-size:12.5px;color:var(--body)}
  .segsm button.on{background:var(--moss);color:var(--paper)}
  .segsm.sev button.on.hi{background:var(--terra)}.segsm.sev button.on.lo{background:#8a9784}
  .iss input[type=text],.iss input[type=number]{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;margin-top:6px;background:#fff}
  .pot{display:flex;align-items:center;gap:6px;margin-top:6px}.pot input{margin-top:0;width:80px}
  .rep{margin-top:8px;display:flex;align-items:center;gap:8px}
  .rep img{width:52px;height:52px;border-radius:6px;object-fit:cover}
  .picker{margin-top:8px;padding:8px;background:var(--rice);border-radius:8px}
  .oi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .oi .d{font-weight:600}.oi .m{font-size:12px;color:var(--muted);margin-top:3px}
  .oi .assign{margin-top:8px;padding:8px 10px;background:var(--amber-tint);border-left:3px solid var(--amber);border-radius:0 6px 6px 0;font-size:12.5px;color:#6B4200}
  .oi .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .oi .acts button{border:1.5px solid var(--moss);background:#fff;color:var(--moss);border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600}
  .oi .acts button.on{background:var(--moss);color:var(--paper)}
  .oi .acts button.terra{border-color:var(--terra);color:var(--terra)}.oi .acts button.terra.on{background:var(--terra);color:#fff}
  .oi .acts button.grey{border-color:#8a9784;color:#6b7566}.oi .acts button.grey.on{background:#8a9784;color:#fff}
  .sticky{position:sticky;bottom:0;background:linear-gradient(to top,var(--rice) 70%,rgba(242,237,227,0));padding:10px 0 12px;margin-top:8px}
  .qbar{border-radius:8px;padding:8px 12px;font-size:12.5px;color:#fff;margin-bottom:8px;background:var(--amber)}
  .qbar.fail{background:var(--terra)}.qbar.ok{background:var(--moss)}
  .list-item{padding:12px 0;border-bottom:.5px solid var(--line)}
  .list-item:last-child{border-bottom:none}
  .list-item .t{font-weight:600}.list-item .m{font-size:12.5px;color:var(--muted);margin-top:2px}
  .editing{background:var(--amber-tint);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay .box{background:var(--paper);border-radius:12px;padding:18px;max-width:420px;width:100%}
  .site-info{font-size:13px;color:var(--body);white-space:pre-line;line-height:1.7}
  .collapse-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js?v=4"></script>
<script src="staff.js?v=4"></script>
<script src="report.js?v=2" defer></script>
</head>
<body>
<div class="wrap">
  <div class="brand">YUZHI PLANT DESIGN · 養護報告</div>
  <div class="seg"><button id="seg-form" class="on">填寫</button><button id="seg-list">我的報告</button></div>
  <div id="app"><div class="card"><div class="note">載入中…</div></div></div>
  <div class="ft"><a class="lnk" id="home-lnk" href="index.html">回員工首頁</a><br>植間設計股份有限公司<br><span id="pgv"></span></div>
</div>
<div class="overlay" id="dup"><div class="box"><div style="font-weight:700;margin-bottom:8px">同一天已經有一份報告</div><div class="note" id="dup-text"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn sm secondary" id="dup-edit">改那一份</button><button class="btn sm" id="dup-new">仍另存新的</button><button class="btn sm secondary" id="dup-cancel">取消</button></div></div></div>
<datalist id="plants"></datalist>
</body>
</html>
