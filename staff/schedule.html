<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>植間員工｜排班</title>
<link rel="stylesheet" href="staff.css?v=8">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js?v=5"></script>
<script src="staff.js?v=8"></script>
<style>
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cal .day{min-height:64px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px;font-size:11px;position:relative}
.cal .day.out{background:transparent;border-color:transparent}
.cal .day.hol{background:#FFF1E6}
.cal .day.today{border-color:#5F6F52;box-shadow:inset 0 0 0 1px #5F6F52}
.cal .day .dn{font-size:11px;color:var(--muted);margin-bottom:2px}
.cal .day.hol .dn{color:#9A4E1E}
.cal .day .hn{font-size:9px;color:#9A4E1E;line-height:1.1;margin-bottom:2px}
.chip{display:block;border-radius:6px;padding:2px 3px;margin-bottom:2px;font-size:10px;line-height:1.2;border:1px solid #D9D2C0;background:#F3F0E6;color:#3E3A30;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.pm{background:#E9EEF5;border-color:#C9D3E3}
.chip.warn{background:#FFE9DC;border-color:#F1C5AA;color:#8C3B25}
.chip.punch{background:#E3EFE1;border-color:#C6DCC3;color:#3D6B3A}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:14px 16px 24px;z-index:20;display:none}
.sheet.on{display:block}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19;display:none}.mask.on{display:block}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#EEE9DD;color:#5A5344}
.st.wait{background:#FFF1E6;color:#9A4E1E}.st.ok{background:#E3EFE1;color:#3D6B3A}
.legend{font-size:11px;color:var(--muted);margin-top:6px}
.chip[data-k]{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.chip.dragging{opacity:.35}
.chip.ghost{position:fixed;z-index:99;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:scale(1.08)}
.cal .day.over{outline:2px solid var(--moss);outline-offset:-2px;background:#F4F6F1}
.chip.over{outline:2px solid var(--moss)}
.chip i{font-style:normal;font-size:8px;opacity:.7;margin-right:1px}
.chip.punch{white-space:normal;line-height:1.15}
.cal .day .chip{white-space:normal;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:clip;line-height:12px;max-height:30px;padding:2px 3px;font-size:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">YUZHI PLANT DESIGN · 排班</div>
  <div id="app"><div class="card"><div class="note">載入中…</div></div></div>
  <div class="ft"><a class="lnk" id="home-lnk" href="index.html">回員工首頁</a><br>植間設計股份有限公司<br><span id="pgv"></span></div>
</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<script>
(function () {
  var T = window.STAFF, esc = T.esc, $ = T.$;
  $('pgv').textContent = T.CFG.version || '';
  $('home-lnk').href = T.href('index.html');
  var WD = ['一', '二', '三', '四', '五', '六', '日'];
  var ME = null, YM = T.qs.get('ym') || '', DATA = null, MSG = '', QUEUE = [], INFLIGHT = false, INFLIGHT_JOB = null, REFRESH_PENDING = false, LEFT = false;
  var VIEW = 'month'; try { VIEW = localStorage.getItem('sched_view') || 'month'; } catch (e0) {} var WEEK = '';
  function busySaving() { return INFLIGHT || QUEUE.length > 0; }
  function thisYm() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function addYm(ym, n) { var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + n; var d = new Date(y, m, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function wdOf(ds) { var d = new Date(ds + 'T00:00:00'); var w = d.getDay(); return w === 0 ? 7 : w; }
  function daysOf(ym) { var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)); var n = new Date(y, m, 0).getDate(); var out = []; for (var i = 1; i <= n; i++) out.push(ym + '-' + String(i).padStart(2, '0')); return out; }
  function md(ds) { return ds.slice(5).replace('-', '/'); }
  function fmtD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addD(ds, n) { var d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return fmtD(d); }
  function mondayOf(ds) { return addD(ds, -(wdOf(ds) - 1)); }
  function defaultWeek() { var days = daysOf(YM); var t = (DATA && DATA.today) || ''; return mondayOf(t && t.slice(0, 7) === YM ? t : days[0]); }
  function weekInMonth(w) { for (var i = 0; i < 7; i++) if (addD(w, i).slice(0, 7) === YM) return true; return false; }
  function stChip(s) { var cls = s === '待核可' ? 'wait' : (s === '已核可' ? 'ok' : ''); return '<span class="st ' + cls + '">' + esc(s || '未建立') + '</span>'; }
  function load(ym, keep) {
    if (!keep) MSG = ''; YM = ym; $('app').innerHTML = '<div class="card"><div class="note"><span class="spin"></span>載入 ' + esc(ym) + '…</div></div>';
    T.api('schedMonth', { ym: ym }).then(function (r) { if (!r || !r.ok) { T.showErr(T.errText(r)); return; } DATA = r; render(); }).catch(function () { T.showErr('載入失敗，請重試'); });
  }
  function render() {
    var r = DATA, ym = r.ym, past = r.mode === 'past', rows = r.rows || [], hol = r.holidays || {};
    var byDate = {}; rows.forEach(function (x) { (byDate[x.date] = byDate[x.date] || []).push(x); });
    var h = '<div class="hd"><div><h1>' + esc(ym.replace('-', ' / ')) + '</h1><div class="sub">' + (past ? '過去月份：顯示實際打卡' : stChip(r.status) + (r.apId ? '　' + esc(r.apId) : '')) + '</div></div></div>';
    var weekMode = VIEW === 'week' && !past; if (weekMode && (!WEEK || !weekInMonth(WEEK))) WEEK = defaultWeek();
    h += '<div class="two" style="margin-bottom:10px">' + (weekMode ? '<button class="btn secondary sm" id="prev">‹ 上週</button><button class="btn secondary sm" id="next">下週 ›</button>' : '<button class="btn secondary sm" id="prev">‹ 上個月</button><button class="btn secondary sm" id="next">下個月 ›</button>') + '</div>';
    if (!past) h += '<div class="seg"><button data-view="month"' + (weekMode ? '' : ' class="on"') + '>月檢視</button><button data-view="week"' + (weekMode ? ' class="on"' : '') + '>週檢視</button></div>';
    if (!past) {
      h += '<div class="small muted" style="margin:-4px 0 8px"><a class="lnk" href="' + T.href('manual.html') + '#schedule">怎麼排？看教學</a></div>';
      var approved = r.status === '已核可', locked = approved;
      var holN = rows.filter(function (x) { return x.holiday && String(x.note || '').indexOf('照排') < 0; }).length;
      h += '<div class="card" style="padding:10px 12px">';
      if (r.status === '未建立' || !rows.length) h += '<div class="note">這個月還沒排。按下面一鍵照慣例鋪滿，再調整。</div>';
      else if (r.status === '草稿') h += '<div class="note">草稿：點任何一個班可以移日期、改上下午、改順序。確認後按「送出核可」。</div>';
      else if (r.status === '待核可') h += '<div class="note">已送出，等 Wayne 核可。核可前你還是可以直接改，卡片會跟著更新。</div>';
      else if (approved) h += '<div class="note">已核可，班表生效。要改：點那個班（或點空白日期加班），寫原因送出變更申請，Wayne 核可後才生效。</div>';
      h += '<div class="two" style="margin-top:8px">'
        + '<button class="btn sm" id="draft"' + (locked ? ' disabled' : '') + '>' + (rows.length ? '重新照慣例排' : '照慣例排') + '</button>'
        + (r.status === '待核可' ? '<button class="btn secondary sm" id="withdraw">撤回重排</button>' : '<button class="btn sm" id="submit"' + (locked || !rows.length ? ' disabled' : '') + '>送出核可</button>') + '</div>'
        + '<div class="small muted" id="msg" style="margin-top:6px"></div>'
        + (holN && !approved ? '<button class="btn secondary sm" id="fixhol" style="margin-top:6px">假日上的 ' + holN + ' 場移到同週工作日</button>' : '') + '</div>';
      var cov = r.coverage || [];
      if (cov.length) h += '<div class="card" style="padding:10px 12px"><div class="small"><b>本月還沒排到的客戶</b>　<span class="muted">點名字加班</span></div><div style="margin-top:4px">' + cov.map(function (c) { return '<span class="chip" style="display:inline-block;margin:2px 4px 2px 0;cursor:pointer" data-cov="' + esc(c.siteCode) + '|' + (c.weekday || 0) + '">' + esc(c.shortName) + (c.selfArranged ? '（自己安排）' : '（' + c.actual + '/' + c.expected + '）') + '</span>'; }).join('') + '</div></div>';
      var chg = r.changes || [];
      if (chg.length) h += '<div class="card" style="padding:10px 12px"><div class="small"><b>變更申請</b></div>' + chg.map(function (c) { return '<div class="small' + (c.status === '待核可' ? '' : ' muted') + '" style="margin-top:4px">' + stChip(c.status) + ' ' + esc(c.desc) + (c.reason ? '<br><span class="muted">原因：' + esc(c.reason) + '</span>' : '') + (c.result ? '<br><span class="muted">' + esc(c.result) + '</span>' : '') + '</div>'; }).join('') + '</div>';
    }
    if (weekMode) {   // 週檢視：一天一列、班名完整，拖曳同月檢視
      h += '<div class="card" style="padding:8px"><div class="wk">';
      for (var wi = 0; wi < 7; wi++) { (function (ds) {
        var hh = hol[ds], isHol = hh && hh.kind !== '補班', inMonth = ds.slice(0, 7) === ym;
        h += '<div class="day' + (isHol ? ' hol' : '') + (ds === r.today ? ' today' : '') + (inMonth ? '' : ' out') + '"' + (inMonth ? ' data-d="' + ds + '"' : '') + '><div class="dn">' + md(ds) + '<br><span class="muted">週' + WD[wdOf(ds) - 1] + '</span>' + (hh ? '<div class="hn">' + esc(hh.name) + '</div>' : '') + '</div><div class="chips">';
        if (!inMonth) h += '<span class="small muted">（' + Number(ds.slice(5, 7)) + ' 月，切到那個月再排）</span>';
        else (byDate[ds] || []).forEach(function (x) { h += '<span class="chip' + (x.slot === '下午' ? ' pm' : '') + ((x.holiday && String(x.note || '').indexOf('照排') < 0) || /不可排/.test(x.note || '') ? ' warn' : '') + (x.pendingChange ? ' req' : '') + '" data-k="' + esc(x.siteCode) + '|' + esc(x.date) + '|' + esc(x.slot) + '" title="' + esc(x.shortName) + '"><i>' + x.order + '</i>' + esc(shortLabel(x.shortName)) + (x.startTime ? ' ' + esc(x.startTime) : '') + '</span>'; });
        h += '</div></div>';
      })(addD(WEEK, wi)); }
      h += '</div><div class="legend">小數字＝當天第幾站；淡藍底＝下午班。長按一個班可以拖到別天，或拖到另一個班上改順序。點空白處加班。</div></div>';
    } else {
    h += '<div class="card" style="padding:8px"><div class="cal">' + WD.map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    var days = daysOf(ym), first = wdOf(days[0]);
    for (var i = 1; i < first; i++) h += '<div class="day out"></div>';
    days.forEach(function (ds) {
      var hh = hol[ds], isHol = hh && hh.kind !== '補班';
      h += '<div class="day' + (isHol ? ' hol' : '') + (ds === r.today ? ' today' : '') + '" data-d="' + ds + '"><div class="dn">' + Number(ds.slice(8)) + '</div>' + (hh ? '<div class="hn">' + esc(hh.name) + '</div>' : '');
      if (past) { (r.punches[ds] || []).forEach(function (p) { h += '<span class="chip punch"><i>' + esc(p.time) + '</i><br>' + esc(shortLabel(p.siteName)) + '</span>'; }); }
      else (byDate[ds] || []).forEach(function (x) { h += '<span class="chip' + (x.slot === '下午' ? ' pm' : '') + ((x.holiday && String(x.note || '').indexOf('照排') < 0) || /不可排/.test(x.note || '') ? ' warn' : '') + (x.pendingChange ? ' req' : '') + '" data-k="' + esc(x.siteCode) + '|' + esc(x.date) + '|' + esc(x.slot) + '" title="' + esc(x.shortName) + (x.startTime ? ' ' + esc(x.startTime) : '') + '"><i>' + x.order + '</i>' + esc(shortLabel(x.shortName)) + '</span>'; });
      h += '</div>';
    });
    h += '</div><div class="legend">小數字＝當天第幾站；淡藍底＝下午班。長按一個班可以拖到別天，或拖到另一個班上改順序。橘底＝假日；橘框的班要移。</div></div>';
    }
    if (!past && (r.mySites || []).length) {   // 只提醒有客戶限制的、和沒固定星期要自己加的；其他不列（Wayne：整排規則太亂沒幫助）
      var lim = r.mySites.filter(function (s) { return s.fixedStart || (s.noDays && s.noDays.length) || s.slot; });
      var selfAdd = r.mySites.filter(function (s) { return !s.weekday && /週|月/.test(s.freq || ''); });
      if (lim.length || selfAdd.length) {
        h += '<div class="card" style="padding:10px 12px"><div class="small"><b>提醒</b></div>';
        if (lim.length) h += '<div class="small muted">客戶限制：' + lim.map(function (s) { return esc(s.shortName) + ' ' + [s.fixedStart ? s.fixedStart + ' 開始' : (s.slot ? '只排' + s.slot : ''), s.noDays && s.noDays.length ? '不可週' + s.noDays.map(function (n) { return WD[n - 1]; }).join('、') : ''].filter(Boolean).join('・'); }).join('；') + '</div>';
        if (selfAdd.length) h += '<div class="small muted">沒固定星期、要自己點日期加：' + selfAdd.map(function (s) { return esc(s.shortName); }).join('、') + '</div>';
        h += '</div>';
      }
    }
    $('app').innerHTML = h; if (MSG) msg(MSG);
    var gotoWeek = function (n) { var w = addD(WEEK, 7 * n); WEEK = w; if (weekInMonth(w)) { render(); return; } var ymW = (n > 0 ? w : addD(w, 6)).slice(0, 7); load(ymW, true); };
    $('prev').onclick = function () { if (weekMode) gotoWeek(-1); else load(addYm(YM, -1)); }; $('next').onclick = function () { if (weekMode) gotoWeek(1); else load(addYm(YM, 1)); };
    document.querySelectorAll('[data-view]').forEach(function (b) { b.onclick = function () { VIEW = b.getAttribute('data-view'); try { localStorage.setItem('sched_view', VIEW); } catch (e1) {} if (VIEW === 'week' && (!WEEK || !weekInMonth(WEEK))) WEEK = defaultWeek(); render(); }; });
    if (!past) {
      var fail = function (x) { msg('失敗：' + ((x && (x.detail || x.error)) || '後台沒回應，請重試')); load(YM, true); };
      $('draft').onclick = function () { if (busySaving()) { msg('還在儲存剛才的改動，等一下再按'); return; } if (rows.length && !confirm('重新照慣例排會蓋掉你調整過的班，確定？')) return; busy(this, '排班中'); T.api('schedDraft', { ym: YM }).then(function (x) { if (!x.ok) return fail(x); MSG = '已排 ' + x.count + ' 場' + ((x.warn || []).length ? '。注意：' + x.warn.join('；') : ''); if (x.view && x.view.ok) { DATA = x.view; render(); } else load(YM, true); }).catch(fail); };
      var sb = $('submit'); if (sb) sb.onclick = function () { if (busySaving()) { msg('還在儲存剛才的改動，等一下再送'); return; } var warnN = rows.filter(function (x) { return x.holiday && String(x.note || '').indexOf('照排') < 0; }).length; var forceH = false; if (warnN) { if (!confirm('還有 ' + warnN + ' 個班在假日。客戶確認假日照常要做才按確定；否則按取消回去移班。')) return; forceH = true; } if (!confirm('送出 ' + YM + ' 的班表給 Wayne 核可？')) return; busy(this, '送出中'); T.api('schedSubmit', { ym: YM, forceHolidays: forceH ? '1' : '' }).then(function (x) { if (!x.ok) return fail(x); msg('已送出（' + x.apId + '），等 Wayne 核可'); load(YM, true); }).catch(fail); };
      var wb = $('withdraw'); if (wb) wb.onclick = function () { if (busySaving()) { msg('還在儲存剛才的改動，等一下再按'); return; } if (!confirm('撤回這個月的送件、回到草稿重排？')) return; busy(this, '撤回中'); T.api('schedWithdraw', { ym: YM }).then(function (x) { if (!x.ok) return fail(x); msg('已撤回，回到草稿'); load(YM, true); }).catch(fail); };
      document.querySelectorAll('.chip[data-k]').forEach(function (c) { c.onclick = function (ev) { ev.stopPropagation(); if (c.dataset.dragged) { delete c.dataset.dragged; return; } var k = c.getAttribute('data-k').split('|'); openSheet(rows.filter(function (x) { return x.siteCode === k[0] && x.date === k[1] && x.slot === k[2]; })[0]); }; });
      document.querySelectorAll('.day[data-d]').forEach(function (d) { d.onclick = function () { openAdd(d.getAttribute('data-d')); }; });
      bindDrag();
      var fh = $('fixhol'); if (fh) fh.onclick = function () { if (busySaving()) { msg('還在儲存剛才的改動，等一下再按'); return; } busy(fh, '處理中'); INFLIGHT = true; T.api('schedFixHolidays', { ym: YM }).then(function (x) { INFLIGHT = false; pump(); if (!x.ok) return fail(x); MSG = (x.moved.length ? '已改期：' + x.moved.join('、') : '') + (x.dropped.length ? (x.moved.length ? '；' : '') + '這次不排：' + x.dropped.join('、') : '') || '沒有需要處理的假日班'; if (x.view && x.view.ok) { DATA = x.view; render(); } else refresh(); }).catch(function () { INFLIGHT = false; pump(); fail(null); }); };
      document.querySelectorAll('[data-cov]').forEach(function (el) { el.onclick = function () { var q = el.getAttribute('data-cov').split('|'); openAdd(bestDateFor(Number(q[1])), q[0]); }; });
    }
  }
  function shortLabel(n) {   // 月曆格子很窄：去掉地區前綴、公司字尾，讓前幾個字就看得出是哪家
    n = String(n || '').replace(/^([^｜|]{1,4})[｜|]\s*/, '$1').replace(/\s*(股份)?有限公司$/, '').replace(/^台灣(?=[^\s])/, '').replace(/\s+/g, '');   // 「台北｜九五太承」保留台北，才分得出台北／文山
    return n;
  }
  function msg(t) { MSG = t; var m = $('msg'); if (m) m.textContent = t; }
  function preCheck(site, p, rows, skipKey) {   // 與後端 _schedCheck_ 同規則，先在手機上擋，不用等後台
    var wd = wdOf(p.newDate); var name = site.shortName || p.siteCode;
    if (site.noDays && site.noDays.indexOf(wd) >= 0) return name + ' 客戶不可排週' + WD[wd - 1];
    if (site.fixedStart) { var want = parseInt(site.fixedStart, 10) < 12 ? '上午' : '下午'; if (p.newSlot !== want || Number(p.newOrder) !== 1) return name + ' 客戶指定 ' + site.fixedStart + ' 開始，只能排' + want + '第 1 站'; }
    for (var i = 0; i < rows.length; i++) { var r = rows[i]; if (r.siteCode === p.siteCode && r.date === p.newDate && r.slot === p.newSlot && (r.siteCode + '|' + r.date + '|' + r.slot) !== skipKey) return '這天' + p.newSlot + '已經有 ' + name + ' 了'; }
    return '';
  }
  function rowsSig(rows) { return (rows || []).map(function (r) { return r.siteCode + '|' + r.date + '|' + r.slot + '|' + r.order + '|' + (r.pendingChange || ''); }).sort().join(';'); }
  function refresh() {   // 背景更新：不顯示「載入中」；還有改動在存就等存完再更新，免得蓋掉畫面上剛拖的
    if (busySaving()) { REFRESH_PENDING = true; return; }
    T.api('schedMonth', { ym: YM }).then(function (r) { if (busySaving()) { REFRESH_PENDING = true; return; } if (r && r.ok && r.ym === YM) { DATA = r; render(); } }).catch(function () {});
  }
  function doMove(x, p, force, ui) {   // 移班共用（表單、拖曳、加班、移除）：先擋規則→假日確認→先畫再排隊送出（拖完可以馬上拖下一個）；後端照順序存，最後一筆回來才對帳
    ui = ui || {}; var approved = DATA.status === '已核可';
    if (force) p.force = '1';
    if (!force && !p.remove) {
      var pe = preCheck({ shortName: x.shortName, siteCode: x.siteCode, noDays: x.noDays, fixedStart: x.fixedStart }, p, DATA.rows || [], p.add ? '' : x.siteCode + '|' + x.date + '|' + x.slot); if (pe) { if (ui.err) ui.err(pe); else { MSG = pe; render(); } return; }
