<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>植間員工｜排班</title>
<link rel="stylesheet" href="staff.css?v=6">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js?v=5"></script>
<script src="staff.js?v=7"></script>
<style>
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cal .day{min-height:64px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px;font-size:11px;position:relative}
.cal .day.out{background:transparent;border-color:transparent}
.cal .day.hol{background:#FFF1E6}
.cal .day.today{border-color:#5F6F52;box-shadow:inset 0 0 0 1px #5F6F52}
.cal .day .dn{font-size:11px;color:var(--muted);margin-bottom:2px}
.cal .day.hol .dn{color:#9A4E1E}
.cal .day .hn{font-size:9px;color:#9A4E1E;line-height:1.1;margin-bottom:2px}
.chip{display:block;border-radius:6px;padding:2px 3px;margin-bottom:2px;font-size:10px;line-height:1.2;border:1px solid #D9D2C0;background:#F3F0E6;color:#3E3A30;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.pm{background:#E9EEF5;border-color:#C9D3E3}
.chip.warn{background:#FFE9DC;border-color:#F1C5AA;color:#8C3B25}
.chip.punch{background:#E3EFE1;border-color:#C6DCC3;color:#3D6B3A}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:14px 16px 24px;z-index:20;display:none}
.sheet.on{display:block}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19;display:none}.mask.on{display:block}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#EEE9DD;color:#5A5344}
.st.wait{background:#FFF1E6;color:#9A4E1E}.st.ok{background:#E3EFE1;color:#3D6B3A}
.legend{font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">YUZHI PLANT DESIGN · 排班</div>
  <div id="app"><div class="card"><div class="note">載入中…</div></div></div>
  <div class="ft"><a class="lnk" id="home-lnk" href="index.html">回員工首頁</a><br>植間設計股份有限公司<br><span id="pgv"></span></div>
</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<script>
(function () {
  var T = window.STAFF, esc = T.esc, $ = T.$;
  $('pgv').textContent = T.CFG.version || '';
  $('home-lnk').href = T.href('index.html');
  var WD = ['一', '二', '三', '四', '五', '六', '日'];
  var ME = null, YM = T.qs.get('ym') || '', DATA = null, MSG = '';
  function thisYm() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function addYm(ym, n) { var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + n; var d = new Date(y, m, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function wdOf(ds) { var d = new Date(ds + 'T00:00:00'); var w = d.getDay(); return w === 0 ? 7 : w; }
  function daysOf(ym) { var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)); var n = new Date(y, m, 0).getDate(); var out = []; for (var i = 1; i <= n; i++) out.push(ym + '-' + String(i).padStart(2, '0')); return out; }
  function md(ds) { return ds.slice(5).replace('-', '/'); }
  function stChip(s) { var cls = s === '待核可' ? 'wait' : (s === '已核可' ? 'ok' : ''); return '<span class="st ' + cls + '">' + esc(s || '未建立') + '</span>'; }
  function load(ym, keep) {
    if (!keep) MSG = ''; YM = ym; $('app').innerHTML = '<div class="card"><div class="note"><span class="spin"></span>載入 ' + esc(ym) + '…</div></div>';
    T.api('schedMonth', { ym: ym }).then(function (r) { if (!r || !r.ok) { T.showErr(T.errText(r)); return; } DATA = r; render(); }).catch(function () { T.showErr('載入失敗，請重試'); });
  }
  function render() {
    var r = DATA, ym = r.ym, past = r.mode === 'past', rows = r.rows || [], hol = r.holidays || {};
    var byDate = {}; rows.forEach(function (x) { (byDate[x.date] = byDate[x.date] || []).push(x); });
    var h = '<div class="hd"><div><h1>' + esc(ym.replace('-', ' / ')) + '</h1><div class="sub">' + (past ? '過去月份：顯示實際打卡' : stChip(r.status) + (r.apId ? '　' + esc(r.apId) : '')) + '</div></div></div>';
    h += '<div class="two" style="margin-bottom:10px"><button class="btn secondary sm" id="prev">‹ 上個月</button><button class="btn secondary sm" id="next">下個月 ›</button></div>';
    if (!past) {
      h += '<div class="small muted" style="margin:-4px 0 8px"><a class="lnk" href="' + T.href('manual.html') + '#schedule">怎麼排？看教學</a></div>';
      var locked = r.status === '已核可' || r.status === '待核可';
      h += '<div class="card" style="padding:10px 12px">';
      if (r.status === '未建立' || !rows.length) h += '<div class="note">這個月還沒排。按下面一鍵照慣例鋪滿，再調整。</div>';
      else if (r.status === '草稿') h += '<div class="note">草稿：點任何一個班可以移日期、改上下午、改順序。確認後按「送出核可」。</div>';
      else if (r.status === '待核可') h += '<div class="note">已送出，等 Wayne 核可。要改先按「撤回重排」。</div>';
      else if (r.status === '已核可') h += '<div class="note">已核可，班表生效。</div>';
      h += '<div class="two" style="margin-top:8px">'
        + '<button class="btn sm" id="draft"' + (locked ? ' disabled' : '') + '>' + (rows.length ? '重新照慣例排' : '照慣例排') + '</button>'
        + (r.status === '待核可' ? '<button class="btn secondary sm" id="withdraw">撤回重排</button>' : '<button class="btn sm" id="submit"' + (locked || !rows.length ? ' disabled' : '') + '>送出核可</button>') + '</div>'
        + '<div class="small muted" id="msg" style="margin-top:6px"></div></div>';
    }
    h += '<div class="card" style="padding:8px"><div class="cal">' + WD.map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    var days = daysOf(ym), first = wdOf(days[0]);
    for (var i = 1; i < first; i++) h += '<div class="day out"></div>';
    days.forEach(function (ds) {
      var hh = hol[ds], isHol = hh && hh.kind !== '補班';
      h += '<div class="day' + (isHol ? ' hol' : '') + (ds === r.today ? ' today' : '') + '" data-d="' + ds + '"><div class="dn">' + Number(ds.slice(8)) + '</div>' + (hh ? '<div class="hn">' + esc(hh.name) + '</div>' : '');
      if (past) { (r.punches[ds] || []).forEach(function (p) { h += '<span class="chip punch">' + esc(p.time) + ' ' + esc(p.siteName).slice(0, 6) + '</span>'; }); }
      else (byDate[ds] || []).forEach(function (x) { h += '<span class="chip' + (x.slot === '下午' ? ' pm' : '') + ((x.holiday && String(x.note || '').indexOf('照排') < 0) || /不可排/.test(x.note || '') ? ' warn' : '') + '" data-k="' + esc(x.siteCode) + '|' + esc(x.date) + '|' + esc(x.slot) + '">' + esc(x.slot === '下午' ? '午' : '早') + x.order + ' ' + esc(x.shortName).slice(0, 5) + (x.startTime ? ' ' + esc(x.startTime) : '') + '</span>'; });
      h += '</div>';
    });
    h += '</div><div class="legend">早／午＝上午／下午，數字＝當天第幾站。橘底＝假日；橘框的班要移。</div></div>';
    if (!past && (r.mySites || []).length) h += '<div class="card" style="padding:10px 12px"><div class="small"><b>我的客戶規則</b></div>' + r.mySites.map(function (s) { return '<div class="small muted">' + esc(s.shortName) + '：' + (s.weekday ? (s.freq === '週' ? '每週' : s.freq === '月' ? '每月週' : (s.freq ? s.freq + '・' : '') + '週') + WD[s.weekday - 1] : (s.freq || '')) + (s.slot ? '・' + s.slot : '') + (s.noDays && s.noDays.length ? '・不可排週' + s.noDays.map(function (n) { return WD[n - 1]; }).join('、') : '') + (s.fixedStart ? '・' + s.fixedStart + ' 開始' : '') + '</div>'; }).join('') + '</div>';
    $('app').innerHTML = h; if (MSG) msg(MSG);
    $('prev').onclick = function () { load(addYm(YM, -1)); }; $('next').onclick = function () { load(addYm(YM, 1)); };
    if (!past) {
      var fail = function (x) { msg('失敗：' + ((x && (x.detail || x.error)) || '後台沒回應，請重試')); load(YM, true); };
      $('draft').onclick = function () { if (rows.length && !confirm('重新照慣例排會蓋掉你調整過的班，確定？')) return; busy(this, '排班中'); T.api('schedDraft', { ym: YM }).then(function (x) { if (!x.ok) return fail(x); msg('已排 ' + x.count + ' 場' + ((x.warn || []).length ? '。注意：' + x.warn.join('；') : '')); load(YM, true); }).catch(fail); };
      $('submit').onclick = function () { var warnN = rows.filter(function (x) { return x.holiday && String(x.note || '').indexOf('照排') < 0; }).length; var forceH = false; if (warnN) { if (!confirm('還有 ' + warnN + ' 個班在假日。客戶確認假日照常要做才按確定；否則按取消回去移班。')) return; forceH = true; } if (!confirm('送出 ' + YM + ' 的班表給 Wayne 核可？')) return; busy(this, '送出中'); T.api('schedSubmit', { ym: YM, forceHolidays: forceH ? '1' : '' }).then(function (x) { if (!x.ok) return fail(x); msg('已送出（' + x.apId + '），等 Wayne 核可'); load(YM, true); }).catch(fail); };
      var wb = $('withdraw'); if (wb) wb.onclick = function () { if (!confirm('撤回這個月的送件、回到草稿重排？')) return; busy(this, '撤回中'); T.api('schedWithdraw', { ym: YM }).then(function (x) { if (!x.ok) return fail(x); msg('已撤回，回到草稿'); load(YM, true); }).catch(fail); };
      document.querySelectorAll('.chip[data-k]').forEach(function (c) { c.onclick = function (ev) { ev.stopPropagation(); var k = c.getAttribute('data-k').split('|'); openSheet(rows.filter(function (x) { return x.siteCode === k[0] && x.date === k[1] && x.slot === k[2]; })[0]); }; });
      if (r.status === '草稿' || r.status === '未建立') document.querySelectorAll('.day[data-d]').forEach(function (d) { d.onclick = function () { openAdd(d.getAttribute('data-d')); }; });
    }
  }
  function msg(t) { MSG = t; var m = $('msg'); if (m) m.textContent = t; }
  function busy(b, t) { b.disabled = true; b.textContent = t; }
  function closeSheet() { $('sheet').classList.remove('on'); $('mask').classList.remove('on'); }
  $('mask').onclick = closeSheet;
  function openSheet(x) {
    if (!x) return; var locked = DATA.status === '已核可' || DATA.status === '待核可';
    var days = daysOf(YM);
    var h = '<div class="small" style="margin-bottom:8px"><b>' + esc(x.shortName) + '</b>　' + esc(md(x.date)) + '（' + WD[wdOf(x.date) - 1] + '）' + esc(x.slot) + ' 第 ' + x.order + ' 站' + (x.holiday ? '<br><span style="color:#8C3B25">這天是 ' + esc(x.holiday) + (String(x.note || '').indexOf('照排') >= 0 ? '，已確認照排' : '，請移到別天') + '</span>' : '') + (x.fixedStart ? '<br>客戶指定 ' + esc(x.fixedStart) + ' 開始（固定' + (parseInt(x.fixedStart, 10) < 12 ? '上午' : '下午') + '第 1 站）' : '') + (x.noDays && x.noDays.length ? '<br>不可排週' + x.noDays.map(function (n) { return WD[n - 1]; }).join('、') : '') + '</div>';
    if (locked) h += '<div class="note">已送出，不能改。</div><button class="btn secondary sm" id="sh-close">關閉</button>';
    else h += '<div class="two"><div class="fld"><label>日期</label><select id="sh-date">' + days.map(function (d) { var hh = DATA.holidays[d]; return '<option value="' + d + '"' + (d === x.date ? ' selected' : '') + '>' + md(d) + '（' + WD[wdOf(d) - 1] + '）' + (hh && hh.kind !== '補班' ? ' 假' : '') + '</option>'; }).join('') + '</select></div>'
      + '<div class="fld"><label>時段</label><select id="sh-slot"><option' + (x.slot === '上午' ? ' selected' : '') + '>上午</option><option' + (x.slot === '下午' ? ' selected' : '') + '>下午</option></select></div></div>'
      + '<div class="fld"><label>當天順序</label><select id="sh-order">' + [1, 2, 3, 4, 5, 6].map(function (n) { return '<option value="' + n + '"' + (n === x.order ? ' selected' : '') + '>第 ' + n + ' 站</option>'; }).join('') + '</select></div>'
      + '<div class="small muted" id="sh-msg" style="margin:6px 0"></div>'
      + '<div class="two"><button class="btn sm" id="sh-save">儲存</button><button class="btn secondary sm" id="sh-close">取消</button></div>'
      + '<div style="margin-top:8px"><a href="#" id="sh-remove" class="lnk small">這個月不跑這家（移除）</a></div>';
    $('sheet').innerHTML = h; $('sheet').classList.add('on'); $('mask').classList.add('on');
    $('sh-close').onclick = closeSheet;
    if (locked) return;
    var save = function (force) {
      var p = { ym: YM, siteCode: x.siteCode, date: x.date, slot: x.slot, newDate: $('sh-date').value, newSlot: $('sh-slot').value, newOrder: $('sh-order').value };
      if (force) p.force = '1';
      $('sh-msg').textContent = '儲存中…';
      T.api('schedMove', p).then(function (r) {
        if (r.ok) { closeSheet(); load(YM); return; }
        if (r.error === 'holiday' && !force) { if (confirm(r.detail + '\n\n客戶確認假日照常要做的話可以照排。要照排嗎？')) return save(true); $('sh-msg').textContent = ''; return; }
        $('sh-msg').textContent = r.detail || r.error;
      }).catch(function () { $('sh-msg').textContent = '後台沒回應，請再按一次'; });
    };
    $('sh-save').onclick = function () { save(false); };
    $('sh-remove').onclick = function (ev) { ev.preventDefault(); if (!confirm('這個月不排 ' + x.shortName + '？（下個月照慣例排時會回來）')) return; T.api('schedMove', { ym: YM, siteCode: x.siteCode, date: x.date, slot: x.slot, remove: '1' }).then(function (r) { if (r.ok) { closeSheet(); load(YM); } else $('sh-msg').textContent = r.detail || r.error; }).catch(function () { $('sh-msg').textContent = '後台沒回應，請再按一次'; }); };
  }
  function openAdd(ds) {
    var sites = DATA.mySites || []; if (!sites.length) return;
    var hh = DATA.holidays[ds];
    var h = '<div class="small" style="margin-bottom:8px"><b>' + esc(md(ds)) + '（' + WD[wdOf(ds) - 1] + '）</b> 加一個班' + (hh && hh.kind !== '補班' ? '<br><span style="color:#8C3B25">這天是 ' + esc(hh.name) + '</span>' : '') + '</div>'
      + '<div class="fld"><label>客戶</label><select id="ad-site">' + sites.map(function (s) { return '<option value="' + esc(s.siteCode) + '">' + esc(s.shortName) + '</option>'; }).join('') + '</select></div>'
      + '<div class="two"><div class="fld"><label>時段</label><select id="ad-slot"><option>上午</option><option>下午</option></select></div><div class="fld"><label>順序</label><select id="ad-order">' + [1, 2, 3, 4, 5, 6].map(function (n) { return '<option value="' + n + '">第 ' + n + ' 站</option>'; }).join('') + '</select></div></div>'
      + '<div class="small muted" id="ad-msg" style="margin:6px 0"></div><div class="two"><button class="btn sm" id="ad-save">加入</button><button class="btn secondary sm" id="ad-close">取消</button></div>';
    $('sheet').innerHTML = h; $('sheet').classList.add('on'); $('mask').classList.add('on');
    $('ad-close').onclick = closeSheet;
    var save = function (force) { var p = { ym: YM, siteCode: $('ad-site').value, date: ds, newDate: ds, newSlot: $('ad-slot').value, newOrder: $('ad-order').value, add: '1' }; if (force) p.force = '1'; $('ad-msg').textContent = '加入中…';
      T.api('schedMove', p).then(function (r) { if (r.ok) { closeSheet(); load(YM); return; } if (r.error === 'holiday' && !force) { if (confirm(r.detail + '\n\n要照排嗎？')) return save(true); $('ad-msg').textContent = ''; return; } $('ad-msg').textContent = r.detail || r.error; }).catch(function () { $('ad-msg').textContent = '後台沒回應，請再按一次'; }); };
    $('ad-save').onclick = function () { save(false); };
  }
  T.init().then(function (me) { ME = me; load(YM || (new Date().getDate() >= 15 ? addYm(thisYm(), 1) : thisYm())); }).catch(function () {});   // 月中之後預設開下個月（排班一個月前確認）
})();
</script>
</body>
</html>
