<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>植間員工｜排班</title>
<link rel="stylesheet" href="staff.css?v=7">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js?v=5"></script>
<script src="staff.js?v=7"></script>
<style>
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cal .day{min-height:64px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px;font-size:11px;position:relative}
.cal .day.out{background:transparent;border-color:transparent}
.cal .day.hol{background:#FFF1E6}
.cal .day.today{border-color:#5F6F52;box-shadow:inset 0 0 0 1px #5F6F52}
.cal .day .dn{font-size:11px;color:var(--muted);margin-bottom:2px}
.cal .day.hol .dn{color:#9A4E1E}
.cal .day .hn{font-size:9px;color:#9A4E1E;line-height:1.1;margin-bottom:2px}
.chip{display:block;border-radius:6px;padding:2px 3px;margin-bottom:2px;font-size:10px;line-height:1.2;border:1px solid #D9D2C0;background:#F3F0E6;color:#3E3A30;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.pm{background:#E9EEF5;border-color:#C9D3E3}
.chip.warn{background:#FFE9DC;border-color:#F1C5AA;color:#8C3B25}
.chip.punch{background:#E3EFE1;border-color:#C6DCC3;color:#3D6B3A}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:14px 16px 24px;z-index:20;display:none}
.sheet.on{display:block}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19;display:none}.mask.on{display:block}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#EEE9DD;color:#5A5344}
.st.wait{background:#FFF1E6;color:#9A4E1E}.st.ok{background:#E3EFE1;color:#3D6B3A}
.legend{font-size:11px;color:var(--muted);margin-top:6px}
.chip[data-k]{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.chip.dragging{opacity:.35}
.chip.ghost{position:fixed;z-index:99;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:scale(1.08)}
.cal .day.over{outline:2px solid var(--moss);outline-offset:-2px;background:#F4F6F1}
.chip.over{outline:2px solid var(--moss)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">YUZHI PLANT DESIGN · 排班</div>
  <div id="app"><div class="card"><div class="note">載入中…</div></div></div>
  <div class="ft"><a class="lnk" id="home-lnk" href="index.html">回員工首頁</a><br>植間設計股份有限公司<br><span id="pgv"></span></div>
</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<script>
(function () {
  var T = window.STAFF, esc = T.esc, $ = T.$;
  $('pgv').textContent = T.CFG.version || '';
  $('home-lnk').href = T.href('index.html');
  var WD = ['一', '二', '三', '四', '五', '六', '日'];
  var ME = null, YM = T.qs.get('ym') || '', DATA = null, MSG = '', SAVING = false;
  function thisYm() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function addYm(ym, n) { var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + n; var d = new Date(y, m, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function wdOf(ds) { var d = new Date(ds + 'T00:00:00'); var w = d.getDay(); return w === 0 ? 7 : w; }
  function daysOf(ym) { var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)); var n = new Date(y, m, 0).getDate(); var out = []; for (var i = 1; i <= n; i++) out.push(ym + '-' + String(i).padStart(2, '0')); return out; }
  function md(ds) { return ds.slice(5).replace('-', '/'); }
  function stChip(s) { var cls = s === '待核可' ? 'wait' : (s === '已核可' ? 'ok' : ''); return '<span class="st ' + cls + '">' + esc(s || '未建立') + '</span>'; }
  function load(ym, keep) {
    if (!keep) MSG = ''; YM = ym; $('app').innerHTML = '<div class="card"><div class="note"><span class="spin"></span>載入 ' + esc(ym) + '…</div></div>';
    T.api('schedMonth', { ym: ym }).then(function (r) { if (!r || !r.ok) { T.showErr(T.errText(r)); return; } DATA = r; render(); }).catch(function () { T.showErr('載入失敗，請重試'); });
  }
  function render() {
    var r = DATA, ym = r.ym, past = r.mode === 'past', rows = r.rows || [], hol = r.holidays || {};
    var byDate = {}; rows.forEach(function (x) { (byDate[x.date] = byDate[x.date] || []).push(x); });
    var h = '<div class="hd"><div><h1>' + esc(ym.replace('-', ' / ')) + '</h1><div class="sub">' + (past ? '過去月份：顯示實際打卡' : stChip(r.status) + (r.apId ? '　' + esc(r.apId) : '')) + '</div></div></div>';
    h += '<div class="two" style="margin-bottom:10px"><button class="btn secondary sm" id="prev">‹ 上個月</button><button class="btn secondary sm" id="next">下個月 ›</button></div>';
    if (!past) {
      h += '<div class="small muted" style="margin:-4px 0 8px"><a class="lnk" href="' + T.href('manual.html') + '#schedule">怎麼排？看教學</a></div>';
      var approved = r.status === '已核可', locked = approved;
      h += '<div class="card" style="padding:10px 12px">';
      if (r.status === '未建立' || !rows.length) h += '<div class="note">這個月還沒排。按下面一鍵照慣例鋪滿，再調整。</div>';
      else if (r.status === '草稿') h += '<div class="note">草稿：點任何一個班可以移日期、改上下午、改順序。確認後按「送出核可」。</div>';
      else if (r.status === '待核可') h += '<div class="note">已送出，等 Wayne 核可。核可前你還是可以直接改，卡片會跟著更新。</div>';
      else if (approved) h += '<div class="note">已核可，班表生效。要改：點那個班（或點空白日期加班），寫原因送出變更申請，Wayne 核可後才生效。</div>';
      h += '<div class="two" style="margin-top:8px">'
        + '<button class="btn sm" id="draft"' + (locked ? ' disabled' : '') + '>' + (rows.length ? '重新照慣例排' : '照慣例排') + '</button>'
        + (r.status === '待核可' ? '<button class="btn secondary sm" id="withdraw">撤回重排</button>' : '<button class="btn sm" id="submit"' + (locked || !rows.length ? ' disabled' : '') + '>送出核可</button>') + '</div>'
        + '<div class="small muted" id="msg" style="margin-top:6px"></div></div>';
      var chg = r.changes || [];
      if (chg.length) h += '<div class="card" style="padding:10px 12px"><div class="small"><b>變更申請</b></div>' + chg.map(function (c) { return '<div class="small' + (c.status === '待核可' ? '' : ' muted') + '" style="margin-top:4px">' + stChip(c.status) + ' ' + esc(c.desc) + (c.reason ? '<br><span class="muted">原因：' + esc(c.reason) + '</span>' : '') + (c.result ? '<br><span class="muted">' + esc(c.result) + '</span>' : '') + '</div>'; }).join('') + '</div>';
    }
    h += '<div class="card" style="padding:8px"><div class="cal">' + WD.map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    var days = daysOf(ym), first = wdOf(days[0]);
    for (var i = 1; i < first; i++) h += '<div class="day out"></div>';
    days.forEach(function (ds) {
      var hh = hol[ds], isHol = hh && hh.kind !== '補班';
      h += '<div class="day' + (isHol ? ' hol' : '') + (ds === r.today ? ' today' : '') + '" data-d="' + ds + '"><div class="dn">' + Number(ds.slice(8)) + '</div>' + (hh ? '<div class="hn">' + esc(hh.name) + '</div>' : '');
      if (past) { (r.punches[ds] || []).forEach(function (p) { h += '<span class="chip punch">' + esc(p.time) + ' ' + esc(shortLabel(p.siteName)) + '</span>'; }); }
      else (byDate[ds] || []).forEach(function (x) { h += '<span class="chip' + (x.slot === '下午' ? ' pm' : '') + ((x.holiday && String(x.note || '').indexOf('照排') < 0) || /不可排/.test(x.note || '') ? ' warn' : '') + (x.pendingChange ? ' req' : '') + '" data-k="' + esc(x.siteCode) + '|' + esc(x.date) + '|' + esc(x.slot) + '" title="' + esc(x.shortName) + (x.startTime ? ' ' + esc(x.startTime) : '') + '">' + esc(x.slot === '下午' ? '午' : '早') + x.order + ' ' + esc(shortLabel(x.shortName)) + '</span>'; });
      h += '</div>';
    });
    h += '</div><div class="legend">早／午＝上午／下午，數字＝當天第幾站。長按一個班可以拖到別天，或拖到另一個班上改順序。橘底＝假日；橘框的班要移。</div></div>';
    if (!past && (r.mySites || []).length) {   // 只提醒有客戶限制的、和沒固定星期要自己加的；其他不列（Wayne：整排規則太亂沒幫助）
      var lim = r.mySites.filter(function (s) { return s.fixedStart || (s.noDays && s.noDays.length) || s.slot; });
      var selfAdd = r.mySites.filter(function (s) { return !s.weekday && /週|月/.test(s.freq || ''); });
      if (lim.length || selfAdd.length) {
        h += '<div class="card" style="padding:10px 12px"><div class="small"><b>提醒</b></div>';
        if (lim.length) h += '<div class="small muted">客戶限制：' + lim.map(function (s) { return esc(s.shortName) + ' ' + [s.fixedStart ? s.fixedStart + ' 開始' : (s.slot ? '只排' + s.slot : ''), s.noDays && s.noDays.length ? '不可週' + s.noDays.map(function (n) { return WD[n - 1]; }).join('、') : ''].filter(Boolean).join('・'); }).join('；') + '</div>';
        if (selfAdd.length) h += '<div class="small muted">沒固定星期、要自己點日期加：' + selfAdd.map(function (s) { return esc(s.shortName); }).join('、') + '</div>';
        h += '</div>';
      }
    }
    $('app').innerHTML = h; if (MSG) msg(MSG);
    $('prev').onclick = function () { load(addYm(YM, -1)); }; $('next').onclick = function () { load(addYm(YM, 1)); };
    if (!past) {
      var fail = function (x) { msg('失敗：' + ((x && (x.detail || x.error)) || '後台沒回應，請重試')); load(YM, true); };
      $('draft').onclick = function () { if (SAVING) { msg('還在儲存上一筆，等一下'); return; } if (rows.length && !confirm('重新照慣例排會蓋掉你調整過的班，確定？')) return; busy(this, '排班中'); T.api('schedDraft', { ym: YM }).then(function (x) { if (!x.ok) return fail(x); MSG = '已排 ' + x.count + ' 場' + ((x.warn || []).length ? '。注意：' + x.warn.join('；') : ''); if (x.view && x.view.ok) { DATA = x.view; render(); } else load(YM, true); }).catch(fail); };
      var sb = $('submit'); if (sb) sb.onclick = function () { if (SAVING) { msg('還在儲存上一筆，等一下再送'); return; } var warnN = rows.filter(function (x) { return x.holiday && String(x.note || '').indexOf('照排') < 0; }).length; var forceH = false; if (warnN) { if (!confirm('還有 ' + warnN + ' 個班在假日。客戶確認假日照常要做才按確定；否則按取消回去移班。')) return; forceH = true; } if (!confirm('送出 ' + YM + ' 的班表給 Wayne 核可？')) return; busy(this, '送出中'); T.api('schedSubmit', { ym: YM, forceHolidays: forceH ? '1' : '' }).then(function (x) { if (!x.ok) return fail(x); msg('已送出（' + x.apId + '），等 Wayne 核可'); load(YM, true); }).catch(fail); };
      var wb = $('withdraw'); if (wb) wb.onclick = function () { if (SAVING) { msg('還在儲存上一筆，等一下'); return; } if (!confirm('撤回這個月的送件、回到草稿重排？')) return; busy(this, '撤回中'); T.api('schedWithdraw', { ym: YM }).then(function (x) { if (!x.ok) return fail(x); msg('已撤回，回到草稿'); load(YM, true); }).catch(fail); };
      document.querySelectorAll('.chip[data-k]').forEach(function (c) { c.onclick = function (ev) { ev.stopPropagation(); if (c.dataset.dragged) { delete c.dataset.dragged; return; } if (SAVING) return; var k = c.getAttribute('data-k').split('|'); openSheet(rows.filter(function (x) { return x.siteCode === k[0] && x.date === k[1] && x.slot === k[2]; })[0]); }; });
      document.querySelectorAll('.day[data-d]').forEach(function (d) { d.onclick = function () { if (SAVING) return; openAdd(d.getAttribute('data-d')); }; });
      bindDrag();
    }
  }
  function shortLabel(n) {   // 月曆格子很窄：去掉地區前綴、公司字尾，讓前幾個字就看得出是哪家
    n = String(n || '').replace(/^[^｜|]{1,4}[｜|]\s*/, '').replace(/\s*(股份)?有限公司$/, '').replace(/^(台灣|台北|新北|桃園)(?=[^\s])/, '').replace(/\s+/g, '');
    return n;
  }
  function msg(t) { MSG = t; var m = $('msg'); if (m) m.textContent = t; }
  function preCheck(site, p, rows, skipKey) {   // 與後端 _schedCheck_ 同規則，先在手機上擋，不用等後台
    var wd = wdOf(p.newDate); var name = site.shortName || p.siteCode;
    if (site.noDays && site.noDays.indexOf(wd) >= 0) return name + ' 客戶不可排週' + WD[wd - 1];
    if (site.fixedStart) { var want = parseInt(site.fixedStart, 10) < 12 ? '上午' : '下午'; if (p.newSlot !== want || Number(p.newOrder) !== 1) return name + ' 客戶指定 ' + site.fixedStart + ' 開始，只能排' + want + '第 1 站'; }
    for (var i = 0; i < rows.length; i++) { var r = rows[i]; if (r.siteCode === p.siteCode && r.date === p.newDate && r.slot === p.newSlot && (r.siteCode + '|' + r.date + '|' + r.slot) !== skipKey) return '這天' + p.newSlot + '已經有 ' + name + ' 了'; }
    return '';
  }
  function doMove(x, p, force, ui) {   // 移班共用（表單與拖曳）：先擋規則→假日確認→先畫再存→後端回來以它為準；失敗且畫面可能過時就重載
    ui = ui || {}; var approved = DATA.status === '已核可';
    if (force) p.force = '1';
    if (!force) { var pe = preCheck({ shortName: x.shortName, siteCode: x.siteCode, noDays: x.noDays, fixedStart: x.fixedStart }, p, DATA.rows || [], x.siteCode + '|' + x.date + '|' + x.slot); if (pe) { if (ui.err) ui.err(pe); else { MSG = pe; render(); } return; }
      var hhS = DATA.holidays[p.newDate]; if (hhS && hhS.kind !== '補班' && p.newDate !== x.date) { if (!confirm(md(p.newDate) + ' 是 ' + hhS.name + '。客戶確認假日照常要做的話可以照排。要照排嗎？')) return; p.force = '1'; } }
    var snap = DATA, opt = !approved;
    if (opt) { DATA = Object.assign({}, DATA, { rows: localApply(DATA.rows || [], p) }); closeSheet(); MSG = '儲存中…'; render(); } else if (ui.busy) ui.busy();
    SAVING = true;
    T.api('schedMove', p).then(function (r) {
      SAVING = false;
      if (r.ok) { if (!opt) closeSheet(); MSG = r.requested ? '已送出變更申請（' + r.apId + '），Wayne 核可後生效' : ''; if (r.view && r.view.ok) { DATA = r.view; render(); } else load(YM, !!r.requested); return; }
      if (opt) { DATA = snap; MSG = ''; render(); }
      if (r.error === 'holiday' && !force) { if (confirm(r.detail + '\n\n客戶確認假日照常要做的話可以照排。要照排嗎？')) doMove(x, p, true, ui); else if (!opt && ui.err) ui.err(''); return; }   // 重送用同一份 p，不再回頭讀表單（表單可能已換成別的班）
      var fresh = ['rule', 'reason_required', 'no_change', 'change_pending'].indexOf(r.error) >= 0;   // 規則類＝畫面沒過時；重複、找不到、鎖住多半是畫面比後台舊（上一筆其實存到了）→ 重載
      if (!fresh) { MSG = '後台的班表跟畫面不同步（' + (r.detail || r.error || '沒回應') + '），已重新載入'; load(YM, true); return; }
      if (opt) { MSG = '沒儲存：' + (r.detail || r.error); render(); } else if (ui.err) ui.err(r.detail || r.error);
    }).catch(function () { SAVING = false; MSG = '後台沒回應，重新載入確認有沒有存到'; load(YM, true); });
  }
  function bindDrag() {   // 長按 0.35 秒拖到別天（移日期）或別的班上（插到它的位置）；已核可要寫原因，不開放拖
    if (DATA.status === '已核可' || DATA.mode === 'past') return;
    document.querySelectorAll('.chip[data-k]').forEach(function (c) {
      c.addEventListener('pointerdown', function (ev) {
        if (ev.pointerType === 'mouse' && ev.button !== 0) return; if (SAVING) return;
        var k = c.getAttribute('data-k'), sx = ev.clientX, sy = ev.clientY, pid = ev.pointerId, timer = null, started = false, ghost = null, target = null;
        var clear = function () { document.querySelectorAll('.day.over,.chip.over').forEach(function (q) { q.classList.remove('over'); }); };
        var end = function () { clearTimeout(timer); document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp); document.removeEventListener('pointercancel', onUp); if (ghost) ghost.remove(); clear(); c.classList.remove('dragging'); };
        var onMove = function (e) {
          if (!started) { if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) end(); return; }
          e.preventDefault(); ghost.style.left = (e.clientX + 10) + 'px'; ghost.style.top = (e.clientY - 16) + 'px';
          var el = document.elementFromPoint(e.clientX, e.clientY); var chip = el && el.closest ? el.closest('.chip[data-k]') : null; var day = el && el.closest ? el.closest('.day[data-d]') : null; clear(); target = null;
          if (chip && chip !== c) { chip.classList.add('over'); target = { chip: chip.getAttribute('data-k') }; } else if (day) { day.classList.add('over'); target = { day: day.getAttribute('data-d') }; }
        };
        var onUp = function () { var was = started, t = target; end(); if (!was) return; c.dataset.dragged = '1'; setTimeout(function () { delete c.dataset.dragged; }, 400); if (t) dropTo(k, t); };
        timer = setTimeout(function () { started = true; try { c.setPointerCapture(pid); } catch (e0) {} c.classList.add('dragging'); ghost = c.cloneNode(true); ghost.className = 'chip ghost'; document.body.appendChild(ghost); ghost.style.left = (sx + 10) + 'px'; ghost.style.top = (sy - 16) + 'px'; if (navigator.vibrate) navigator.vibrate(15); }, 350);
        document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp); document.addEventListener('pointercancel', onUp);
      });
    });
  }
  function dropTo(k, t) {
    var find = function (key) { var q = key.split('|'); return (DATA.rows || []).filter(function (r) { return r.siteCode === q[0] && r.date === q[1] && r.slot === q[2]; })[0]; };
    var x = find(k); if (!x) return; var p = { ym: YM, siteCode: x.siteCode, date: x.date, slot: x.slot };
    if (t.chip) { var tr = find(t.chip); if (!tr) return; p.newDate = tr.date; p.newSlot = tr.slot; p.newOrder = tr.order; }
    else { if (t.day === x.date) return; p.newDate = t.day; p.newSlot = x.slot; p.newOrder = (DATA.rows || []).filter(function (r) { return r.date === t.day && r.slot === x.slot; }).length + 1; }
    if (p.newDate === x.date && p.newSlot === x.slot && Number(p.newOrder) === x.order) return;
    doMove(x, p, false, null);
  }
  function localApply(rows, p) {   // 先畫再存：與後端同一套移班／排序規則，後端回來再以它為準
    var out = rows.map(function (x) { var o = {}; for (var k in x) o[k] = x[k]; return o; });
    var idx = -1; if (!p.add) for (var i = 0; i < out.length; i++) if (out[i].siteCode === p.siteCode && out[i].date === p.date && out[i].slot === p.slot) { idx = i; break; }
    if (p.remove) { if (idx >= 0) out.splice(idx, 1); return out; }
    var site = (DATA.mySites || []).filter(function (s) { return s.siteCode === p.siteCode; })[0] || {}; var hh = DATA.holidays[p.newDate]; var no = Number(p.newOrder) || 0; var r;
    if (idx < 0) { r = { date: p.newDate, slot: p.newSlot, order: 99, siteCode: p.siteCode, siteName: site.shortName || p.siteCode, shortName: site.shortName || p.siteCode, startTime: site.fixedStart || '', source: '手動', note: '', fixedStart: site.fixedStart || '', noDays: site.noDays || [] }; out.push(r); if (no) r.order = no - 0.5; }
    else { r = out[idx]; var back = r.date === p.newDate && r.slot === p.newSlot && no > r.order; r.date = p.newDate; r.slot = p.newSlot; r.source = '手動'; r.note = ''; if (no) r.order = back ? no + 0.5 : no - 0.5; else r.order = 99; }
    r.holiday = (hh && hh.kind !== '補班') ? hh.name : '';
