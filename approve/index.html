      if (pl.toolUrl) html += '<button class="btn-tune" type="submit" name="decision" value="tool">' + esc(pl.toolLabel || '開排刀台') + '<span>' + esc(pl.toolSubLabel || '調剪輯順序與每刀長度（調完送出、原件自動退回重出）') + '</span></button>';
      html += '<details><summary>需要調整？退回給 ' + esc(from) + '</summary><select name="reasonKind"><option value="">退回類型</option><option>語氣</option><option>事實錯</option><option>不該回</option><option>金額</option></select><textarea name="reason" placeholder="退回原因（會回到協作板通知投稿方）"></textarea><button class="btn-ghost" type="submit" name="decision" value="reject" data-confirm="確定退回？">退回</button></details></form>';
    } else if (status === '已排程') {
      html += '<div class="note">已排程：<b>' + esc(it.publishAt || '') + '</b> 自動發佈（時間到系統自己跑、完成後 LINE 通知你）。</div>';
      html += formHead() + hidden('decision', 'publishnow') + '<button class="btn-main" type="submit" data-confirm="改成現在立刻發佈？">改為立即發佈</button></form>';
      html += formHead() + hidden('decision', 'reschedule') + '<div class="schedbox"><div class="schedlabel">改期到</div><input type="datetime-local" name="publishAt" value="' + esc(String(it.publishAt || '').replace(' ', 'T')) + '"></div><button class="btn-tune" type="submit" style="margin-top:10px;" data-confirm="確定改期？">改期（照上面時間重排）</button></form>';
      html += formHead() + hidden('decision', 'cancel') + '<button class="btn-ghost" type="submit" data-confirm="確定取消排程？件會退回投稿方。">取消排程並退回</button></form>';
    } else {
      var links = '';
      if (res.igPermalink) links += '<a href="' + esc(res.igPermalink) + '">IG 貼文：' + esc(res.igPermalink) + '</a>';
      if (res.fbUrl) links += '<a href="' + esc(res.fbUrl) + '">FB 貼文：' + esc(res.fbUrl) + '</a>';
      if (links) html += '<div class="links">' + links + '</div>';
      if (res.fbError) html += '<div class="note">FB 未成功：' + esc(res.fbError) + '</div>';
      if (res.error) html += '<div class="note">失敗原因：' + esc(res.error) + '</div>';
      if (res.reason) html += '<div class="note">退回原因：' + esc(res.reason) + '</div>';
      if (res.lineSent) html += '<div class="note">已發送給客戶 ' + esc(res.sentAt || '') + '</div>';
      if (res.execResult) html += '<div class="note"><b>執行結果</b>：' + esc(res.execResult) + '</div>';
      if (res.lineSendError) html += '<div class="note">發送失敗：' + esc(res.lineSendError) + '</div>';
      if (res.dryRun) html += '<div class="note">測試件（dryRun）：流程驗證用、未實際發佈。</div>';
      if (it.decidedAt) html += '<div class="note">決定時間：' + esc(it.decidedAt) + '</div>';
      html += nextButtons();
    }
    app.innerHTML = html;
    if (status !== '待核可' && status !== '已排程') resolveNext();
    wire();
    if (status === '待核可' && !isPub) wireChoices(confirmMsg);
    if (status === '發佈中') setTimeout(function () { location.reload(); }, 30000);
    loadExtras(status);
  }

  var lastBtn = null;
  document.addEventListener('click', function (ev) { var t = ev.target && ev.target.closest ? ev.target.closest('button') : null; if (t && t.type === 'submit') lastBtn = t; }, true);   // 舊 iOS Safari 沒有 ev.submitter、按鈕也不會拿到焦點
  window.addEventListener('pageshow', function () { if (SENT) return; Array.prototype.forEach.call(document.querySelectorAll('form.busy'), function (f) { f.classList.remove('busy'); }); });   // 從 GAS 結果頁按返回（bfcache）時解鎖
  var FETCH_DECISIONS = { approve: 1, skip: 1, reject: 1, publishnow: 1, reschedule: 1, cancel: 1 };
  var DECISION_LABEL = { approve: '核可', skip: '略過', reject: '退回', publishnow: '改為立即發佈', reschedule: '改期', cancel: '取消排程' };
  var SENT = false, LOADED_STATUS = '', LOADED_SIG = '', HAS_PRESELECT = false, CUR = { id: '', title: '', isCs: false }, NEXT = null;
  function nextButtons() {
    return '<a class="btn-home js-next" href="' + esc(LIST) + '" target="_top">下一張待核可</a>'
      + (CUR.isCs ? '<a class="btn-home ghost" href="' + esc(INBOX) + '" target="_top">回收件匣</a>' : '');
  }
  function sessionToken() {
    try { var s = JSON.parse(localStorage.getItem(SB_KEY) || 'null'); if (s && s.access_token && Number(s.expires_at || 0) * 1000 > Date.now() + 60000) return String(s.access_token); } catch (eT) {}
    return '';
  }
  function goFix(url, email) {
    var u = null; try { u = new URL(String(url || '')); } catch (eG) { return String(url || ''); }
    var em = String(email || '').trim().toLowerCase(), dom = em.indexOf('@') > 0 ? em.split('@')[1] : '';
    if (u.protocol !== 'https:' || u.hostname !== 'script.google.com' || !/^[a-z0-9.-]+\.[a-z]{2,}$/.test(dom)) return u.href;
    if (dom !== 'gmail.com' && dom !== 'googlemail.com' && u.pathname.indexOf('/macros/s/') === 0) u.pathname = '/a/macros/' + dom + u.pathname.slice('/macros'.length);
    u.searchParams.set('authuser', em);
    return u.href;
  }
  function sessionEmail() { try { var s0 = JSON.parse(localStorage.getItem(SB_KEY) || 'null'); return String((s0 && s0.user && s0.user.email) || ''); } catch (eM) { return ''; } }
  function skipIds() { var o = {}; o[CUR.id] = 1; SENTLOG.list().forEach(function (r) { o[r.id] = 1; }); return o; }
  function findNext() {
    if (NEXT) return NEXT;
    var tok = sessionToken();
    if (!tok) { NEXT = Promise.resolve(null); return NEXT; }
    NEXT = fetch(GW + '?action=adminApprovals', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok }, body: '{}' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok || !Array.isArray(d.pending)) return null;
        var skip = skipIds(), left = d.pending.filter(function (x) { return x && x.status === '待核可' && !skip[x.id]; });
        if (!left.length) return { none: true };
        var u = null; try { u = new URL(String(left[0].goUrl || '')); } catch (eU) { u = null; }
        if (!u || u.protocol !== 'https:' || u.hostname !== 'script.google.com') return null;
        return { href: goFix(u.href, sessionEmail()), id: String(left[0].id || ''), title: String(left[0].title || ''), more: left.length - 1 };
      })
      .catch(function () { return null; });
    return NEXT;
  }
  function resolveNext() {
    findNext().then(function (n) {
      if (!n) return;
      Array.prototype.forEach.call(document.querySelectorAll('a.js-next'), function (a) {
        if (n.none) { a.innerHTML = '待核可都處理完了<span>回核可中心清單</span>'; return; }
        a.href = n.href;
        a.innerHTML = '下一張待核可<span>' + esc(n.id + ' ' + n.title) + (n.more > 0 ? esc('，後面還有 ' + n.more + ' 張') : '') + '</span>';
      });
    });
  }
  function addNext(el) { el.innerHTML += nextButtons(); resolveNext(); return el; }
  function lockAll(on) { Array.prototype.forEach.call(document.querySelectorAll('form'), function (f) { if (on) f.classList.add('busy'); else f.classList.remove('busy'); }); }
  function statusBox(cls, title, desc) {
    var el = document.getElementById('decideBox');
    if (!el) { el = document.createElement('div'); el.id = 'decideBox'; app.insertBefore(el, app.firstChild); }
    el.className = 'decide ' + cls; el.innerHTML = '<div class="dtitle">' + esc(title) + '</div>' + (desc ? '<div class="note">' + esc(desc) + '</div>' : '');
    try { el.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (eS) {}
    return el;
  }
  function showDone(j, label) {
    var st = j.status || '', changed = !!st && st !== LOADED_STATUS;
    var desc = (j.desc || '') + (j.execResult && (j.desc || '').indexOf(j.execResult.substring(0, 20)) < 0 ? '　' + j.execResult : '') + (j.hookText && (j.desc || '').indexOf(j.hookText.substring(0, 20)) < 0 ? '　' + j.hookText : '');
    if (!j.ok && j.error === 'line_send_unknown') {
      SENT = true; lockAll(true);
      var txU = String(j.desc || 'LINE 沒有回應，可能已送到，請先看對話紀錄，不要重按。');
      addNext(statusBox('warn', j.title || '不確定客戶有沒有收到', txU));
      SENTLOG.update(CUR.id, { state: 'unsure', text: txU });
      Array.prototype.forEach.call(document.querySelectorAll('form'), function (f) { f.style.display = 'none'; });
      return;
    }
    if (!j.ok) {   // 後台中途丟例外：狀態可能已變、客戶可能沒收到；原文照給、不說成功
      if (j.error === 'line_send_failed' && j.desc) j.error = String(j.desc);
      var el0 = statusBox('warn', '執行中斷', (j.error || '後台沒回報原因') + (st ? '　目前狀態：' + st : '') + '　請到核可中心確認，再決定要不要重送。');
      addNext(el0);
      SENTLOG.update(CUR.id, { state: 'fail', text: String(j.error || '後台沒回報原因') });
      if (changed) { SENT = true; lockAll(true); Array.prototype.forEach.call(document.querySelectorAll('form'), function (f) { f.style.display = 'none'; }); } else { SENT = false; lockAll(false); }
      return;
    }
    if (!changed) {   // 狀態沒變（內容有更新請重新整理／改期失敗／已改期…）：訊息照顯示、表單留著可再操作
      statusBox('', j.title || (label + '：後台已回覆'), desc);
      if (label === DECISION_LABEL.reschedule) SENTLOG.update(CUR.id, { state: 'note', text: String(j.title || desc || '後台已回覆') });
      SENT = false; lockAll(false);
      return;
    }
    SENT = true; lockAll(true);
    var el = statusBox('ok', (j.title || label + '完成') + ((j.title || '').indexOf(st) < 0 ? '　' + st : ''), desc);
    addNext(el);
    SENTLOG.update(CUR.id, { state: 'done', text: String(j.execResult || j.desc || ('狀態：' + st)) });
    Array.prototype.forEach.call(document.querySelectorAll('form'), function (f) { f.style.display = 'none'; });
  }
  function pollStatus(label, startedAt, decision) {
    fetch(GW + '?action=approvalView&h=' + encodeURIComponent(h), { method: 'GET' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var it = j && j.item, p = it ? SENTLOG.judge({ from: LOADED_STATUS, sig: LOADED_SIG, state: 'run', decision: decision }, it) : null;
        if (p && p.state === 'partial') { SENT = true; lockAll(true); addNext(statusBox('warn', label + '完成，但有東西沒送成', p.text)); SENTLOG.update(CUR.id, { state: 'partial', text: p.text }); Array.prototype.forEach.call(document.querySelectorAll('form'), function (f) { f.style.display = 'none'; }); return; }
        if (p && p.state === 'done') { showDone({ ok: true, status: it.status, title: label + '完成', desc: p.text, execResult: '' }, label); return; }
        if (p && p.state === 'fail') { showDone({ ok: false, status: it.status, error: p.text }, label); return; }
        if (p && p.state === 'unsure') {
          SENT = true; lockAll(true); addNext(statusBox('warn', '不確定有沒有送到', p.text));
          SENTLOG.update(CUR.id, { state: 'unsure', text: p.text });
          Array.prototype.forEach.call(document.querySelectorAll('form'), function (f) { f.style.display = 'none'; });
          return;
        }
        if (Date.now() - startedAt > 180000) {
          var moved = it && it.status && it.status !== LOADED_STATUS;
          if (!moved) { SENT = false; lockAll(false); }
          addNext(statusBox('warn', '沒收到回應', moved ? '狀態已經變成「' + it.status + '」，但 3 分鐘內沒看到執行結果，不確定有沒有做完。系統會擋重複執行，請稍後開這張卡確認，不要重按。' : '狀態仍是「' + LOADED_STATUS + '」、不確定剛才有沒有送到。系統會擋重複執行（不會重複開票、重複發送），請重新整理確認後再決定要不要再按一次。'));
          return;
        }
        setTimeout(function () { pollStatus(label, startedAt, decision); }, 5000);
      })
      .catch(function () { setTimeout(function () { pollStatus(label, startedAt, decision); }, 5000); });
  }
  function formDecision(f, btn) { if (btn && btn.name === 'decision' && btn.value) return btn.value; var hd = f.querySelector('input[name=decision]'); return hd ? hd.value : ''; }
  function submitViaFetch(f, btn) {
    var decision = formDecision(f, btn), label = DECISION_LABEL[decision] || decision;
    var body = new URLSearchParams(); Array.prototype.forEach.call(f.elements, function (el) { if (!el.name || el.name === 'decision' || el.disabled || el.type === 'submit' || el.type === 'button') return; if ((el.type === 'checkbox' || el.type === 'radio') && !el.checked) return; body.append(el.name, el.value); });
    body.append('decision', decision); body.append('respond', 'json');
    SENT = true; lockAll(true);
    SENTLOG.add({ id: CUR.id, h: h, label: label, decision: decision, from: LOADED_STATUS, sig: LOADED_SIG, title: CUR.title, url: location.pathname + '?h=' + encodeURIComponent(h), at: Date.now() });
    var t0 = Date.now(), box = addNext(statusBox('run', label + '已送出，系統在背景執行', '不用留在這頁，可以直接看下一張。留在這頁的話，做完會在這裡顯示結果。'));
    box.querySelector('.dtitle').insertAdjacentHTML('afterend', '<div class="elapsed">已過 0 秒</div>');
    var tick = setInterval(function () { var d = box.querySelector('.elapsed'); if (d) d.textContent = '已過 ' + Math.round((Date.now() - t0) / 1000) + ' 秒'; }, 1000);
    var keep = false; try { keep = new Blob([body.toString()]).size < 60000; } catch (eB) { keep = false; }
    var send = function (k) { var o = { method: 'POST', body: body, redirect: 'follow' }; if (k) o.keepalive = true; return fetch(GAS, o); };
    var req; try { req = send(keep); } catch (eK) { req = send(false); }
    req
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearInterval(tick);
        if (j && j.ok === false && !j.status && j.error) { showDone(j, label); return; }
        if (!j || (!j.ok && !j.status)) throw new Error((j && j.error) || 'bad');
        if (j.needsPage) { SENTLOG.remove(CUR.id); statusBox('warn', '這個動作要用整頁送出', '請改用最下面的備用頁面操作。'); SENT = false; lockAll(false); return; }
        showDone(j, label);
      })
      .catch(function () {
        clearInterval(tick);
        addNext(statusBox('run', label + '已送出、等後台回報…', '網路沒把結果帶回來，正在每 5 秒查一次狀態。不用留在這頁，可以直接看下一張。'));
        pollStatus(label, t0, decision);
      });
  }
  function wire() {
    Array.prototype.forEach.call(document.querySelectorAll('form'), function (f) {
      f.addEventListener('submit', function (ev) {
        var btn = ev.submitter || lastBtn, c = btn && btn.getAttribute && btn.getAttribute('data-confirm');
        if (SENT || (btn && btn.disabled) || f.classList.contains('busy')) { ev.preventDefault(); return; }
        if (c && !confirm(c)) { ev.preventDefault(); return; }
        if (FETCH_DECISIONS[formDecision(f, btn)] && window.URLSearchParams) { ev.preventDefault(); submitViaFetch(f, btn); return; }
        setTimeout(function () { f.classList.add('busy'); setTimeout(function () { f.classList.remove('busy'); }, 15000); }, 0);
      });
    });
  }

  function put(id, html) { var el = document.getElementById(id); if (!el) return; el.classList.remove('loading'); el.innerHTML = html || ''; }
  function loadExtras(status) {
    fetch(GAS + '?page=approve&h=' + encodeURIComponent(h) + '&respond=json', { method: 'GET', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || 'bad');
        var fr = j.fragments || {};
        put('ph-stage', fr.stage); put('ph-conv', fr.conv); put('ph-media', fr.media); put('ph-attach', fr.attach); put('ph-cal', fr.calendar);
        if (fr.previewImages && fr.previewImages.length) put('ph-preview', fr.previewImages.map(function (pi) { return '<span class="pimg">' + (pi.src ? '<img src="' + esc(pi.src) + '">' : '<i></i>') + esc(pi.label) + '</span>'; }).join(''));
        var fp = document.getElementById('fp'); if (fp && j.fp) fp.value = j.fp;
        if (DETAIL) mountDetail(j.detail);
        EXTRAS_OK = true; syncApprove();
        if (j.status && j.status !== status) { var n = document.createElement('div'); n.className = 'stale-banner'; n.innerHTML = '<span>這件的狀態剛變成「' + esc(j.status) + '」</span><span class="stale-hint">重新整理看最新內容。</span>'; app.insertBefore(n, app.firstChild); }
        var ver = document.getElementById('ver'); if (ver && j.serverVersion) ver.textContent = 'Pages · ' + j.serverVersion;
      })
      .catch(function () {
        // 帶推定選項的對帳卡在舊版頁面會被擋（舊版頁不送選項）：只請他重新整理，不指去舊版頁
        var failNote = HAS_PRESELECT
          ? '附掛項目這次沒載到，核可鈕先鎖住；這張對帳卡的選項只能在這頁核可，請重新整理再試。退回與略過仍可在這裡按。'
          : '';
        ['ph-conv', 'ph-attach'].forEach(function (id) { var el = document.getElementById(id); if (el && el.classList.contains('loading')) { el.classList.remove('loading'); el.innerHTML = failNote ? '<div class="note">' + esc(failNote) + '</div>' : '<div class="note">附掛項目這次沒載到，為了不發出你沒看過的內容，核可鈕保持鎖住；請用<a href="' + esc(gasPage) + '" target="_top">備用頁面</a>核可，或重新整理再試。退回與略過仍可在這裡按。</div>'; } });
        var bh = document.getElementById('approveHint'); if (bh) bh.textContent = '附掛項目沒載到、這裡不能核可';
        if (DETAIL) detailFallback('連線失敗');
      });
  }

  fetch(GW + '?action=approvalView&h=' + encodeURIComponent(h), { method: 'GET' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j || !j.ok || !j.item) { msg(j && j.error === 'not_found' ? '連結無效' : '暫時載不到', j && j.error === 'not_found' ? '找不到這筆核可件，或連結已失效。' : '系統暫時沒回應，請用下方的備用頁面。'); return; } render(j.item); })
    .catch(function () { msg('暫時載不到', '系統暫時沒回應，請用下方的備用頁面。'); });
})();
</script>
