<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>合約 PDF 版型 ｜ 植間設計</title>
<style>
/* PDF 專用版型（pdf-worker 用 headless Chrome 開這頁印成 PDF）
   資料來源：worker 注入 window.__YZ_QUOTE_DATA__ = { type, p, opts, stampUri, quoteDoc:{quoteNo,date,doc} }；沒注入＝顯示錯誤（合約無公開預覽） */
html,body{margin:0;padding:0;background:#fff}
/* GAS 版沒宣告 @page 邊界（HtmlService 引擎有預設天地）；Chrome 印 PDF 時 worker 給 0 邊界，要有天地才放得下 @bottom-center 頁碼 */
@page{size:A4;margin:10mm 0 14mm}
body[data-ready="error"] #doc{padding:40px;font-size:15px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
</style>
</head>
<body>
<div id="doc"></div>
<script src="contract-doc-render.js?v=c41f713d51"></script>
<script>
(function () {
  function done(ok, msg) {
    if (!ok) document.getElementById('doc').textContent = '合約資料載入失敗：' + String(msg || '');
    document.body.setAttribute('data-ready', ok ? '1' : 'error');
  }
  function whenAssetsReady() {
    var imgs = [].slice.call(document.images);
    var waits = imgs.map(function (im) { return im.complete ? Promise.resolve() : new Promise(function (res) { im.onload = im.onerror = function () { res(); }; }); });
    return Promise.all(waits).then(function () { return (document.fonts && document.fonts.ready) ? document.fonts.ready : null; });
  }
  function isSafeUri(u) { return /^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(u || '')); }
  try {
    var d = window.__YZ_QUOTE_DATA__;
    if (!d || !d.type || !d.p) { done(false, '沒有注入資料'); return; }
    var t = CONTRACT_RENDER_TYPES[String(d.type)];
    if (!t) { done(false, '未知合約類型 ' + String(d.type)); return; }
    if (d.stampUri && !isSafeUri(d.stampUri)) { done(false, '合約章 URI 格式不合（只收 data:image base64）'); return; }
    CONTRACT_STAMP_URI = d.stampUri ? String(d.stampUri) : '';
    var opts = Object.assign({}, d.opts || {});
    if (opts.signature) {
      if (!isSafeUri(opts.signature.uri)) { done(false, '簽名 URI 格式不合（只收 data:image base64）'); return; }
      opts.signature = Object.assign({}, opts.signature, { uri: String(opts.signature.uri) });
    }
    var p = d.p || {};
    var needAppendix = !!String(p['報價單號'] || '').trim();
    var qd = d.quoteDoc && d.quoteDoc.doc;
    if (needAppendix && !(qd && typeof qd === 'object' && Array.isArray(qd.items))) { done(false, '合約帶報價單號但沒注入 quoteDoc.doc.items、附件一會缺'); return; }
    CONTRACT_QUOTE_DOC = needAppendix ? d.quoteDoc : null;
    var html = t.render(p, opts);
    if (needAppendix && html.indexOf('class="doc axwrap"') < 0) { done(false, '附件一沒渲染出來'); return; }
    var styleM = html.match(/<style>([\s\S]*?)<\/style>/);
    var st = document.createElement('style'); st.textContent = styleM ? styleM[1] : ''; document.head.appendChild(st);
    document.getElementById('doc').innerHTML = html.replace(/^[\s\S]*?<body>/, '').replace(/<\/body>[\s\S]*$/, '');
    var tm = html.match(/<title>([\s\S]*?)<\/title>/);
    if (tm) document.title = tm[1];
    whenAssetsReady().then(function () { done(true); }, function () { done(true); });
  } catch (e) { done(false, e && e.message); }
})();
</script>
</body>
</html>
