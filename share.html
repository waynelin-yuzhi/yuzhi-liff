<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>植間設計｜分享案例</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans TC", -apple-system, sans-serif; background: #F2EDE3; color: #1B1A17; line-height: 1.7; padding: 40px 18px; }
  .wrap { max-width: 420px; margin: 0 auto; text-align: center; }
  .brand { font-size: 11px; letter-spacing: .3em; color: #5F6E58; font-weight: 700; margin-bottom: 10px; }
  .card { background: #FFFCF5; border-radius: 12px; padding: 28px 22px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  h1 { font-size: 18px; margin-bottom: 6px; }
  p { font-size: 13.5px; color: #4A4A45; }
  .btn { display: block; width: 100%; padding: 14px; background: #5F6E58; color: #FFFCF5; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; }
  .ghost { display: block; width: 100%; padding: 12px; background: none; color: #5F6E58; border: 1.5px solid #5F6E58; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .muted { font-size: 11px; color: #8a8275; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">YUZHI PLANT DESIGN</div>
  <div class="card" id="box" style="background:none;box-shadow:none;padding:8px;">
    <h1 id="ttl" style="font-size:13px;color:#8a8275;font-weight:400;">開啟好友選單…</h1>
    <p id="msg"></p>
  </div>
  <div class="muted">此頁面由植間設計 Workspace 系統發出<br>植間設計股份有限公司｜統編 90877240</div>
  <div class="muted" style="margin-top:4px;">share v9 · pages</div>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var LIFF_ID = '2010719321-KOziooMo';
var API = 'https://script.google.com/macros/s/AKfycbxBqNeM8AKbKVn4VIUcrAe73WRMJzH5x31e2VjhE9uSRdtmcU3i7029tR35K6vKA90B/exec';
var PACK = null;
function show(t, m, btns) {
  document.getElementById('ttl').textContent = t;
  document.getElementById('msg').textContent = m || '';
  var box = document.getElementById('box');
  box.querySelectorAll('button').forEach(function (b) { b.remove(); });
  (btns || []).forEach(function (b) {
    var el = document.createElement('button');
    el.className = b.ghost ? 'ghost' : 'btn';
    el.textContent = b.label; el.onclick = b.fn;
    box.appendChild(el);
  });
}
function getPackedData() {
  var m = location.search.match(/[?&]d=([A-Za-z0-9_-]+)/);
  if (!m) {
    var s = location.search.match(/liff\.state=([^&]+)/);
    if (s) {
      var st = decodeURIComponent(s[1]);
      var m2 = st.match(/[?&]?d=([A-Za-z0-9_-]+)/);
      if (m2) m = m2;
    }
  }
  if (!m) return null;
  try {
    var b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var p = JSON.parse(decodeURIComponent(escape(atob(b))));
    return (p && p.f) ? { p: p, raw: m[1] } : null;
  } catch (e) { return null; }
}
function buildBubble(p, rawD) {
  var caseUrl = API + '?page=cases&case=' + p.f;
  var shareUrl = 'https://liff.line.me/' + LIFF_ID + '?d=' + rawD;
  var bubble = {
    type: 'bubble',
    header: { type: 'box', layout: 'vertical', paddingAll: '16px', contents: [
      { type: 'text', text: 'yuzhiplant \u00b7 \u6848\u4f8b\u5206\u4eab', size: 'xs', color: '#E9EDE3' },
      { type: 'text', text: p.t || '\u6848\u4f8b\u5206\u4eab', size: 'xl', color: '#FFFCF5', weight: 'bold', wrap: true, margin: 'sm' }
    ]},
    body: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '20px', contents: [] },
    footer: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '16px', paddingTop: '0px', contents: [
      { type: 'box', layout: 'horizontal', spacing: 'sm', contents: [
        { type: 'button', style: 'primary', height: 'sm', color: '#5F6E58',
          action: { type: 'uri', label: '\u67e5\u770b\u5b8c\u6574\u6848\u4f8b', uri: caseUrl } },
        { type: 'button', style: 'secondary', height: 'sm', color: '#FFFCF5',
          action: { type: 'uri', label: '\u5206\u4eab\u7d66\u670b\u53cb', uri: shareUrl } }
      ]},
      { type: 'text', text: '\u7167\u7247\u7686\u70ba\u690d\u9593\u5be6\u969b\u65bd\u4f5c\u5be6\u666f', size: 'xxs', color: '#8a8275', align: 'center', margin: 'sm', wrap: false }
    ]},
    styles: { header: { backgroundColor: '#5F6E58' }, body: { backgroundColor: '#FFFCF5' }, footer: { backgroundColor: '#FFFCF5' } }
  };
  if (p.x) bubble.body.contents.push({ type: 'text', text: p.x, size: 'sm', color: '#4A4A45', wrap: true });
  if (p.c) bubble.hero = { type: 'image', url: 'https://lh3.googleusercontent.com/d/' + p.c + '=w1560',
    size: 'full', aspectRatio: '4:3', aspectMode: 'cover', action: { type: 'uri', uri: caseUrl } };
  return { ok: true, bubble: bubble, alt: '\u690d\u9593\uff5c\u6848\u4f8b\u5206\u4eab\uff1a' + (p.t || ''), url: caseUrl };
}
function getCaseId() {
  var m = location.search.match(/[?&]case=([\w-]+)/);
  if (m) return m[1];
  var s = location.search.match(/liff\.state=([^&]+)/);
  if (s) {
    var st = decodeURIComponent(s[1]);
    var m2 = st.match(/case=([\w-]+)/);
    if (m2) return m2[1];
  }
  return '';
}
function closeSelf() {
  try { if (liff.isInClient && liff.isInClient()) { liff.closeWindow(); return; } } catch (e) {}
  show('完成', '可以關閉此頁了');
}
function openPicker() {
  var msgs = [{ type: 'flex', altText: PACK.alt || '植間設計｜案例分享', contents: PACK.bubble }];
  if (PACK.followText) msgs.push({ type: 'text', text: String(PACK.followText).substring(0, 4900) });
  liff.shareTargetPicker(msgs).then(function (res) {
    /* 分享成功或取消都直接關窗回聊天室（Wayne：越無感越好；要再分享重按卡片即可） */
    closeSelf();
  }).catch(function () {
    if (PACK && PACK.join) { cgFallback('分享沒有成功', '可以稍後再按一次「分享給同事」；要自己加入群組，按下面的按鈕。'); return; }
    show('分享沒有成功', '可以改用複製連結的方式分享', [{ label: '複製案例連結', fn: copyLink }]);
  });
}
function copyLink() {
  var ta = document.createElement('textarea');
  ta.value = (PACK && PACK.url) || '';
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  show('連結已複製', '貼到任何聊天室就能分享', [{ label: '再複製一次', fn: copyLink, ghost: true }]);
}
/* v6：加 kind/key 通用卡（品種/分類/品牌）；v5 packed 與 case 路徑不動 */
function getKindKey() {
  var q = location.search;
  var st = q.match(/liff\.state=([^&]+)/);
  if (st) q = decodeURIComponent(st[1]);
  var mk = q.match(/[?&]kind=([^&]+)/), my = q.match(/[?&]key=([^&]+)/);
  return (mk && my) ? { kind: decodeURIComponent(mk[1]), key: decodeURIComponent(my[1]) } : null;
}
/* v9：養護群組邀請卡 kind=caregroup&key=<token>（2026-11-20 安全審查後改版）：網址只帶伺服器發的不可猜 token，
   卡片內容（邀請代碼、客戶簡稱）憑 token 向客服引擎閘道 shareCardGet 取；取不到（不存在、過期、撤銷）就不產生任何卡。網址裡自己帶的其他參數一律忽略。
   卡片字與結構對照主系統 public-care-group-setup.gs 的 CGS_SHARE_CARD／_cgsInviteLinkCard_（經核可中心 _approvalLinkCardBubble_ 畫）；兩邊回歸逐欄比對。
   後端回來的欄位照樣驗：邀請代碼只收群組邀請格式（加入群組只會連到 line.me/R/ti/g/）、簡稱不合規則用「貴公司」；畫面一律 textContent。 */
var CG_API = 'https://ytlakkxrbookftluulbo.supabase.co/functions/v1/api';
var CG_TIMEOUT_MS = 8000;
var CG_CARD = { title: '專屬養護群組邀請', subSuffix: ' x 有植',
  lines: ['1. 聯繫與安排時間', '2. 養護紀錄回報', '3. 訊息同步', '4. 特殊需求'],
  joinLabel: '加入群組', shareLabel: '分享給同事' };
var CG_TOKEN_RE = /^[A-Za-z0-9_-]{22,64}$/;
var CG_CODE_RE = /^[A-Za-z0-9_-]{6,64}$/;
var CG_NAME_RE = /^[一-鿿A-Za-z0-9 ·・.()（）\-]{1,20}$/;
function cgDecode(v) { try { return decodeURIComponent(String(v || '').replace(/\+/g, ' ')); } catch (e) { return ''; } }
function getCareGroup() {
  var q = location.search; var st = q.match(/liff\.state=([^&]+)/); if (st) q = cgDecode(st[1]);
  if (!/[?&]kind=caregroup(&|$)/.test(q)) return null;
  var mk = q.match(/[?&]key=([^&]*)/), t = mk ? cgDecode(mk[1]) : '';
  return CG_TOKEN_RE.test(t) ? { token: t } : { bad: true };
}
function fetchCareGroup(token) {
  return new Promise(function (resolve) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; resolve({ ok: false, cgNet: true }); } }, CG_TIMEOUT_MS);
    var fin = function (v) { if (done) return; done = true; clearTimeout(timer); resolve(v); };
    /* text/plain＝簡單請求、不觸發 CORS 預檢；body 照樣是 JSON */
    fetch(CG_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ action: 'shareCardGet', token: token }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || j.ok !== true) { fin(j && /^(not_found|expired|revoked|token_invalid)$/.test(String(j.error || '')) ? { ok: false, cgDead: true } : { ok: false, cgNet: true }); return; }
        var pl = j.payload || {};
        if (j.kind !== 'caregroup' || !CG_CODE_RE.test(String(pl.inviteCode || ''))) { fin({ ok: false, cgDead: true }); return; }
        var n = String(pl.clientShort || '').trim(); if (!CG_NAME_RE.test(n)) n = '貴公司';
        fin(buildCareGroup({ g: String(pl.inviteCode), n: n, token: token }));
      })
      .catch(function () { fin({ ok: false, cgNet: true }); });
  });
}
function buildCareGroup(p) {
  var join = 'https://line.me/R/ti/g/' + p.g;
  var share = 'https://liff.line.me/' + LIFF_ID + '?kind=caregroup&key=' + p.token;
  var bubble = {
    type: 'bubble',
    header: { type: 'box', layout: 'vertical', paddingAll: '16px', contents: [
      { type: 'text', text: p.n + CG_CARD.subSuffix, size: 'xs', color: '#E9EDE3' },
      { type: 'text', text: CG_CARD.title, size: 'xl', color: '#FFFCF5', weight: 'bold', wrap: true, margin: 'sm' }
    ]},
    body: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '20px', contents: CG_CARD.lines.map(function (t) {
      return { type: 'text', text: t, size: 'sm', color: '#4A4A45', wrap: true };
    }) },
    footer: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '16px', paddingTop: '0px', contents: [
      { type: 'box', layout: 'horizontal', spacing: 'sm', contents: [
        { type: 'button', style: 'primary', height: 'sm', color: '#5F6E58', action: { type: 'uri', label: CG_CARD.joinLabel, uri: join } },
        { type: 'button', style: 'secondary', height: 'sm', color: '#FFFCF5', action: { type: 'uri', label: CG_CARD.shareLabel, uri: share } }
      ]}
    ]},
    styles: { header: { backgroundColor: '#5F6E58' }, body: { backgroundColor: '#FFFCF5' }, footer: { backgroundColor: '#FFFCF5' } }
  };
  return { ok: true, bubble: bubble, alt: CG_CARD.title + '｜' + CG_CARD.joinLabel, url: join, join: join };
}
function cgFallback(t, m) {
  var join = PACK && PACK.join;
  show(t, m, join ? [{ label: CG_CARD.joinLabel, fn: function () { location.href = join; } }] : []);
}
function cgFail(d) {
  if (d && d.cgNet) { show('連線失敗', '請稍後再試', [{ label: '重試', fn: function () { packP = fetchCareGroup(cg0.token); boot(); } }]); return; }
  show('這張邀請已失效', '請跟植間要一張新的邀請卡');
}
/* v7：客戶選單「預約單次養護」直進預約頁（?page=booking）：LIFF 取 access token → 後台驗證並產專屬連結 → 直接換頁 */
function wantsBooking() {
  var q = location.search; var st = q.match(/liff\.state=([^&]+)/); if (st) q = decodeURIComponent(st[1]);
  return /[?&]page=booking(&|$)/.test(q);
}
function bookingEnter() {
  show('正在開啟預約頁…', '');
  if (!liff.isLoggedIn()) {
    if (/[?&]code=/.test(location.search)) { show('LINE 登入沒有完成', '請關閉後重新點一次選單'); return; }
    liff.login({ redirectUri: location.href }); return;
  }
  var at = liff.getAccessToken(); var it = ''; try { it = liff.getIDToken() || ''; } catch (eI) {}
  if (!at && !it) { show('無法取得 LINE 身分', '請重新點一次選單', [{ label: '重試', fn: bookingEnter, ghost: true }]); return; }
  var body = new FormData(); body.append('op', 'liffEnter'); body.append('at', at || ''); body.append('it', it);
  fetch(API + '?page=care-booking&respond=json', { method: 'POST', body: body, redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || d.status !== 'success' || !d.url) { show('預約頁開啟失敗', (d && d.msg) || '請稍後再試', [{ label: '重試', fn: bookingEnter, ghost: true }]); return; }
      var ctx = null; try { ctx = liff.getContext(); } catch (e) {}
      if (!liff.isInClient() || (ctx && ctx.viewType === 'full')) { location.replace(d.url); return; }
      liff.openWindow({ url: d.url, external: true });
      setTimeout(function () { try { liff.closeWindow(); } catch (e) {} }, 800);
    })
    .catch(function () { show('連線失敗', '請稍後再試', [{ label: '重試', fn: bookingEnter, ghost: true }]); });
}
var packed0 = getPackedData();
var cid0 = getCaseId();
var kk0 = getKindKey();
var cg0 = getCareGroup();
var packP = cg0
  ? (cg0.bad ? Promise.resolve({ ok: false, cgDead: true }) : fetchCareGroup(cg0.token))
  : packed0
  ? Promise.resolve(buildBubble(packed0.p, packed0.raw))
  : (kk0
      ? fetch(API + '?page=card-share&kind=' + encodeURIComponent(kk0.kind) + '&key=' + encodeURIComponent(kk0.key) + '&fmt=json', { redirect: 'follow' }).then(function (r) { return r.json(); })
      : (cid0
          ? fetch(API + '?page=case-share&case=' + cid0 + '&fmt=json', { redirect: 'follow' }).then(function (r) { return r.json(); })
          : Promise.resolve(null)));
function boot() {
  packP.then(function (d) {
    if (!d) {
      var packed = getPackedData();
      if (packed) { packP = Promise.resolve(buildBubble(packed.p, packed.raw)); boot(); return; }
      var kk = getKindKey();
      if (kk) { packP = fetch(API + '?page=card-share&kind=' + encodeURIComponent(kk.kind) + '&key=' + encodeURIComponent(kk.key) + '&fmt=json', { redirect: 'follow' }).then(function (r) { return r.json(); }); boot(); return; }
      var cid = getCaseId();
      if (!cid) { show('缺少案例參數', '請重新點卡片上的分享按鈕'); return; }
      packP = fetch(API + '?page=case-share&case=' + cid + '&fmt=json', { redirect: 'follow' }).then(function (r) { return r.json(); });
      boot(); return;
    }
    if (!d.ok) { if (d.cgDead || d.cgNet) { cgFail(d); return; } show('卡片載入失敗', '請稍後再試'); return; }
    PACK = d;
    if (liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
      openPicker();
    } else if (PACK.join) {
      cgFallback('這裡沒辦法開好友選單', '請在 LINE 裡點卡片上的「分享給同事」；要自己加入群組，按下面的按鈕。');
    } else {
      show('這裡無法開好友選單', '改用複製連結的方式分享', [{ label: '複製案例連結', fn: copyLink }]);
    }
  }).catch(function () { show('連線失敗', '請稍後再試', [{ label: '重試', fn: boot }]); });
}
liff.init({ liffId: LIFF_ID }).then(wantsBooking() ? bookingEnter : boot).catch(function () {
  if (cg0) { packP.then(function (d) { if (!d || !d.ok) { cgFail(d); return; } PACK = d; cgFallback('這裡沒辦法開好友選單', '請在 LINE 裡點卡片上的「分享給同事」；要自己加入群組，按下面的按鈕。'); }); return; }
  show('LINE 初始化失敗', '請重新點一次分享按鈕', [{ label: '重試', fn: boot, ghost: true }]);
});
</script>
</body>
</html>
