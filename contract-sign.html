<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>植間設計｜合約簽署</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Noto Sans TC", -apple-system, sans-serif; background: #F2EDE3; color: #1B1A17; line-height: 1.7; padding: 24px 14px 60px; margin: 0; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .brand { font-size: 11px; letter-spacing: .3em; color: #5F6E58; font-weight: 700; text-align: center; margin-bottom: 4px; }
  h1 { font-size: 19px; text-align: center; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #8a8275; text-align: center; margin-bottom: 16px; }
  .card { background: #FFFCF5; border-radius: 12px; padding: 20px 18px; box-shadow: 0 4px 16px rgba(0,0,0,.06); margin-bottom: 14px; }
  .row { display: flex; gap: 12px; padding: 7px 0; border-bottom: .5px solid #EDE9DE; font-size: 13.5px; }
  .row:last-child { border-bottom: none; }
  .k { width: 96px; flex: none; font-size: 11px; color: #A09A8C; letter-spacing: .1em; padding-top: 2px; }
  .decl { font-size: 13px; color: #4A4A45; background: #f0f3ee; border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: #A09A8C; letter-spacing: .1em; margin: 4px 0 4px; }
  .fhint { font-size: 11px; color: #8a8275; margin-top: 3px; }
  .field input { width: 100%; padding: 11px 12px; border: 1px solid #C9C2B0; border-radius: 8px; font-size: 15px; font-family: inherit; background: #fff; }
  canvas.pad { width: 100%; height: 170px; background: #fff; border: 1.5px dashed #C9C2B0; border-radius: 8px; touch-action: none; }
  .btn { display: block; width: 100%; padding: 14px; background: #5F6E58; color: #FFFCF5; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn[disabled] { opacity: .55; }
  .ghost { display: block; width: 100%; padding: 12px; background: none; color: #5F6E58; border: 1.5px solid #5F6E58; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; margin-top: 10px; }
  .flow { display: flex; justify-content: space-between; gap: 4px; margin: 4px 0 6px; }
  .flow .fs { flex: 1; text-align: center; }
  .flow .fn { width: 24px; height: 24px; line-height: 24px; border-radius: 12px; margin: 0 auto 5px; font-size: 12px; background: #E5E0D3; color: #8a8275; }
  .flow .fs.d .fn { background: #5F6E58; color: #FFFCF5; }
  .flow .fs.c .fn { background: #FFFCF5; border: 1.5px solid #5F6E58; color: #5F6E58; line-height: 21px; font-weight: 700; }
  .flow .fl { font-size: 11px; color: #8a8275; line-height: 1.3; }
  .flow .fs.d .fl, .flow .fs.c .fl { color: #1B1A17; }
  .flow-hint { font-size: 12.5px; color: #4A4A45; line-height: 1.7; margin-top: 8px; text-align: left; }
  .flow-title { font-size: 12px; color: #8a8275; letter-spacing: .12em; margin-bottom: 10px; }
  .clr { background: none; border: none; color: #8a8275; font-size: 13px; text-decoration: underline; padding: 8px; cursor: pointer; }
  .done-card { background: #FFFCF5; border-radius: 12px; padding: 30px 22px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .done-card h2 { color: #5F6E58; font-size: 18px; margin: 0 0 8px; }
  .done-card h2.err { color: #A4392D; }
  .done-card p { font-size: 14px; color: #4A4A45; margin: 0; }
  .ft { margin: 26px auto 12px; text-align: center; font-size: 10.5px; color: #A09A8C; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">YUZHI PLANT DESIGN</div>
  <div id="app"><div class="done-card"><h2>載入中…</h2><p>正在讀取合約</p></div></div>
  <div class="ft">此頁面由植間設計 Workspace 系統發出<br>植間設計股份有限公司｜統編 90877240<br><span style="opacity:.55" id="pgv">contract-sign v5</span></div>
</div>
<script src="pad.js?v=2"></script>
<script>
var IN_LINE = (navigator.userAgent || '').indexOf('Line/') >= 0;
if (IN_LINE && !sessionStorage.getItem('yzCtExt')) {
  sessionStorage.setItem('yzCtExt', '1');
  location.replace(location.href);
}
var API = 'https://script.google.com/macros/s/AKfycbxBqNeM8AKbKVn4VIUcrAe73WRMJzH5x31e2VjhE9uSRdtmcU3i7029tR35K6vKA90B/exec';
var HASH = new URLSearchParams(location.search).get('h') || '';
// 頁腳版字同步網址版號（CHECKS.md 規則 3：驗收先確認拿到的是新版）
(function () {
  var pv = new URLSearchParams(location.search).get('v');
  var el = document.getElementById('pgv');
  if (pv && el) el.textContent = 'contract-sign v' + pv;
})();
var NEED_BANK = false;
var PARTY_FILL = [];
var app = document.getElementById('app');

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function docView(id) {
  return 'https://waynelin-yuzhi.github.io/yuzhi-liff/doc-view.html?id=' + encodeURIComponent(id);
}
function flowHtml(flow) {
  if (!flow || !flow.steps || !flow.paper) return '';
  if (flow.heroUrl) return '<div class="card" style="padding:12px 12px 14px"><img src="' + esc(flow.heroUrl) + '" alt="合約簽署流程" style="display:block;width:100%;border-radius:8px"><div class="flow-hint">' + esc(flow.hint || '') + '</div></div>';
  var cells = flow.steps.map(function (st) {
    return '<div class="fs' + (st.done ? ' d' : (st.current ? ' c' : '')) + '"><div class="fn">' + (st.done ? '✓' : st.n) + '</div><div class="fl">' + esc(st.label) + '</div></div>';
  }).join('');
  return '<div class="card" style="padding:16px 14px"><div class="flow-title">合約流程</div><div class="flow">' + cells + '</div><div class="flow-hint">' + esc(flow.hint || '') + '</div></div>';
}
function doneCard(title, msg, err, extraHtml) {
  app.innerHTML = '<div class="done-card"><h2' + (err ? ' class="err"' : '') + '>' + esc(title) + '</h2><p>' + esc(msg) + '</p>' + (extraHtml || '') + '</div>';
  window.scrollTo(0, 0);
}

if (!HASH) {
  doneCard('連結無效', '找不到這份合約；請與植間聯繫。', true);
} else {
  fetch(API + '?page=contract-sign&h=' + encodeURIComponent(HASH) + '&fmt=json&_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () { doneCard('載入失敗', '請關閉頁面後重新點一次連結。', true); });
}

function render(d) {
  if (!d || d.status !== 'success') { doneCard('連結無效', (d && d.msg) || '找不到這份合約；請與植間聯繫。', true); return; }
  if (d.state !== '待簽') {
    var titles = { '已簽': '已完成線上簽署', '用印寄出': '紙本用印寄出中', '已完成': '合約流程完成', '作廢': '此合約已作廢' };
    doneCard(titles[d.state] || ('目前狀態：' + d.state), (d.subject || '') + (d.signer ? '　' + d.signer : '') + (d.signedAt ? '　' + d.signedAt : ''),
      d.state === '作廢', (d.pdfId && d.state !== '作廢' ? '<a class="ghost" href="' + esc(docView(d.pdfId)) + '" target="_blank">查看已簽合約</a>' : ''));
    if (d.state !== '作廢') app.insertAdjacentHTML('beforeend', flowHtml(d.flow));
    return;
  }
  NEED_BANK = !!d.needBank;
  var lineWarn = IN_LINE
    ? '<div class="card" style="background:#FBF3E4;border:1px solid #E3C990;padding:12px 14px;font-size:12.5px;color:#8a6a2e">現在是 LINE 內建瀏覽器、簽名可能不順。建議點畫面角落「…」選「<b>以預設瀏覽器開啟</b>」再簽。</div>'
    : '';
  var row = function (k, val) { return '<div class="row"><div class="k">' + k + '</div><div>' + esc(val || '—') + '</div></div>'; };
  var bankCard = NEED_BANK
    ? '<div class="card"><div style="font-size:13px;color:#4A4A45;margin-bottom:2px">承攬報酬匯款帳戶</div>'
      + '<div style="font-size:11.5px;color:#8a8275;margin-bottom:10px">合約未預填帳戶，請填寫您的收款帳戶——簽署時會一併寫入合約正本。</div>'
      + '<div class="field"><label>銀行（含分行）</label><input id="bankName" placeholder="例：國泰世華銀行 連城分行"></div>'
      + '<div class="field"><label>帳號</label><input id="bankAccount" inputmode="numeric" placeholder="請輸入帳號"></div>'
      + '<div class="field"><label>戶名</label><input id="bankHolder" placeholder="與身分證相符之戶名"></div></div>'
    : '';
  PARTY_FILL = Array.isArray(d.partyFill) ? d.partyFill : [];
  var partyCard = PARTY_FILL.length
    ? '<div class="card"><div style="font-size:13px;color:#4A4A45;margin-bottom:2px">請補上貴公司資料</div>'
      + '<div style="font-size:11.5px;color:#8a8275;margin-bottom:10px">以下甲方資料於合約中尚未填寫，請補齊後再簽署，所填內容將一併載入已簽署之合約正本。</div>'
      + PARTY_FILL.map(function (f, i) {
          return '<div class="field"><label>甲方' + esc(f.label) + (f.required ? '（必填）' : '（選填）') + '</label>'
            + '<input id="pf' + i + '" inputmode="' + esc(f.inputmode || 'text') + '" placeholder="' + esc(f.placeholder || '') + '"' + ' maxlength="' + ({ vat: 8, tel: 30, name: 30, addr: 120 }[f.format] || 120) + '">'
            + (f.hint ? '<div class="fhint">' + esc(f.hint) + '</div>' : '') + '</div>';
        }).join('')
      + '</div>'
    : '';
  app.innerHTML = '<h1>合約簽署</h1><div class="sub">' + esc(d.typeLabel || '') + '　' + esc(d.contractNo || '') + '</div>' + lineWarn
    + flowHtml(d.flow)
    + '<div class="card">'
    + row('合約編號', d.contractNo) + row('合約類型', d.typeLabel) + row('簽約對象', d.subject)
    + (d.pdfId ? '<a class="ghost" href="' + esc(docView(d.pdfId)) + '" target="_blank">查看合約全文</a>' : '')
    + '<div class="decl">本人已詳閱並同意本合約全部條款，茲以電子簽名確認簽署。</div></div>'
    + bankCard
    + partyCard
    + '<div class="card"><div class="field"><label>' + esc(d.signerLabel || '簽署人') + '姓名</label><input id="signer" placeholder="請輸入您的姓名" autocomplete="name" maxlength="40"></div>'
    + '<div style="font-size:13px;color:#4A4A45;margin:12px 0 6px">親筆簽名</div><canvas id="cv" class="pad"></canvas>'
    + '<div style="text-align:right"><button class="clr" id="clr">清除重簽</button></div>'
    + '<button class="btn" id="go">確認簽署</button></div>';
  initPad();
  document.getElementById('clr').addEventListener('click', cvClear);
  document.getElementById('go').addEventListener('click', doSign);
}

var PAD = null;
function initPad() { PAD = initYzPad(document.getElementById('cv')); }
function cvClear() { if (PAD) PAD.clear(); }

// 簽名輸出前先縮到寬 ≤700px：高 DPR 手機 canvas 實際像素很大、
// PNG base64 會撞伺服器 300000 字元上限（撞到＝「簽名圖過大請重簽」死循環）
function padPng() {
  var cv = document.getElementById('cv');
  var maxW = 700;
  if (cv.width <= maxW) return PAD.dataUrl().split(',')[1];
  var t = document.createElement('canvas');
  t.width = maxW; t.height = Math.round(cv.height * maxW / cv.width);
  t.getContext('2d').drawImage(cv, 0, 0, t.width, t.height);
  return t.toDataURL('image/png').split(',')[1];
}

// 甲方自填欄檢查（與後端同規則；後端仍會再驗一次）。回 null＝有欄位不合、已提示
function halfWidth(s) {
  return String(s || '').replace(/[\uFF10-\uFF19]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/\uFF0D/g, '-').replace(/\uFF08/g, '(').replace(/\uFF09/g, ')').replace(/\uFF0B/g, '+').replace(/\uFF03/g, '#').replace(/\u3000/g, ' ');
}
function vatOk(v) {
  var w = [1, 2, 1, 2, 1, 2, 4, 1], sum = 0;
  for (var i = 0; i < 8; i++) { var p = Number(v.charAt(i)) * w[i]; sum += Math.floor(p / 10) + (p % 10); }
  return sum % 5 === 0 || (v.charAt(6) === '7' && (sum + 1) % 5 === 0);
}
function collectPartyFill() {
  var out = {};
  for (var i = 0; i < PARTY_FILL.length; i++) {
    var f = PARTY_FILL[i];
    var el = document.getElementById('pf' + i);
    var v = String((el && el.value) || '').replace(/\s+/g, ' ').trim();
    var bad = function (msg) { alert(msg); if (el) el.focus(); return null; };
    if (!v) {
      if (f.required) return bad('請填寫甲方' + f.label);
      continue;
    }
    if (f.format === 'name' && (v.length < 2 || v.length > 30)) return bad('甲方' + f.label + '請填 2 到 30 個字');
    if (f.format === 'vat') {
      v = halfWidth(v).replace(/[\s-]/g, '');
      if (!/^[0-9]{8}$/.test(v)) return bad('統一編號須為 8 碼數字');
      if (!vatOk(v)) return bad('統一編號檢核不符，請再確認');
    }
    if (f.format === 'tel') {
      v = halfWidth(v);
      if (v.length > 30) return bad('聯絡電話過長，請再確認');
      var dg = v.replace(/[^0-9]/g, '').length;
      if (!/^[0-9()+# -]+$/.test(v)) return bad('聯絡電話只能填數字與 - ( ) # +');
      if (dg < 8 || dg > 15) return bad('聯絡電話位數不對，市話請加區碼');
    }
    if (f.format === 'addr' && (v.length < 6 || v.length > 120)) return bad('聯絡地址請填完整（含縣市、區）');
    out[f.key] = v;
  }
  return out;
}

// 送出＝傳統表單全頁 POST（鐵則：零登入頁互動不走 fetch/XHR）。
// 2026-08-03 實案：外包簽約在 LINE 內建瀏覽器按「確認簽署」沒反應——
// 跨網域 fetch POST 被 webview 擋、根本沒出手機；伺服器端實測管線全好。
// 全頁表單提交＝零 cookie 零 XHR、任何瀏覽器都通，伺服器回品牌版簽署完成頁。
function doSign() {
  var pf = collectPartyFill();
  if (pf === null) return;
  var name = (document.getElementById('signer').value || '').trim();
  if (!name) { alert('請填寫簽署人姓名'); return; }
  if (name.length > 40) { alert('簽署人姓名請在 40 字以內'); return; }
  if (NEED_BANK) {
    var bn = (document.getElementById('bankName').value || '').trim();
    var ba = (document.getElementById('bankAccount').value || '').trim();
    var bh = (document.getElementById('bankHolder').value || '').trim();
    if (!bn || !ba || !bh) { alert('請填寫完整匯款帳戶（銀行／帳號／戶名）'); return; }
  }
  if (!PAD || !PAD.hasInk()) { alert('請先簽名'); return; }
  var btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = '送出中…';
  var f = document.createElement('form');
  f.method = 'POST';
  f.action = API + '?publicSign=contract';
  var add = function (n, v) {
    var i = document.createElement('input');
    i.type = 'hidden'; i.name = n; i.value = v;
    f.appendChild(i);
  };
  add('publicSign', 'contract'); add('hash', HASH);
  add('signerName', name); add('png', padPng());
  if (PARTY_FILL.length) add('partyFill', JSON.stringify(pf));
  if (NEED_BANK) {
    add('bankName', document.getElementById('bankName').value.trim());
    add('bankAccount', document.getElementById('bankAccount').value.trim());
    add('bankHolder', document.getElementById('bankHolder').value.trim());
  }
  document.body.appendChild(f);
  f.submit();
}
</script>
</body>
</html>
