<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>封面工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Playfair+Display:wght@400;500&display=swap">
<style>
:root{--moss:#5F6E58;--paper:#F2EDE3;--ink:#1B1A17;--muted:#8a8275;--line:#E5E0D3;--warn:#8a4a30}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;max-width:700px;margin:0 auto;padding:14px}
h1{font-size:17px}
.sub{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;letter-spacing:.12em;margin:2px 0 12px}
.help{font-size:13px;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:2px;padding:10px 12px;margin-bottom:12px}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:260px}
video{width:100%;background:#000;border:1px solid var(--line);border-radius:2px;display:block}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0}
.play{width:52px;padding:8px 0;background:var(--moss);color:var(--paper);border:none;border-radius:2px;font-family:inherit;font-size:13px;cursor:pointer}
#seek{flex:1;accent-color:var(--moss)}
.tv{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);min-width:50px;text-align:right}
/* 封面預覽：4:5 IG 實際顯示 */
.prevwrap{position:relative;width:100%;max-width:320px;margin:0 auto}
#cv{width:100%;display:block;border:1px solid var(--line);border-radius:2px}
.cropnote{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;text-align:center;margin-top:4px}
.field{margin-bottom:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.06em}
input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:15px;border-radius:2px}
input[type=range]{width:100%;accent-color:var(--moss)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px;border:1px solid var(--moss);color:var(--moss);background:#fff;border-radius:2px;font-family:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--moss);color:var(--paper)}
.send{width:100%;padding:13px;background:var(--moss);color:var(--paper);border:none;font-family:inherit;font-size:15px;letter-spacing:.1em;cursor:pointer;border-radius:2px;margin-top:6px}
.stat{font-size:13px;padding:7px 0;min-height:18px}
.stat.ok{color:#2f5d2a}.stat.bad{color:var(--warn)}
</style>
</head>
<body>
<h1>封面工作台</h1>
<div class="sub">COVER STUDIO · 雜誌內頁排版 · 拖時間軸選底圖</div>
<div class="help">
拖<b>時間軸</b>選底圖 → 右邊即時看到封面成品（已按 IG 4:5 裁切顯示）→ 改標題／配色／照片比例 → 送出，我照這些設定產正式封面。
</div>

<div class="wrap">
  <div class="col">
    <video id="vid" src="https://ytlakkxrbookftluulbo.supabase.co/storage/v1/object/public/reels-publish/imm-final-A.mp4" playsinline muted preload="metadata" crossorigin="anonymous"></video>
    <div class="bar">
      <button class="play" id="play">播放</button>
      <input type="range" id="seek" min="0" max="17.7" step="0.05" value="0.8">
      <span class="tv" id="tv">0.8s</span>
    </div>
    <div class="field">
      <label>標題（4-10 字）</label>
      <input type="text" id="zh" value="四平方米的室內森林">
    </div>
    <div class="field">
      <label>英文副標</label>
      <input type="text" id="en" value="A FOREST INDOORS">
    </div>
    <div class="field">
      <label>配色</label>
      <div class="seg" id="scheme">
        <button data-s="paper" class="on">米紙底</button>
        <button data-s="moss">苔綠底</button>
      </div>
    </div>
    <div class="field">
      <label>照片高度 <span class="tv" id="phv">42%</span></label>
      <input type="range" id="ph" min="30" max="55" step="1" value="42">
    </div>
    <button class="send" id="send">送出封面設定</button>
    <div class="stat" id="stat"></div>
  </div>

  <div class="col">
    <div class="prevwrap">
      <canvas id="cv" width="1080" height="1350"></canvas>
      <div class="cropnote">IG 實際顯示（4:5 裁切後）</div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const vid=$("vid"), cv=$("cv"), ctx=cv.getContext("2d");
// 畫布＝1080×1350（IG 4:5）；原稿 1080×1920 的 y 需減 285
const OFF=285, W=1080, M=96;
const PAPER="#F2EDE3", MOSS="#5F6E58", INK="#1B1A17";
let scheme="paper", phPct=0.42;

function tracked(txt,x,y,size,color,track,font){
  ctx.font=`${size}px ${font}`; ctx.fillStyle=color; ctx.textBaseline="top";
  for(const c of txt){ ctx.fillText(c,x,y); x+=ctx.measureText(c).width+size*track; }
}
function draw(){
  const bg = scheme==="paper"?PAPER:MOSS;
  const fg = scheme==="paper"?INK:PAPER;
  const sub= scheme==="paper"?MOSS:PAPER;
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,1350);
  // 頁眉 y=330 → 畫布 45
  tracked("YUZHI  URBAN PLANT LAB", M, 330-OFF, 26, sub, 0.22, '"Playfair Display",serif');
  // 照片 y=430 → 145
  const phH=Math.round(1920*phPct), phY=430-OFF, pw=W-M*2;
  if(vid.videoWidth){
    const sc=Math.max(pw/vid.videoWidth, phH/vid.videoHeight);
    const sw=pw/sc, sh=phH/sc;
    ctx.drawImage(vid,(vid.videoWidth-sw)/2,(vid.videoHeight-sh)/2,sw,sh,M,phY,pw,phH);
  }else{ ctx.fillStyle="#000"; ctx.fillRect(M,phY,pw,phH); }
  // 標題
  const ty=phY+phH+92;
  tracked($("zh").value, M, ty, 82, fg, 0.06, '"Noto Sans TC",sans-serif');
  const ly=ty+Math.round(82*1.7);
  ctx.strokeStyle=sub; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(M,ly); ctx.lineTo(W-M,ly); ctx.stroke();
  tracked($("en").value.toUpperCase(), M, ly+40, 30, sub, 0.20, '"Playfair Display",serif');
}
vid.addEventListener("loadeddata",()=>{vid.currentTime=0.8;});
vid.addEventListener("seeked",draw);
vid.addEventListener("timeupdate",()=>{$("seek").value=vid.currentTime;$("tv").textContent=vid.currentTime.toFixed(1)+"s";draw();});
$("seek").oninput=e=>{vid.currentTime=parseFloat(e.target.value);$("tv").textContent=(+e.target.value).toFixed(1)+"s";};
$("play").onclick=()=>{if(vid.paused){vid.play();$("play").textContent="暫停";}else{vid.pause();$("play").textContent="播放";}};
["zh","en"].forEach(id=>$(id).addEventListener("input",draw));
document.querySelectorAll("#scheme button").forEach(b=>b.onclick=()=>{
  scheme=b.dataset.s;
  document.querySelectorAll("#scheme button").forEach(x=>x.classList.toggle("on",x===b));
  draw();
});
$("ph").oninput=e=>{phPct=+e.target.value/100;$("phv").textContent=e.target.value+"%";draw();};
document.fonts.ready.then(draw);

const EXEC="https://script.google.com/macros/s/AKfycbxBqNeM8AKbKVn4VIUcrAe73WRMJzH5x31e2VjhE9uSRdtmcU3i7029tR35K6vKA90B/exec";
const TK="7c7e94a5e2af4764a94cccf49c31aa0f";
$("send").onclick=async()=>{
  const st=$("stat"); st.textContent="傳送中…"; st.className="stat";
  const payload={title:"封面設定",
    frameSec:+vid.currentTime.toFixed(2), scheme:scheme,
    coverTitle:$("zh").value, coverEn:$("en").value.toUpperCase(),
    photoPct:+phPct.toFixed(2)};
  const body=new URLSearchParams({token:TK,payload:JSON.stringify(payload)});
  try{
    const r=await fetch(EXEC+"?action=reelsTunerSubmit",{method:"POST",body});
    let ok=false; try{ok=(await r.json()).ok;}catch(_){ok=r.ok||r.type==="opaque";}
    if(!ok) throw 0;
    st.textContent="已送達 · 植影所會照這些設定產封面"; st.className="stat ok";
  }catch(_){
    try{await fetch(EXEC+"?action=reelsTunerSubmit",{method:"POST",body,mode:"no-cors"});
      st.textContent="已送出"; st.className="stat ok";}
    catch(e){st.textContent="傳送失敗、請截圖傳我"; st.className="stat bad";}
  }
};
</script>
</body>
</html>
