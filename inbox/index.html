<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植間 - 對話收件匣</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<style>
  :root{--moss:#5F6E58;--paper:#F2EDE3;--ink:#1B1A17;--muted:#8a8275;--body:#4A4A45;--line:#E5E0D3;--brick:#8a4a30;--amber:#F3E9C9;--tint:#EEF2E6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",-apple-system,sans-serif;padding:12px;max-width:1200px;margin:0 auto;overflow-x:hidden}
  h1{font-size:18px;letter-spacing:.05em;margin:8px 0 2px}
  .sub{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:10px}
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:12px}
  .wrap>*{min-width:0}
  @media(max-width:820px){.wrap{grid-template-columns:1fr} body{padding:8px}}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;overflow:hidden}
  .btn{padding:9px 14px;background:var(--moss);color:var(--paper);border:none;border-radius:4px;font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:#fff;color:var(--moss);border:1px solid var(--moss)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn.link{background:none;border:none;color:var(--moss);padding:4px 6px;font-size:12px;text-decoration:underline}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.busy{opacity:.6;pointer-events:none}
  .tabs{display:flex;gap:4px;margin:6px 0 8px}
  .tabs button{flex:1;padding:8px 4px;border:1px solid var(--line);background:#fff;border-radius:4px;font-family:inherit;font-size:13px;color:var(--body);cursor:pointer}
  .tabs button.on{background:var(--moss);color:#fff;border-color:var(--moss)}
  .find{display:flex;gap:6px;margin-bottom:8px}
  .find input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);font-family:inherit;font-size:13px}
  .ct{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
  .ct.on{background:#E9EDE3}
  .ct.hot{background:#FBF9F1}
  .ct .n{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ct .m{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ct .t{font-size:11px;color:var(--muted);float:right}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid #D9D3C4;border-radius:10px;color:#5F6E58;vertical-align:middle;font-weight:400}
  .pill.ap{background:var(--tint);border-color:#B9C4AE}
  .pill.man{background:var(--amber);border-color:#E0CF93;color:#7a5a12}
  .pill.tag{background:#EEF2E6;border-color:#C9D3B8;color:#4B5A42}.pill.wait{background:#F7E4DC;border-color:#E4B9A8;color:var(--brick)}
  .sched{padding:8px;border-bottom:1px solid var(--line);font-size:13px}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .head b{font-size:17px}
  .back{display:none}
  @media(max-width:820px){
    body.view-thread .listcard{display:none}
    body:not(.view-thread) .threadcard{display:none}
    .back{display:inline-block}
  }
  #contacts{max-height:72vh;overflow-y:auto}
  @media(max-width:820px){#contacts{max-height:none}}
  details.dossier{margin:8px 0;border:1px solid var(--line);border-radius:6px;background:#FBF9F3}
  details.dossier summary{padding:8px 10px;font-size:13px;cursor:pointer;color:var(--moss);font-weight:600;list-style:none}
  details.dossier summary::-webkit-details-marker{display:none}
  details.dossier .in{padding:0 10px 10px;font-size:12px;color:var(--body);overflow-wrap:anywhere}
  details.dossier ul{margin-left:16px}
  details.dossier h4{font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  .chat{min-height:200px;max-height:46vh;overflow-y:auto;overflow-x:hidden;padding:6px 2px;border-top:1px solid var(--line);margin-top:6px}
  .msg{max-width:84%;margin:8px 0;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}
  .msg.in{margin-right:auto;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.out{margin-left:auto;background:#DCE8D3;border-bottom-right-radius:3px}
  .msg.event{max-width:100%;background:none;color:var(--muted);font-size:11px;text-align:center;padding:2px}
  .msg .who{font-size:11px;color:var(--muted);margin-bottom:2px}
  .msg.out .who,.msg.out .ts{text-align:right}
  .msg .ts{font-size:11px;color:var(--muted);margin-top:3px}
  .draft{margin-top:10px;padding:12px;border:1px solid #B9C4AE;background:#F6F8F2;border-radius:8px}
  .draft .lab{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .draft textarea{width:100%;padding:10px;border:1px solid var(--line);font-family:inherit;font-size:15px;line-height:1.5;background:#fff;color:var(--ink);border-radius:6px}
  .draft details{margin-top:6px;font-size:12px;color:var(--body)}
  .draft details summary{cursor:pointer;color:var(--moss)}
  .draft .brief{white-space:pre-wrap;padding:6px 8px;background:var(--tint);border-radius:6px;margin-top:4px}
  .actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .actions .btn.main{flex:1 1 140px;font-size:15px;padding:12px}
  .secondary{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;align-items:center}
  .when{display:none;margin-top:8px;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--body)}
  .when.on{display:flex}
  .when input{font-size:13px;padding:5px 6px;border:1px solid var(--line);font-family:inherit}
  .fbbox{display:none;margin-top:8px;padding:10px;background:var(--amber);border-radius:6px}
  .fbbox.on{display:block}
  .fbbox textarea{width:100%;padding:8px;border:1px solid #E0CF93;font-family:inherit;font-size:14px;background:#fff}
  .stars{display:inline-flex;gap:2px;margin-right:8px;vertical-align:middle}
  .stars button{background:none;border:0;padding:0 1px;font-size:18px;line-height:1;cursor:pointer;color:#D9D3C4}
  .stars button.on{color:#C9A227}
  .compose{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .compose textarea{width:100%;padding:10px;border:1px solid var(--line);font-family:inherit;font-size:15px;line-height:1.5;background:#fff;border-radius:6px}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .small{font-size:12px}.muted{color:var(--muted)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #D9D3C4;border-top-color:var(--moss);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{padding:18px 8px;color:var(--muted);font-size:13px}
  .att{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .att .it{position:relative;flex:0 0 auto;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;font-size:11px;color:var(--body);max-width:120px}
  .att .it img{display:block;width:84px;height:84px;object-fit:cover;border-radius:4px}
  .att .it .x{position:absolute;top:-6px;right:-6px;background:var(--brick);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;cursor:pointer;padding:0}
  .attbtn{font-size:12px}
  input[type=text],select{padding:6px 8px;border:1px solid var(--line);font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
</style>
</head>
<body>
<div id="gate" class="card" style="max-width:420px;margin:40px auto;display:none">
  <h2 style="font-size:16px;margin-bottom:8px">進入收件匣</h2>
  <div class="small muted" style="margin-bottom:10px">輸入信箱收一組驗證碼；同一台裝置通過一次就會記住。</div>
  <div class="row"><input type="email" id="gateEmail" placeholder="waynelin@yuzhiplant.com" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);font-family:inherit;font-size:14px"><button class="btn" id="gateSend">寄驗證碼</button></div>
  <div class="row" id="otpRow" style="display:none"><input type="text" id="gateCode" placeholder="信裡的 8 碼" inputmode="numeric" style="flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--line);font-family:inherit;font-size:14px"><button class="btn" id="gateVerify">進入</button></div>
  <div class="small muted" id="gateMsg" style="margin-top:8px"></div>
</div>
<div id="app" style="display:none">
<h1>對話收件匣 <button class="btn link" id="leave" style="float:right">離開</button></h1>
<div class="sub"><span id="counts"></span> <span id="stat"></span></div>
<div class="wrap">
  <div class="card listcard">
    <div class="tabs"><button data-tab="todo" class="on">待處理</button><button data-tab="sched">已排程</button><button data-tab="all">全部</button><button data-tab="staff">員工</button></div>
    <div class="find"><input type="text" id="findQ" placeholder="開新對話：輸入客戶、廠商或員工名稱"><button class="btn ghost small" id="findBtn">找</button><button class="btn ghost small" id="reload" title="重新整理">↻</button></div>
    <div id="findRes"></div>
    <div id="batch"></div>
    <div id="contacts"></div>
  </div>
  <div class="card threadcard">
    <div class="head"><button class="btn ghost small back" id="back">← 清單</button><span id="head"><span class="muted small">左邊選一位聯絡人</span></span></div>
    <div id="dossier"></div>
    <div class="chat" id="chat"></div>
    <div id="pendBox"></div>
    <div id="manualBox"></div>
  </div>
</div>
</div>
<input type="file" id="attFile" accept="image/jpeg,image/png,application/pdf" multiple style="display:none">
<script>
  var INIT_CID = (new URLSearchParams(location.search).get('cid') || '').replace(/[^A-Za-z0-9]/g, '').substring(0, 40);
  (function () { var tq = Number(new URLSearchParams(location.search).get('t') || 0); if (INIT_CID && (!tq || Date.now() - tq > 20 * 60000)) INIT_CID = ''; })();   // 只有卡片剛點的連結（20 分內）才直接開對話；捷徑／書籤帶的 cid 一律進清單
  var cur = null, LIST = [], OV = { pending: [], scheduled: [], other: [], loaded: false }, THREAD = null, dirty = false, pollTimer = null, fbStars = 0, TAB = 'todo';
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function friendlyErr(m) {
    m = String(m || '');
    if (/<!DOCTYPE|http 404|http 50\d|not found/i.test(m)) return '後台（GAS）暫時沒回應，幾秒後再試一次';
    if (/AbortError|aborted/i.test(m)) return '後台回應太慢，動作可能已完成，正在重新確認';
    if (/TimeoutError|timed out|out_of_time/i.test(m)) return '後台回應太慢，系統會自動重試，稍後按 ↻';
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '網路連線失敗，確認網路後再試';
    if (/forbidden/i.test(m)) return '這個帳號沒有權限';
    return m.length > 90 ? m.slice(0, 90) + '…' : m;
  }
  function stat(t, busyFlag) { t = String(t || ''); if (t.indexOf('失敗：') === 0) t = '失敗：' + friendlyErr(t.slice(3)); document.getElementById('stat').innerHTML = (busyFlag ? '<span class="spin"></span>' : '') + esc(t); }
  function loadingBox(id, t) { document.getElementById(id).innerHTML = '<div class="loading"><span class="spin"></span>' + esc(t) + '</div>'; }
  function busy(btn, on, label) { if (!btn) return; if (on) { btn.setAttribute('data-label', btn.textContent); btn.innerHTML = '<span class="spin"></span>' + esc(label || '處理中'); btn.classList.add('busy'); } else { btn.textContent = btn.getAttribute('data-label') || btn.textContent; btn.classList.remove('busy'); } }
  var CFG = { supabaseUrl: 'https://ytlakkxrbookftluulbo.supabase.co', anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0bGFra3hyYm9va2Z0bHV1bGJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MDY5MzcsImV4cCI6MjA5NzA4MjkzN30.2b9y-i9Y1niCXWgHFDhNhQ21COxtPde_AE4ixoIW2e4', engine: 'https://ytlakkxrbookftluulbo.supabase.co/functions/v1/cs-run', tenant: 'yuzhi' };
  var sb = window.supabase.createClient(CFG.supabaseUrl, CFG.anonKey);
  function api(payload) {
    return sb.auth.getSession().then(function (r) {
      var s = r.data && r.data.session; if (!s) { showGate(); throw new Error('請先進入'); }
      payload.tenant = CFG.tenant;
      var ac = (typeof AbortController !== 'undefined') ? new AbortController() : null; if (ac) setTimeout(function () { ac.abort(); }, 75000);   // 後台偶爾 80 秒以上才回：畫面不能一直轉
      return fetch(CFG.engine, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.access_token }, body: JSON.stringify(payload), signal: ac ? ac.signal : undefined });
    }).then(function (res) { if (res.status === 401 || res.status === 403) { if (pollTimer) clearTimeout(pollTimer); sb.auth.signOut({ scope: 'local' }); showGate(); throw new Error('連線已失效，請重新進入'); } return res.json(); }).then(function (d) { if (d && d.ok === false && d.error) stat('失敗：' + (d.detail || d.error)); return d; });
  }
  var ROLES = ['客戶', '會計事務所', '廠商', '合作夥伴', '其他'], MEMBER_ROLES = ['窗口', '主管', '會計', '採購', '其他'];
  var OPS = { csInboxNoReply: 'noReply', csInboxOverview: 'overview', csInboxSend: 'send', csInboxReply: 'reply', csInboxFeedback: 'feedback', csInboxManual: 'manual', csInboxReject: 'reject', csInboxRole: 'role', csInboxMember: 'member', csInboxBind: 'bind', csInboxMemoryNote: 'memoryNote', csInboxSelfReplied: 'selfReplied', csInboxCancelScheduled: 'cancelScheduled', csInboxUpload: 'upload' };
  function run(fn, args, ok, fail) {
    var p;
    if (fn === 'csInboxContacts') p = api({ app: { op: 'contacts', sinceHours: (args[0] || {}).sinceHours, fresh: !!(args[0] || {}).fresh } });
    else if (fn === 'csInboxThread') p = api({ app: { op: 'thread', contactId: args[0], fresh: args[1] === true } });
    else if (fn === 'csInboxUpload') p = api({ media: { op: 'upload', name: (args[0] || {}).name, mime: (args[0] || {}).mime, b64: (args[0] || {}).b64 } });
    else if (fn === 'csInboxClientSearch') p = api({ app: { op: 'clientSearch', q: args[0] } });
    else if (fn === 'csInboxFind') p = api({ app: { op: 'find', q: args[0] } });
    else if (OPS[fn]) p = api({ app: Object.assign({ op: OPS[fn] }, args[0] || {}) });
    else p = Promise.reject(new Error('unknown ' + fn));
    p.then(function (r) { ok(r); }).catch(function (e) { stat('失敗：' + friendlyErr(e.message)); if (fail) fail(e); });
  }
  function showGate() { document.getElementById('gate').style.display = 'block'; document.getElementById('app').style.display = 'none'; }
  function showApp() { document.getElementById('gate').style.display = 'none'; document.getElementById('app').style.display = 'block'; }
  document.getElementById('gateSend').onclick = function () {
    var em = document.getElementById('gateEmail').value.trim(); if (!em) return; var btn = this; busy(btn, true, '寄送中');
    sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: false } }).then(function (r) {
      busy(btn, false); document.getElementById('gateMsg').textContent = r.error ? '寄送失敗，請稍後再試（每小時有次數限制）' : '驗證碼已寄到信箱（一小時內有效）';
      if (!r.error) document.getElementById('otpRow').style.display = 'flex';
    });
  };
  document.getElementById('gateVerify').onclick = function () {
    var em = document.getElementById('gateEmail').value.trim(), code = document.getElementById('gateCode').value.trim(); if (!em || !code) return; var btn = this; busy(btn, true, '確認中');
    sb.auth.verifyOtp({ email: em, token: code, type: 'email' }).then(function (r) {
      busy(btn, false);
      if (r.error) { document.getElementById('gateMsg').textContent = '驗證碼不對或已過期，請再試一次'; return; }
      showApp(); boot();
    });
  };
  document.getElementById('leave').onclick = function () { sb.auth.signOut().then(function () { location.reload(); }); };
  function refreshAll(fresh) { loadList(null, fresh); if (cur) openThread(cur); }

  var OVP = null;
  function loadList(cb, fresh) {
    if (!LIST.length) loadingBox('contacts', '載入聯絡人');
    stat('更新中', true);
    api({ inbox: { op: 'contacts', sinceHours: 336 } }).then(function (d) { if (d && d.ok === false) throw new Error(d.error || 'contacts'); LIST = d.contacts || []; mergeOverview(); renderList(); stat(''); if (cb) cb(); }).catch(function (e) { stat('失敗：' + friendlyErr(e.message)); });
    if (fresh || !OV.loaded || (Date.now() - (OV.at || 0)) > 30000) OVP = api({ app: { op: 'overview', fresh: !!fresh } }).then(function (o) { if (o && o.ok !== false && !(o.generatedAt && OV.generatedAt && Number(o.generatedAt) < Number(OV.generatedAt))) { OV = o; OV.loaded = true; OV.at = Date.now(); mergeOverview(); renderList(); if (cur) applyOvPending(cur); } return OV; }).catch(function () { return OV; });
  }
  // 引擎清單只有對話狀態；待核可與排程從後台總覽疊上去（有稿或排程但近期沒對話的也要進清單）
  function mergeOverview() {
    var pend = {}, sched = {}, schedName = {};
    (OV.pending || []).forEach(function (p) { pend[p.contactId] = p; });
    (OV.scheduled || []).forEach(function (x) { sched[x.contactId] = (sched[x.contactId] || 0) + 1; schedName[x.contactId] = x.name; });
    var seen = {}; LIST = LIST.filter(function (c) { return !c._stub; });
    LIST.forEach(function (c) { seen[c.contactId] = 1; c.pending = pend[c.contactId] ? { id: pend[c.contactId].id, title: pend[c.contactId].title } : null; c.scheduled = sched[c.contactId] || 0; });
    Object.keys(pend).concat(Object.keys(sched)).forEach(function (cid) {
      if (seen[cid]) return; seen[cid] = 1; var p = pend[cid] || {};
      LIST.push({ _stub: true, contactId: cid, name: p.name || schedName[cid] || cid.substring(0, 8), type: p.type || '', clientId: '', role: '', isEmp: false, lastTs: '', lastDirection: '', lastText: '（近期無對話）', awaitingReply: false, handledAction: '', manual: false, pending: pend[cid] ? { id: pend[cid].id, title: pend[cid].title } : null, scheduled: sched[cid] || 0 });
    });
  }
  function renderList() {
    var pendN = (OV.pending || []).length, schedN = (OV.scheduled || []).length;
    document.getElementById('counts').textContent = OV.loaded === false ? '待核可 …　已排程 …' : ('待核可 ' + pendN + '　已排程 ' + schedN);
    document.querySelectorAll('.tabs button').forEach(function (b) { b.className = b.getAttribute('data-tab') === TAB ? 'on' : ''; });
    var box = document.getElementById('contacts'), batch = document.getElementById('batch'); batch.innerHTML = '';
    if (TAB === 'sched') {
      var sc = OV.scheduled || [];
      box.innerHTML = sc.length ? sc.map(function (x) { return '<div class="sched"><span class="pill">' + esc(x.at) + '</span> <b style="cursor:pointer" data-open="' + esc(x.contactId) + '">' + esc(x.name) + '</b><div class="small muted" style="margin:3px 0">' + esc(x.text) + '</div><button class="btn link cancel" data-kind="' + esc(x.kind) + '" data-id="' + esc(x.id || '') + '" data-row="' + esc(x.row || '') + '" data-cid="' + esc(x.contactId) + '">取消排程</button></div>'; }).join('') : '<div class="small muted" style="padding:8px">（沒有已排程的訊息）</div>';
      box.querySelectorAll('[data-open]').forEach(function (el) { el.onclick = function () { openThread(el.getAttribute('data-open')); }; });
      box.querySelectorAll('.cancel').forEach(function (b) { b.onclick = function () { if (!confirm('取消這則排程？')) return; busy(b, true, '取消中'); run('csInboxCancelScheduled', [{ kind: b.getAttribute('data-kind'), id: b.getAttribute('data-id'), row: Number(b.getAttribute('data-row')) || 0, contactId: b.getAttribute('data-cid') }], function () { refreshAll(true); }); }; });
      return;
    }
    var rows = LIST.filter(function (c) { return TAB === 'staff' ? c.isEmp : (TAB === 'all' ? !c.isEmp : (!c.isEmp && (c.pending || c.awaitingReply || c.manual))); });
