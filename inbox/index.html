<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植間 - 對話收件匣</title>
<script>/* App 殼（智能客服）偵測：Capacitor 在文件開頭就注入 window.Capacitor，這裡先掛 html.yz-native，隱藏有植內部導覽不會先閃一下；一般瀏覽器不受影響 */try { var YZC = window.Capacitor; if (YZC && typeof YZC.isNativePlatform === 'function' && YZC.isNativePlatform()) document.documentElement.classList.add('yz-native'); } catch (eYzn) {}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<style>
  /* 關掉手機瀏覽器的下拉重新整理：改稿時在框裡往上捲到頂再往下拉，會被當成整頁重新整理（2026-10-21 Wayne 回報） */
  html,body{overscroll-behavior-y:contain}
  textarea,.chat{overscroll-behavior:contain}
  /* #contacts 只有桌機版是真的捲動容器（72vh）；手機版 max-height:none 不會自己捲，若也設 contain 會把手指捲動擋在清單裡、整頁滑不動（2026-11-03 Wayne 回報） */
  @media(min-width:821px){#contacts{overscroll-behavior:contain}}
  :root{--moss:#5F6E58;--paper:#F2EDE3;--ink:#1B1A17;--muted:#8a8275;--body:#4A4A45;--line:#E5E0D3;--brick:#8a4a30;--amber:#F3E9C9;--tint:#EEF2E6}
  :root{--bubble-self-bg:#5F6E58;--bubble-self-fg:#F2EDE3;--bubble-self-sub:#D9DECF;--bubble-staff-bg:#F5EBD7;--bubble-staff-line:#E8D9B8}
  *{margin:0;padding:0;box-sizing:border-box}
  html{overflow-x:clip}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",-apple-system,sans-serif}
  h1{font-size:18px;letter-spacing:.05em;margin:8px 0 2px}
  .sub{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:10px}
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:12px}
  .wrap>*{min-width:0}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;overflow:hidden}
  .btn{padding:9px 14px;background:var(--moss);color:var(--paper);border:none;border-radius:4px;font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:#fff;color:var(--moss);border:1px solid var(--moss)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn.link{background:none;border:none;color:var(--moss);padding:4px 6px;font-size:12px;text-decoration:underline}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.busy{opacity:.6;pointer-events:none}
  .tabs{display:flex;gap:4px;margin:6px 0 8px}
  .tabs button{flex:1;padding:8px 4px;border:1px solid var(--line);background:#fff;border-radius:4px;font-family:inherit;font-size:13px;color:var(--body);cursor:pointer}
  .tabs button.on{background:var(--moss);color:#fff;border-color:var(--moss)}
  .find{display:flex;gap:6px;margin-bottom:8px}
  .find input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);font-family:inherit;font-size:13px}
  .ct{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
  .ct.on{background:#E9EDE3}
  .ct.hot{background:#FBF9F1}
  .ct .n{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ct .m{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ct .t{font-size:11px;color:var(--muted);float:right}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid #D9D3C4;border-radius:10px;color:#5F6E58;vertical-align:middle;font-weight:400}
  .pill.ap{background:var(--tint);border-color:#B9C4AE}
  .pill.man{background:var(--amber);border-color:#E0CF93;color:#7a5a12}
  .pill.tag{background:#EEF2E6;border-color:#C9D3B8;color:#4B5A42}.pill.wait{background:#F7E4DC;border-color:#E4B9A8;color:var(--brick)}
  .sched{padding:8px;border-bottom:1px solid var(--line);font-size:13px}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .head b{font-size:17px}
  .back{display:none}
  @media(max-width:820px){
    body.view-thread .listcard{display:none}
    body:not(.view-thread) .threadcard{display:none}
    .back{display:inline-block}
  }
  #contacts{max-height:72vh;overflow-y:auto}
  @media(max-width:820px){#contacts{max-height:none}}
  details.dossier{margin:8px 0;border:1px solid var(--line);border-radius:6px;background:#FBF9F3}
  details.dossier summary{padding:8px 10px;font-size:13px;cursor:pointer;color:var(--moss);font-weight:600;list-style:none}
  details.dossier summary::-webkit-details-marker{display:none}
  details.dossier .in{padding:0 10px 10px;font-size:12px;color:var(--body);overflow-wrap:anywhere}
  details.dossier ul{margin-left:16px}
  details.dossier h4{font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  .chat{min-height:200px;max-height:46vh;overflow-y:auto;overflow-x:hidden;padding:6px 2px;border-top:1px solid var(--line);margin-top:6px}
  .msg{max-width:84%;margin:8px 0;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}
  .msg.in{margin-right:auto;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.out{margin-left:auto;background:#DCE8D3;border-bottom-right-radius:3px}
  .msg.event{max-width:100%;background:none;color:var(--muted);font-size:11px;text-align:center;padding:2px}
  .msg .who{font-size:11px;color:var(--muted);margin-bottom:2px}
  .msg.out .who,.msg.out .ts{text-align:right}
  .msg .ts{font-size:11px;color:var(--muted);margin-top:3px}
  .msg .who .tagMe,.msg .who .tagStaff{display:inline-block;max-width:100%;padding:0 6px;border-radius:8px;font-size:11px;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  .msg.self{background:var(--bubble-self-bg);color:var(--bubble-self-fg);border:none}
  .msg.self .who,.msg.self .ts{color:var(--bubble-self-sub)}
  .msg.self .who .tagMe{background:var(--bubble-self-fg);color:var(--bubble-self-bg);font-weight:600}
  .msg.self a{color:var(--bubble-self-fg)}
  .msg.staff{background:var(--bubble-staff-bg);border:1px solid var(--bubble-staff-line)}
  .msg.staff .who .tagStaff{background:#fff;border:1px solid var(--bubble-staff-line);color:var(--body);line-height:15px}
  .msg.in .who,.msg.in .ts{text-align:left}
  .draft{margin-top:10px;padding:12px;border:1px solid #B9C4AE;background:#F6F8F2;border-radius:8px}
  .draft .lab{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .draft textarea{width:100%;padding:10px;border:1px solid var(--line);font-family:inherit;font-size:15px;line-height:1.5;background:#fff;color:var(--ink);border-radius:6px}
  .draft details{margin-top:6px;font-size:12px;color:var(--body)}
  .draft details summary{cursor:pointer;color:var(--moss)}
  .draft .brief{white-space:pre-wrap;padding:6px 8px;background:var(--tint);border-radius:6px;margin-top:4px}
  .actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .actions .btn.main{flex:1 1 140px;font-size:15px;padding:12px}
  .secondary{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;align-items:center}
  .when{display:none;margin-top:8px;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--body)}
  .when.on{display:flex}
  .when input{font-size:13px;padding:5px 6px;border:1px solid var(--line);font-family:inherit}
  .fbbox{display:none;margin-top:8px;padding:10px;background:var(--amber);border-radius:6px}
  .fbbox.on{display:block}
  .fbbox textarea{width:100%;padding:8px;border:1px solid #E0CF93;font-family:inherit;font-size:14px;background:#fff}
  .stars{display:inline-flex;gap:2px;margin-right:8px;vertical-align:middle}
  .stars button{background:none;border:0;padding:0 1px;font-size:18px;line-height:1;cursor:pointer;color:#D9D3C4}
  .stars button.on{color:#C9A227}
  .compose{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .compose textarea{width:100%;padding:10px;border:1px solid var(--line);font-family:inherit;font-size:15px;line-height:1.5;background:#fff;border-radius:6px}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .small{font-size:12px}.muted{color:var(--muted)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #D9D3C4;border-top-color:var(--moss);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{padding:18px 8px;color:var(--muted);font-size:13px}
  .att{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .att .it{position:relative;flex:0 0 auto;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;font-size:11px;color:var(--body);max-width:120px}
  .att .it img{display:block;width:84px;height:84px;object-fit:cover;border-radius:4px}
  .att .it .x{position:absolute;top:-6px;right:-6px;background:var(--brick);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;cursor:pointer;padding:0}
  .attbtn{font-size:12px}
  input[type=text],select{padding:6px 8px;border:1px solid var(--line);font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#EEE9DD;color:#5A5344;border:1px solid #DDD5C2}.chip.ok{background:#E3EFE1;color:#3D6B3A;border-color:#C6DCC3}.chip.warn{background:#FFF1E6;color:#9A4E1E;border-color:#F1CDB0}

  /* ── Workspace 殼同款外觀（2026-09-26）：桌機＝工具列；手機＝上方列＋底部分頁＋☰ 全部工具 ── */
  .page{max-width:1200px;margin:0 auto;padding:12px}
  .yz-tabbar{background:#fff;border-bottom:1px solid rgba(27,26,23,.12);padding:0 24px;display:flex;flex-wrap:wrap;align-items:stretch}
  .yz-tab{display:inline-flex;align-items:center;gap:7px;padding:11px 13px;color:rgba(27,26,23,.62);text-decoration:none;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;cursor:pointer}
  .yz-tab:hover{color:#1B1A17;background:#F2EDE3}
  .yz-tab.active{color:var(--moss);border-bottom-color:var(--moss);background:#E9EDE3;font-weight:500}
  .yz-tab svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .yz-tab.yz-tab-home{border-right:1px solid rgba(27,26,23,.08);margin-right:6px;padding-right:16px;color:rgba(27,26,23,.45)}
  .yz-tab-end{margin-left:auto;display:inline-flex;align-items:stretch;border-left:1px solid rgba(27,26,23,.08);padding-left:2px}   /* 齒輪＋登出一起換行（1440 寬會分家） */
  .yz-tab.yz-tab-out{font-size:12px;color:rgba(27,26,23,.45)}
  .yz-appbar,.yz-bottomnav,.yz-sheet,.yz-sheet-mask{display:none}
  @media(max-width:820px){
    body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
    body.view-thread{padding-bottom:8px}
    .page{padding:8px}
    .yz-tabbar,#app>.page>h1,.tabs{display:none}
    .yz-appbar{display:flex;position:sticky;top:0;z-index:50;align-items:center;gap:6px;height:50px;padding:0 6px 0 4px;background:#fff;border-bottom:1px solid rgba(27,26,23,.10)}
    .yz-appbar a,.yz-appbar button{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:44px;height:44px;padding:0 6px;border:none;background:none;color:#4F6147;font-family:inherit;font-size:14px;text-decoration:none;border-radius:10px;white-space:nowrap}
    .yz-appbar a:active,.yz-appbar button:active{background:var(--paper)}
    .yz-appbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .yz-appbar .yz-appbar-t{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    body.view-thread #yz-home{display:none} body:not(.view-thread) #yz-back{display:none}
    .back{display:none !important}   /* 上方列已有「清單」 */
    .sub{padding:6px 4px 0}
    body.view-thread .sub{display:none}
    .yz-bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid rgba(27,26,23,.10);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:60}
    .yz-bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border:none;background:none;font-family:inherit;font-size:11px;color:rgba(27,26,23,.6);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .yz-bottomnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .yz-bottomnav button.on{color:#4F6147}
    body.view-thread .yz-bottomnav{display:none}
    .yz-sheet-mask.on{display:block;position:fixed;inset:0;background:rgba(27,26,23,.35);z-index:70}
    .yz-sheet.on{display:block;position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:71}
    .yz-sheet h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .yz-sheet h3 button{border:none;background:none;font-family:inherit;font-size:14px;color:rgba(27,26,23,.6);padding:6px 10px}
    .yz-sheet-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .yz-sheet-grid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid rgba(27,26,23,.08);border-radius:12px;text-decoration:none;color:var(--ink);font-size:12px}
    .yz-sheet-grid a svg{width:22px;height:22px;stroke:#4F6147;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .yz-sheet-grid a.active{background:#E9EDE3;border-color:var(--moss)}
    .yz-sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
  }
  /* App 殼（智能客服）只留客服自己的東西（2026-11-20）：拿掉有植主系統沿用來的首頁、各模組分頁、設定中心、☰ 全部工具；
     通知設定與登出收進收件匣自己的「設定」（#stBox）。一般瀏覽器照舊。 */
  html.yz-native .yz-tab-home,html.yz-native .yz-tab[data-page],html.yz-native #nsOpen,html.yz-native #leave,html.yz-native #yz-home,html.yz-native #yz-more{display:none !important}
  html:not(.yz-native) .yz-native-only{display:none !important}

/* 收件匣設定（App 殼）：可再加項目的清單；外框沿用通知設定的 .ns-bar／.ns-in */
#stBox{display:none;position:fixed;inset:0;z-index:79;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
#stBox.on{display:block}
body.st-open{overflow:hidden}
.st-list{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:12px}
.st-list>*+*{border-top:1px solid var(--line)}
.st-go{display:flex;width:100%;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:none;background:none;font-family:inherit;font-size:15px;color:var(--ink);text-align:left;cursor:pointer}
.st-go:active{background:var(--tint)}
.st-go svg{width:20px;height:20px;stroke:#4F6147;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.st-go span{flex:1}
.st-go i{font-style:normal;color:var(--muted);font-size:18px}
.st-info{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;padding:0 14px;font-size:14px;color:var(--body)}
.st-info b{font-weight:500;color:var(--ink)}
.st-out{color:var(--brick)}

/* 跟 AI 討論（#ocBox）與我的習慣（#hbBox）：只有核可人看得到入口（html.oc-owner）；外框沿用 .ns-bar／.ns-in，泡泡沿用 .msg */
html:not(.oc-owner) .oc-only{display:none !important}
#ocBox{display:none;position:fixed;inset:0;z-index:78;background:var(--paper);flex-direction:column}
#ocBox.on{display:flex}
#hbBox{display:none;position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
#hbBox.on{display:block}
body.oc-open,body.hb-open{overflow:hidden}
#ocBox .ns-bar,#hbBox .ns-bar{flex:none}
.oc-cost{flex:none;padding:8px 12px;font-size:12px;line-height:1.5;background:#F5DDD2;color:#8C3B25;border-bottom:1px solid #E4B9A8}
.oc-list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:8px 10px}
.oc-list .msg{max-width:88%}
.oc-empty{padding:28px 12px;text-align:center;font-size:13px;line-height:1.7;color:var(--muted)}
.oc-more{display:block;margin:4px auto 8px}
.oc-under{max-width:88%;margin:-2px 0 10px;font-size:12px;line-height:1.6;color:var(--body);overflow-wrap:anywhere}
.oc-under.mine{margin-left:auto;text-align:right}
.oc-under a{color:var(--moss);font-weight:600}
.oc-act{padding:2px 0}
.oc-err{color:#8C3B25}
.oc-ment{display:inline-block;max-width:100%;padding:0 6px;margin:0 4px 3px 0;border-radius:8px;background:rgba(255,255,255,.7);font-size:11px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.oc-prop{margin:6px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;line-height:1.6;color:var(--ink)}
.oc-prop.done{background:var(--tint);color:var(--body)}
.oc-prop h4{font-size:13px;font-weight:600;margin:0 0 4px}
.oc-prop .oc-old{margin-top:4px;padding:6px 8px;border-radius:4px;background:#F7F4EC;color:var(--body);font-size:12px}
.oc-cat{display:inline-block;padding:0 7px;margin-right:6px;border-radius:9px;background:#E9EDE3;color:#4B5A42;font-size:11px;line-height:18px;white-space:nowrap}
.oc-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.oc-edit textarea{width:100%;box-sizing:border-box;min-height:64px;padding:8px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:14px;line-height:1.5}
.oc-edit select{max-width:100%;margin-top:6px;font-size:14px}
.oc-foot{flex:none;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.oc-chips{display:flex;flex-wrap:wrap;gap:6px}
.oc-chips:empty{display:none}
.oc-chip{display:inline-flex;align-items:center;max-width:100%;padding:2px 4px 2px 9px;border-radius:12px;background:#E9EDE3;color:#4B5A42;font-size:12px;line-height:20px}
.oc-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-chip button{flex:none;width:22px;height:22px;margin-left:2px;border:none;background:none;color:#4B5A42;font-size:15px;line-height:1;cursor:pointer}
.oc-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--body)}
.oc-tools select{font-size:13px;padding:5px 6px}
.oc-inrow{display:flex;gap:8px;align-items:flex-end}
.oc-inrow textarea{flex:1;min-width:0;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:15px;line-height:1.5;max-height:30vh}
.oc-inrow .btn{flex:none;min-width:64px;padding:11px 12px}
.oc-pick{display:none;position:absolute;left:0;right:0;bottom:0;max-height:70%;overflow-y:auto;background:#fff;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -4px 14px rgba(0,0,0,.18);padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:2}
.oc-pick.on{display:block}
.oc-pick-top{display:flex;gap:8px;align-items:center;position:sticky;top:-10px;background:#fff;padding:4px 0 8px}
.oc-pick-top input{flex:1;min-width:0;font-size:15px;padding:8px}
.oc-pick-it{display:block;width:100%;padding:11px 6px;border:none;border-top:1px solid var(--line);background:none;font-family:inherit;font-size:14px;color:var(--ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.oc-pick-it small{color:var(--muted);margin-left:6px}
.hb-cat{margin:14px 2px 6px;font-size:13px;font-weight:600;color:var(--body)}
.hb-it{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.hb-it.off{background:#F7F4EC;color:var(--body)}
.hb-st{display:inline-block;padding:0 7px;margin-right:6px;border-radius:9px;font-size:11px;line-height:18px;white-space:nowrap;background:#E9EDE3;color:#4B5A42}
.hb-st.pending{background:#FFF1E6;color:#9A4E1E}
.hb-st.disabled{background:#EEE9DD;color:#5A5344}
.hb-meta{margin-top:4px;font-size:12px;line-height:1.6;color:var(--muted)}
.oc-usage{font-size:13px;line-height:1.8;color:var(--body);padding:10px 14px}
.oc-usage b{color:var(--ink);font-weight:600}
.oc-note{color:var(--muted)}
.oc-fail,.oc-warn-t{color:#8C3B25}
.oc-fail .oc-note{color:#8C3B25}
.hb-it.hb-flash{border-color:var(--moss);box-shadow:0 0 0 2px #E9EDE3}
/* 引用問 AI（2026-11-23，cs-run 1.82.0 quotes）：輸入框上方的引用小卡、泡泡上方的引用說明、泡泡旁的「問 AI」「引用」小按鈕與長按選單 */
.oc-quotes{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.oc-quotes:empty{display:none}
.oc-qcard{display:flex;align-items:center;gap:4px;min-width:0;padding:1px 2px 1px 8px;border:1px solid var(--line);border-left:3px solid var(--moss);border-radius:6px;background:var(--tint);font-size:12px;line-height:20px;color:var(--body)}
.oc-qcard.oc-qbad{border-color:#C0705A;border-left-color:#8C3B25;background:#FFF6F3}
.oc-qcard .oc-qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-qcard button{flex:none;width:24px;height:24px;border:none;background:none;color:var(--body);font-size:15px;line-height:1;cursor:pointer}
.oc-qk{display:inline-block;margin-right:4px;padding:0 6px;border-radius:8px;background:#fff;color:#4B5A42;font-size:11px;line-height:16px;white-space:nowrap}
.oc-qhint{font-size:11px;line-height:1.5;color:var(--muted);padding:0 2px}
.oc-qrefs{max-width:88%;margin:8px 0 -4px;font-size:11px;line-height:1.5;color:var(--body)}
.oc-qrefs.mine{margin-left:auto}
.oc-qref{display:block;margin-top:2px;padding:2px 8px;border-left:2px solid var(--moss);border-radius:4px;background:var(--tint);overflow-wrap:anywhere;text-align:left;color:var(--body);text-decoration:none}
a.oc-qref{color:var(--body)}
a.oc-qref b{color:var(--moss)}
.q-btn{margin-left:8px;padding:0;border:none;background:none;font-family:inherit;font-size:11px;color:var(--moss);cursor:pointer;text-decoration:none}
#qMenu{display:none;position:fixed;z-index:95;min-width:120px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff}
#qMenu.on{display:block}
#qMenu button{display:block;width:100%;padding:10px 12px;border:none;background:none;font-family:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer}
#qMenu button+button{border-top:1px solid var(--line);color:var(--muted)}
.hb-note{margin-top:6px;font-size:12px;line-height:1.6;color:var(--moss)}
.hb-scope{margin-top:6px;font-size:13px;line-height:1.8;color:var(--body);overflow-wrap:anywhere}
.hb-scope b{font-weight:600;color:var(--ink);margin-right:4px}
.hb-pick{margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:0 8px 4px;max-height:260px;overflow-y:auto;overscroll-behavior:contain;background:#fff}
.hb-pick .oc-pick-top{top:0;padding:8px 0}

/* 通知設定（全螢幕面板：手機與桌機同一套） */
#nsBox{display:none;position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
#nsBox.on{display:block}
body.ns-open{overflow:hidden}
.ns-bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;height:50px;padding:0 8px;background:#fff;border-bottom:1px solid var(--line)}
.ns-bar h2{flex:1;font-size:16px;font-weight:600;text-align:center;color:var(--ink)}
.ns-bar button{min-width:64px;height:40px;border:none;background:none;font-family:inherit;font-size:14px;color:#4F6147;border-radius:8px;cursor:pointer}
.ns-bar .ns-sp{min-width:64px}
.ns-in{max-width:560px;margin:0 auto;padding:12px 10px calc(28px + env(safe-area-inset-bottom))}
.ns-sec{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.ns-sec h3{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
.ns-now{font-size:13px;color:var(--body);line-height:1.6;padding:8px 10px;background:var(--tint);border-radius:6px;margin:6px 0 2px}
.ns-mode{display:flex;gap:10px;align-items:flex-start;padding:12px 10px;border:1px solid var(--line);border-radius:6px;margin-top:8px;cursor:pointer}
.ns-mode.on{border-color:var(--moss);background:#E9EDE3}
.ns-mode input{margin-top:3px;width:18px;height:18px;accent-color:var(--moss);flex:none}
.ns-mode b{font-size:15px;color:var(--ink)}
.ns-d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.ns-until{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--body)}
.ns-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ns-sec h3+.ns-d+.ns-row,.ns-sec h3+.ns-row{border-top:none}
/* 標題欄至少 160px：右邊的控制項放不下（兩個時間、星期幾）就整組換到下一行，標題不會被擠成一個字一行；只有開關的列照舊左右排 */
.ns-t{flex:1 1 160px;min-width:0;font-size:14px;color:var(--ink)}
.ns-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:100%;font-size:14px;color:var(--body)}
.ns-in select.ns-hm{padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);min-width:88px}
.ns-in input[type=time],.ns-in input[type=datetime-local],.ns-in input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
.ns-in input[type=number]{width:80px}
.ns-sw{-webkit-appearance:none;appearance:none;position:relative;flex:none;width:44px;height:26px;border-radius:13px;background:#D9D3C4;cursor:pointer;transition:background .15s;margin:0}
.ns-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.ns-sw:checked{background:var(--moss)}
.ns-sw:checked::after{left:21px}
.ns-sw:disabled{opacity:.45;cursor:default}
.ns-days{display:flex;gap:4px;flex-wrap:wrap}
.ns-days label{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:34px;border:1px solid var(--line);border-radius:4px;font-size:13px;color:var(--body);cursor:pointer;background:#fff}
.ns-days label.on{background:var(--moss);border-color:var(--moss);color:#fff}
.ns-days input{position:absolute;opacity:0;width:1px;height:1px}
.ns-msg{font-size:12px;line-height:1.5;margin-top:8px;min-height:0}
.ns-msg:empty{display:none}
.ns-msg.err{color:var(--brick)}
.ns-msg.ok{color:#3D6B3A}
.ns-entry{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-bottom:10px}
.ns-entry svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#imgZoomBox{position:fixed;inset:0;z-index:9999;background:rgba(27,26,23,.94);display:none;flex-direction:column}
#imgZoomBox.on{display:flex}
#imgZoomBox .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;flex:none}
#imgZoomBox .bar button{font-size:16px;padding:10px 18px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:2px}
#imgZoomBox .bar a{color:rgba(255,255,255,.75);font-size:13px;text-decoration:underline}
#imgZoomBox .pic{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
#imgZoomBox .pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
</style>

    var r = bootOrig.apply(this, arguments);

})();

<script>

  // 既有設定不在半點整點上（例如 08:15）就多一個選項保留它，不可以因為打開這頁就被改掉
  function hmSelect(field, val) {
    val = String(val == null ? '' : val); if (/^\d\d:\d\d:\d\d$/.test(val)) val = val.slice(0, 5); var ok = /^([01]\d|2[0-3]):[0-5]\d$/.test(val), opts = [], seen = false;
    for (var m = 0; m < 1440; m += 30) { var v = ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); if (v === val) seen = true; opts.push(v); }
    if (ok && !seen) { opts.push(val); opts.sort(); }
    return '<select class="ns-hm" data-hm="' + esc(field) + '">' + (ok ? '' : '<option value="" selected>未設定</option>') + opts.map(function (v) { return '<option value="' + v + '"' + (v === val ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select>';
  }
  function sw(attr, on, title, desc) {
    return '<label class="ns-row"><span class="ns-t">' + esc(title) + '<div class="ns-d">' + esc(desc) + '</div></span><input type="checkbox" class="ns-sw" ' + attr + (on ? ' checked' : '') + '></label>';
  }
  function render() {
    if (!body) return;
    var s = S.settings;
    if (!s) {
      body.innerHTML = S.loadErr
        ? '<div class="ns-sec"><div class="ns-msg err">讀不到通知設定（' + esc(S.loadErr) + '）。</div><div class="row"><button type="button" class="btn small" id="nsRetry">再試一次</button></div></div>'
        : '<div class="loading"><span class="spin"></span>讀取通知設定中</div>';
      var rt = document.getElementById('nsRetry'); if (rt) rt.onclick = function () { load(); };
      return;
    }
    var d = S.defaults || {}, mode = MODE_NAME[s.mode] ? s.mode : 'normal', h = '';
    h += '<div class="ns-sec" id="nsModeSec"><h3>通知模式</h3>';
    h += '<div class="ns-now" id="nsModeNow">目前：<b>' + esc(MODE_NAME[mode]) + '</b>' + (mode !== 'normal' && s.modeUntil ? '，到 ' + esc(fmt(s.modeUntil)) + ' 自動回到一般' : '，照常通知') + '</div>';
    MODES.forEach(function (m) {
      var hint = (m.k !== 'normal' && m.k !== mode && d[m.k]) ? '（現在選，預設到 ' + fmt(d[m.k]) + '）' : '';
      h += '<label class="ns-mode' + (m.k === mode ? ' on' : '') + '"><input type="radio" name="nsMode" value="' + m.k + '"' + (m.k === mode ? ' checked' : '') + '><span><b>' + esc(m.name) + '</b><div class="ns-d">' + esc(m.desc + hint) + '</div></span></label>';
    });
    if (mode !== 'normal') {
      var now = Date.now(), until = Date.parse(s.modeUntil || '') || Date.parse(d[mode] || '') || now + 3600000;
      h += '<div class="ns-until"><span>到幾點結束</span><input type="datetime-local" id="nsUntil" value="' + toInput(until) + '" min="' + toInput(now + 60000) + '" max="' + toInput(now + MODE_MAX_MS) + '">' +
        '<button type="button" class="btn small" id="nsUntilSave">改結束時間</button><button type="button" class="btn ghost small" id="nsNormal">回到一般</button></div>';
      h += '<div class="ns-d">結束時間最多設到 7 天後，到時間自動回到一般。</div>';
    }
    h += '<div class="ns-msg" id="nsModeMsg"></div></div>';

    h += '<div class="ns-sec" id="nsKindSec"><h3>要通知哪些事</h3>';
    KINDS.forEach(function (k) { h += sw('data-kind="' + k[0] + '"', !!(s.kinds && s.kinds[k[0]]), k[1], k[2]); });
    h += sw('data-bool="preview"', !!s.preview, '通知顯示訊息內容', '關掉後通知只寫「傳來新訊息」，不露出客戶寫了什麼。');
    h += sw('data-bool="ackRelay"', !!s.ackRelay, '簡短回覆也由語音助理轉告', '客戶回確認話時，同時請語音助理告訴你。');
    h += '<div class="ns-row"><span class="ns-t">等多久算太久<div class="ns-d">工作時段內累計，15 到 1440 分鐘。</div></span><span class="ns-ctl"><input type="number" id="nsOverdue" min="15" max="1440" step="1" value="' + esc(s.overdueMin) + '"> 分鐘</span></div>';
    h += '<div class="ns-msg" id="nsKindMsg"></div></div>';

    h += '<div class="ns-sec" id="nsQuietSec"><h3>安靜時段</h3>';
    h += sw('data-bool="quietEnabled"', !!s.quietEnabled, '開啟安靜時段', '這段時間手機不響，累積的通知到結束時一次彙整。');
    h += '<div class="ns-row"><span class="ns-t">從幾點到幾點<div class="ns-d">可以跨午夜，例如 21:00 到 09:00。</div></span><span class="ns-ctl">' + hmSelect('quietStart', s.quietStart) + '<span>到</span>' + hmSelect('quietEnd', s.quietEnd) + '</span></div>';
    h += sw('data-bool="urgentBypass"', !!s.urgentBypass, '急件照樣通知', '安靜時段內遇到急件，還是馬上通知。');
    h += '<div class="ns-msg" id="nsQuietMsg"></div></div>';

    h += '<div class="ns-sec" id="nsWorkSec"><h3>工作時段</h3><div class="ns-d">用來算「客戶等太久」，以及「工作中」「下班」模式的預設結束時間。</div>';
    h += '<div class="ns-row"><span class="ns-t">上班時間</span><span class="ns-ctl">' + hmSelect('workStart', s.workStart) + '<span>到</span>' + hmSelect('workEnd', s.workEnd) + '</span></div>';
    h += '<div class="ns-row"><span class="ns-t">上班日</span><span class="ns-days">' + DAYS.map(function (n, i) { var on = (s.workDays || []).indexOf(i + 1) >= 0; return '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" data-day="' + (i + 1) + '"' + (on ? ' checked' : '') + '>' + n + '</label>'; }).join('') + '</span></div>';
    if (s.tz) h += '<div class="ns-d">時區：' + esc(s.tz) + '</div>';
    h += '<div class="ns-msg" id="nsWorkMsg"></div></div>';

    var waiting = Date.now() < S.testUntil;
    h += '<div class="ns-sec" id="nsTestSec"><h3>測試通知</h3><div class="ns-d">傳一則測試通知到你登記過的手機，確認收得到。不受模式、開關與安靜時段影響。</div>';
    h += '<div class="row"><button type="button" class="btn" id="nsTest"' + (waiting ? ' disabled' : '') + '>傳一則測試通知</button></div>';
    h += '<div class="ns-msg' + (S.testMsg && S.testMsg.cls ? ' ' + S.testMsg.cls : '') + '" id="nsTestMsg">' + esc(S.testMsg ? S.testMsg.text : '') + '</div></div>';
    body.innerHTML = h;
    bind();
    if (S.locked) body.querySelectorAll('#nsModeSec input, #nsModeSec button, #nsKindSec input, #nsQuietSec input, #nsQuietSec select, #nsWorkSec input, #nsWorkSec select').forEach(function (x) { x.disabled = true; });
  }

  function bind() {
    body.querySelectorAll('input[name=nsMode]').forEach(function (r) { r.onchange = function () { if (r.checked) save({ mode: r.value }, 'nsModeMsg'); }; });
    var us = document.getElementById('nsUntilSave');
    if (us) us.onclick = function () {
      var v = (document.getElementById('nsUntil') || {}).value || '', t = v ? new Date(v).getTime() : NaN, now = Date.now();
      if (!isFinite(t)) { render(); say('nsModeMsg', '結束時間格式不對，請重選。', 'err'); return; }
      if (t <= now) { render(); say('nsModeMsg', '結束時間要在現在之後。', 'err'); return; }
      if (t > now + MODE_MAX_MS) { render(); say('nsModeMsg', '結束時間最多只能設到 7 天後。', 'err'); return; }
      save({ mode: S.settings.mode, modeUntil: new Date(t).toISOString() }, 'nsModeMsg');
    };
    var bn = document.getElementById('nsNormal'); if (bn) bn.onclick = function () { save({ mode: 'normal' }, 'nsModeMsg'); };
    body.querySelectorAll('input[data-kind]').forEach(function (c) { c.onchange = function () { var k = {}; k[c.getAttribute('data-kind')] = c.checked; save({ kinds: k }, 'nsKindMsg'); }; });
    body.querySelectorAll('input[data-bool]').forEach(function (c) { c.onchange = function () { var p = {}, f = c.getAttribute('data-bool'); p[f] = c.checked; save(p, f === 'quietEnabled' || f === 'urgentBypass' ? 'nsQuietMsg' : 'nsKindMsg'); }; });
    body.querySelectorAll('select[data-hm]').forEach(function (c) { c.onchange = function () {
      var f = c.getAttribute('data-hm'), where = /^quiet/.test(f) ? 'nsQuietMsg' : 'nsWorkMsg';
      if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(c.value)) { render(); say(where, '時間格式不對，已改回原本的設定。', 'err'); return; }
      var p = {}; p[f] = c.value; save(p, where);
    }; });
    var od = document.getElementById('nsOverdue');
    if (od) od.onchange = function () {
      var n = Number(od.value);
      if (!(n % 1 === 0 && n >= 15 && n <= 1440)) { render(); say('nsKindMsg', '等多久要填 15 到 1440 之間的整數分鐘，已改回原本的設定。', 'err'); return; }
      save({ overdueMin: n }, 'nsKindMsg');
    };
    body.querySelectorAll('input[data-day]').forEach(function (c) { c.onchange = function () {
      var days = []; body.querySelectorAll('input[data-day]').forEach(function (x) { if (x.checked) days.push(Number(x.getAttribute('data-day'))); });
      if (c.parentNode) c.parentNode.classList.toggle('on', c.checked);
      save({ workDays: days }, 'nsWorkMsg');
    }; });
    var tb = document.getElementById('nsTest'); if (tb) tb.onclick = test;
  }

  // 存：一次一筆排隊送（後台每次回完整設定，照順序套才不會被舊回應蓋掉）。
  // 逾時：後台是整列讀出合併寫回、以抵達順序為準，所以要等原本那筆請求真的結束（成功或失敗）才重讀、才放行下一筆；等待期間設定鎖住不能改
  function save(patch, where) {
    say(where, '儲存中…', '');
    S.chain = S.chain.then(function () {
      var real = api({ app: { op: 'pushSettingsSet', settings: patch } }, true);
      return race(real).then(function (r) {
        if (r && r.ok === true && r.settings) { S.settings = r.settings; if (r.modeDefaults) S.defaults = r.modeDefaults; render(); say(where, '已儲存。', 'ok'); return; }
        render(); say(where, '沒有存成功（' + errLabel(r) + '），已改回原本的設定。', 'err');
      }, function (e) {
        if (isGone(e)) { close(); return; }
        if (!isTimeout(e)) { render(); say(where, '沒有存成功（' + friendlyErr(e && e.message) + '），已改回原本的設定。', 'err'); return; }
        S.locked = true; render(); say(where, '網路逾時：還在確認剛才的修改有沒有存成功，確認完之前先不能改設定。', 'err');
        return real.then(function (r) { return r && r.ok === true && r.settings ? 'saved' : 'failed'; }, function (e2) { return isGone(e2) ? 'gone' : 'unknown'; }).then(function (outcome) {
          S.locked = false;
          if (outcome === 'gone') { close(); return; }
          return reload(where, outcome);
        });
      });
    });
    return S.chain;
  }
  function reload(where, outcome) {   // 原本那筆請求已經結束：這時讀到的就是後台實際的值
    // 後台明確回失敗才說沒存成功；連線中斷或一直沒回應＝結果不明，不下結論
    var head = outcome === 'saved' ? '剛才的修改晚了一點，但已經存進去。' : (outcome === 'unknown' ? '還是沒有收到後台回應，不確定剛才的修改有沒有存進去，請看一下是不是你要的。' : '剛才的修改沒有存成功。');
    return call({ op: 'pushSettingsGet' }).then(function (r) {
      if (r && r.ok === true && r.settings) { S.settings = r.settings; S.defaults = r.modeDefaults || S.defaults; render(); say(where, head + '畫面上是後台目前的設定。', outcome === 'saved' ? 'ok' : 'err'); return; }
      render(); say(where, head + '重新讀取設定失敗（' + errLabel(r) + '），畫面上的值可能不是最新，請關掉再打開。', 'err');
    }, function (e) {
      if (isGone(e)) { close(); return; }
      render(); say(where, head + '重新讀取設定失敗（' + (isTimeout(e) ? '網路逾時' : friendlyErr(e && e.message)) + '），畫面上的值可能不是最新，請關掉再打開。', 'err');
    });
  }
  function load() {   // 也排進同一條隊伍：前一筆存檔還沒結束時讀，會讀到舊值
    S.settings = null; S.loadErr = ''; render();
    S.chain = S.chain.then(function () {
      return call({ op: 'pushSettingsGet' }).then(function (r) {
        if (r && r.ok === true && r.settings) { S.settings = r.settings; S.defaults = r.modeDefaults || null; } else S.loadErr = errLabel(r);
        render();
      }, function (e) {
        if (isGone(e)) { close(); return; }
        S.loadErr = isTimeout(e) ? '網路逾時，請確認網路後再試' : friendlyErr(e && e.message); render();
      });
    });
    return S.chain;
  }

  // 測試通知
  function setTest(text, cls) { S.testMsg = { text: text, cls: cls || '' }; say('nsTestMsg', text, cls); }
  function wait(sec) {
    S.testUntil = Date.now() + sec * 1000; clearInterval(S.testTimer);
    var tick = function () {
      var left = Math.ceil((S.testUntil - Date.now()) / 1000), b = document.getElementById('nsTest');
      if (left <= 0) { clearInterval(S.testTimer); S.testTimer = null; S.testUntil = 0; if (b) b.disabled = false; setTest('可以再試一次了。', ''); return; }
      if (b) b.disabled = true; setTest('剛剛才傳過，請一分鐘後再試（還要 ' + left + ' 秒）。', 'err');
    };
    tick(); S.testTimer = setInterval(tick, 1000);
  }
  function test() {
    var b = document.getElementById('nsTest');
    if (!b || Date.now() < S.testUntil || b.classList.contains('busy')) return;
    busy(b, true, '傳送中'); setTest('', '');
    call({ op: 'pushTest' }).then(function (r) {
      busy(b, false);
      if (r && r.error === 'rate_limited') { wait(Math.max(1, Number(r.retryAfterSec) || 60)); return; }
      var cred = (r && r.credentials === false) ? ' 另外，系統端的推播憑證有問題，通知暫時送不出去，請通知管理者。' : '';
      if (r && r.ok === true && r.queued) { setTest('已送出，請看手機有沒有收到「測試通知」' + (Number(r.devices) > 1 ? '（會送到 ' + Number(r.devices) + ' 支手機）' : '') + '。' + cred, cred ? 'err' : 'ok'); return; }
      if (r && r.ok === true && r.reason === 'no_device') { setTest('這支手機還沒登記通知：你的帳號目前沒有可以收通知的手機。請在手機 App 登入並允許通知，再試一次。' + cred, 'err'); return; }
      setTest('測試通知沒有送出（' + errLabel(r) + '）。' + cred, 'err');
    }, function (e) {
      busy(b, false);
      if (isGone(e)) { close(); return; }
      setTest(isTimeout(e) ? '網路逾時：沒有收到回應，不確定測試通知有沒有送出。請等一分鐘看手機，沒收到再按一次。' : '測試通知沒有送出（' + friendlyErr(e && e.message) + '）。', 'err');
    });
  }

  function hide() { S.open = false; if (box) box.classList.remove('on'); document.body.classList.remove('ns-open'); }
  function open() {
    if (!box) return;
    var sh = document.getElementById('yz-sheet'), mk = document.getElementById('yz-sheet-mask');
    if (sh) sh.classList.remove('on'); if (mk) mk.classList.remove('on');
    if (!S.open) { S.open = true; box.classList.add('on'); document.body.classList.add('ns-open'); box.scrollTop = 0; try { history.pushState({ yzNs: 1 }, ''); S.pushed = true; } catch (e) { S.pushed = false; } }
    load();
  }
  function close() {
    if (!S.open) return;
    if (S.pushed) { S.pushed = false; try { history.back(); return; } catch (e) {} }
    hide();
  }
  window.addEventListener('popstate', function () { if (S.open) { S.pushed = false; hide(); } });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.open) close(); });
  ['nsOpen', 'nsOpen2'].forEach(function (id) { var el = document.getElementById(id); if (el) el.onclick = open; });
  var cb = document.getElementById('nsClose'); if (cb) cb.onclick = close;
  return { open: open, close: close, isOpen: function () { return S.open; } };
})();

/* 收件匣設定（App 殼才有入口）：通知設定、登入信箱（前兩碼＋遮罩）、App 版本、登出。之後的帳號、客服規則等往 .st-list 加列。 */
var yzSt = (function () {
  var box = document.getElementById('stBox'), isOpen = false, pushed = false;
  if (!box) return { open: function () {}, close: function () {}, isOpen: function () { return false; } };
  function maskEmail(e) { e = String(e || ''); return e ? e.substring(0, 2) + '••••••' : '讀不到'; }
  function fill() {
    var em = document.getElementById('stEmail'), ver = document.getElementById('stVer');
    try { sb.auth.getSession().then(function (r) { var u = r && r.data && r.data.session && r.data.session.user; em.textContent = maskEmail(u && u.email); }, function () { em.textContent = '讀不到'; }); } catch (e) { em.textContent = '讀不到'; }
    var A = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
    if (A && A.getInfo) A.getInfo().then(function (i) { ver.textContent = (i && i.version) ? i.version + (i.build ? '（' + i.build + '）' : '') : '讀不到'; }, function () { ver.textContent = '讀不到'; });
    else ver.textContent = '網頁版';
    if (window.yzOc) yzOc.usageInto('stOcUsage');
  }
  function hide() { isOpen = false; box.classList.remove('on'); document.body.classList.remove('st-open'); }
  function open() {
    if (!isOpen) { isOpen = true; box.classList.add('on'); document.body.classList.add('st-open'); box.scrollTop = 0; try { history.pushState({ yzSt: 1 }, ''); pushed = true; } catch (e) { pushed = false; } }
    fill();
  }
  function close() {
    if (!isOpen) return;
    if (pushed) { pushed = false; try { history.back(); return; } catch (e) {} }
    hide();
  }
  window.addEventListener('popstate', function (ev) { if (isOpen && !(ev.state && ev.state.yzSt)) { pushed = false; hide(); } });   // 從通知設定返回時回到設定這一層（state 仍是 yzSt），不跟著關
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && isOpen && !(window.yzNs && yzNs.isOpen())) close(); });
  ['stOpen', 'stOpen2'].forEach(function (id) { var el = document.getElementById(id); if (el) el.onclick = open; });
  document.getElementById('stClose').onclick = close;
  document.getElementById('stNs').onclick = function () { yzNs.open(); };
  document.getElementById('stHb').onclick = function () { if (window.yzHb) yzHb.open(); };
  document.getElementById('stLeave').onclick = function () { document.getElementById('leave').click(); };
  return { open: open, close: close, isOpen: function () { return isOpen; } };
})();
</script>
<script>
/* 跟 AI 討論與我的習慣（2026-11-20，2026-11-22 對齊 cs-run 1.81.0 契約）。後端 cs-run ownerapp.ts／habits.ts：
   ownerChatWho／ownerChatSend／ownerChatLoad／ownerChatUsage、habitAdd／habitConfirm／habitDiscard／habitList／habitUpdate／habitDisable／habitEnable／habitDelete。
   登入後先問 ownerChatWho：isOwner 才顯示入口（html.oc-owner），等級選項、預設等級、花費提醒也從這裡先拿。
   不是核可人時後端回 HTTP 200＋owner_only，只把入口收掉，不登出、不顯示錯誤；真的登入失效（401／403）照主程式 api() 的規矩登出。
   這裡沒有任何直接發給客戶的動作；對話做了事（照發、退回、重擬、擬新稿）只是把結果顯示出來並刷新收件匣。後端來的字一律 esc。 */
var yzOc = (function () {
  var TIER_NAME = { fast: '快', standard: '標準', deep: '深入' }, TIERS0 = ['fast', 'standard', 'deep'];
  var S = { owner: false, loaded: false, msgs: [], hasMore: false, cats: [], tiers: TIERS0.slice(), defTier: 'standard', tier: '', busy: false, mentions: [], quotes: [], cost: null, open: false, pushed: false, late: [], usage: null, seq: 0, canAdd: false, lookupErr: false };
  var box = document.getElementById('ocBox');
  function $(id) { return document.getElementById(id); }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function objs(x) { return arr(x).filter(function (v) { return v && typeof v === 'object'; }); }
  function hhmm(at) { var ms = Date.parse(at || ''); return ms ? tpeMinute(ms).slice(5) : ''; }
  function money(twd, usd) { return '約 NT$' + Math.round(Number(twd) || 0) + '（US$' + (Math.round((Number(usd) || 0) * 100) / 100) + '）'; }
  function costOk(a) { return !!(a && typeof a === 'object' && Number(a.thresholdUsd) > 0); }

  function call(app) {
    return api({ app: app }, true).then(function (d) {
      d = (d && typeof d === 'object') ? d : {};
      if (d.ok === false && d.error === 'owner_only') lostOwner();
      return d;
    });
  }

/* 我的習慣：AI 記下的規矩，依分類分組；已確認、待確認、已停用都列。可改內容、分類與適用對象，停用、啟用、刪除（刪除要確認）；待確認的可記下、不用、改一下再記；後端說可以（canAdd）時可以自己新增一筆。 */
var yzHb = (function () {

  var ST = { confirmed: '已確認', pending: '待確認', disabled: '已停用' }, ORDER = { pending: 0, confirmed: 1, disabled: 2 };
  function day(x) { var ms = Date.parse(x || ''); return ms ? tpeMinute(ms).slice(0, 10) : ''; }

  function scopeParam(sc) { sc = normScope(sc); return sc.type === 'contact' ? { type: 'contact', contactId: sc.contactId } : { type: 'all' }; }

    if (H.edit === h.id) return '<div class="hb-it oc-edit" data-hb="' + id + '" data-st="' + st + '"><textarea class="hb-e-text" maxlength="200">' + esc(h.content || '') + '</textarea><select class="hb-e-cat" aria-label="分類">' + yzOc.catOptions(h.category || '') + '</select>' + scopeEd() + msg
      + '<div class="oc-btns"><button type="button" class="btn small" data-ha="save">' + (st === 'pending' ? '記下' : '存起來') + '</button><button type="button" class="btn ghost small" data-ha="cancel">取消</button></div></div>';
    var btns = st === 'pending' ? [['yes', '記下', ''], ['no', '不用', 'ghost'], ['edit', '改一下再記', 'ghost']]

      + '<div class="oc-btns">' + btns.map(function (b) { return '<button type="button" class="btn small ' + b[2] + '" data-ha="' + b[0] + '">' + b[1] + '</button>'; }).join('') + '</div></div>';

  function render() {

    cats.forEach(function (c) {

      if (!items.length) return;
      h += '<div class="hb-cat" data-cat="' + esc(c) + '">' + esc(c) + '（' + items.length + '）</div>' + items.map(itemHtml).join('');

    h += '<div class="st-list" style="margin-top:16px"><div class="oc-usage" id="hbUsage"></div></div>';
    var keepEd = null, edEl = H.edit ? body.querySelector('.hb-it.oc-edit[data-hb]') : null;   /* 重畫時保留編輯框裡還沒存的字 */
    if (edEl && edEl.getAttribute('data-hb') === H.edit) keepEd = { txt: edEl.querySelector('.hb-e-text').value, cat: edEl.querySelector('.hb-e-cat').value };
    var addT = document.getElementById('hbAddText'), addC = document.getElementById('hbAddCat'), keepAdd = H.adding && addT && addC ? { txt: addT.value, cat: addC.value } : null;
    body.innerHTML = h; yzOc.usageInto('hbUsage');
    if (keepEd) keepDraft(H.edit, keepEd);
    if (keepAdd && (addT = document.getElementById('hbAddText'))) { addT.value = keepAdd.txt; document.getElementById('hbAddCat').value = keepAdd.cat; }
    if (H.flash && H.flash.scroll) { H.flash.scroll = false; var el = body.querySelector('.hb-flash'); if (el && el.scrollIntoView) try { el.scrollIntoView({ block: 'center' }); } catch (e) {} }
  }
  function load() {
    H.err = ''; if (!H.list) render();
    return yzOc.call({ op: 'habitList', status: 'all' }).then(function (d) {
      if (d.ok === true && Array.isArray(d.habits)) { H.list = d.habits.filter(function (x) { return x && typeof x === 'object'; }); yzOc.setCats(d.categories); H.err = ''; H.canAdd = d.canAdd === true; }
      else if (d.error === 'owner_only') return;
      else { H.list = null; H.err = '讀不到我的習慣（' + yzOc.errText(d) + '）'; }
      render();
    }, function (e) { H.list = null; H.err = '讀不到我的習慣（' + yzOc.errText(e) + '）'; render(); });
  }
  function flashOn(id, text) { H.flash = id ? { id: String(id), text: text, scroll: true } : null; }
  var APPLIED = { update: '已套用到原本這一條。', replace: '已記下，舊的那一條已停用。', merged: '已經有一樣的，已併入這一條，沒有重複記。' };
  function act(id, a, el) {
    var h = (H.list || []).filter(function (x) { return x.id === id; })[0]; if (!h || H.busy[id]) return;
    H.msg[id] = ''; delete H.dup[id]; H.notice = '';
    if (a === 'edit') { H.edit = id; H.adding = false; H.sc = normScope(h.scope); H.picking = false; render(); return; }
    if (a === 'cancel') { H.edit = ''; H.picking = false; render(); return; }
    if (a === 'del' && !confirm('刪除這條習慣？\n\n' + String(h.content || '') + '\n\n刪掉就不會再用，也救不回來。')) return;
    var app = { yes: { op: 'habitConfirm', id: id }, no: { op: 'habitDiscard', id: id }, disable: { op: 'habitDisable', id: id }, enable: { op: 'habitEnable', id: id }, del: { op: 'habitDelete', id: id } }[a];
    var draft = null;
    if (a === 'save') {
      var card = el.closest('.hb-it'), txt = String(card.querySelector('.hb-e-text').value || '').trim(), cat = card.querySelector('.hb-e-cat').value;
      draft = { txt: txt, cat: cat };
      if (txt.length < 4 || txt.length > 200) { H.msg[id] = yzOc.ERR.content_invalid; render(); keepDraft(id, draft); return; }
      app = { op: h.status === 'pending' ? 'habitConfirm' : 'habitUpdate', id: id };
      if (txt !== String(h.content || '')) app.content = txt;
      if (cat !== String(h.category || '')) app.category = cat;
      if (!sameScope(H.sc, h.scope)) app.scope = scopeParam(H.sc);
      if (app.op === 'habitUpdate' && app.content === undefined && app.category === undefined && app.scope === undefined) { H.edit = ''; render(); return; }
    }
    if (!app) return;
    H.busy[id] = true; busy(el, true, '處理中');
    yzOc.call(app).then(function (d) {
      delete H.busy[id];

        if (H.edit === id) { H.edit = ''; H.picking = false; }
        if (app.op === 'habitConfirm' && d.habit && APPLIED[d.applied]) flashOn(d.habit.id, APPLIED[d.applied]); else flashOn(null);
        load(); return;   /* 以後台為準重讀（併入、取代會動到別筆） */

      if (d.error === 'owner_only') return;

      if (d.error === 'duplicate' && d.existingId) H.dup[id] = String(d.existingId);
      if (d.error === 'not_found') { H.notice = d.goneReason ? '剛剛那一條已經不在了：' + yzOc.goneText(d.goneReason) : yzOc.ERR.not_found; if (H.edit === id) H.edit = ''; load(); return; }
      if (d.error === 'not_pending' || d.error === 'is_pending') { if (H.edit === id) H.edit = ''; load(); return; }

  }
  function keepDraft(id, draft) {   /* 存不成功時把剛打的字與分類放回編輯框 */

    var cards = body.querySelectorAll('.hb-it[data-hb]');
    for (var i = 0; i < cards.length; i++) if (cards[i].getAttribute('data-hb') === id) { var t = cards[i].querySelector('.hb-e-text'), c = cards[i].querySelector('.hb-e-cat'); if (t) t.value = draft.txt; if (c) c.value = draft.cat; }
  }
  function addSave(el) {

      if (d.error === 'duplicate') { H.adding = false; H.addErr = ''; H.picking = false; flashOn(d.existingId, '已經有一樣的了（就是這一條），沒有重複新增。'); load(); return; }

<div id="imgZoomBox" role="dialog" aria-label="照片檢視">
  <div class="bar"><button type="button" id="imgZoomClose">關閉</button><a id="imgZoomRaw" href="#" target="_blank" rel="noopener">另開原圖</a></div>
  <div class="pic" id="imgZoomPic"><img id="imgZoomImg" alt=""></div>
</div>
<script>
/* 對話裡的照片改在同一頁放大檢視：原本另開分頁，手機上按返回回不來（Wayne 2026-11-13） */
(function () {
  var box = document.getElementById('imgZoomBox'), img = document.getElementById('imgZoomImg'), raw = document.getElementById('imgZoomRaw');
  var pushed = false;
  function hide() { box.classList.remove('on'); img.removeAttribute('src'); }
  function closeZoom() { if (!box.classList.contains('on')) return; if (pushed) { pushed = false; try { history.back(); return; } catch (e) {} } hide(); }
  function openZoom(url) {
    img.src = url; raw.href = url; box.classList.add('on');
    try { history.pushState({ imgZoom: 1 }, ''); pushed = true; } catch (e) { pushed = false; }
  }
  window.addEventListener('popstate', function () { if (box.classList.contains('on')) { pushed = false; hide(); } });
  document.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a.imgZoom') : null;
    if (!a) return;
    ev.preventDefault(); openZoom(a.getAttribute('href'));
  });
  document.getElementById('imgZoomClose').onclick = closeZoom;
  document.getElementById('imgZoomPic').onclick = function (ev) { if (ev.target === this) closeZoom(); };
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeZoom(); });
})();
</script>
