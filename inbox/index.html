<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植間 - 對話收件匣</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<style>
  /* 關掉手機瀏覽器的下拉重新整理：改稿時在框裡往上捲到頂再往下拉，會被當成整頁重新整理（2026-10-21 Wayne 回報） */
  html,body{overscroll-behavior-y:contain}
  textarea,.chat{overscroll-behavior:contain}
  /* #contacts 只有桌機版是真的捲動容器（72vh）；手機版 max-height:none 不會自己捲，若也設 contain 會把手指捲動擋在清單裡、整頁滑不動（2026-11-03 Wayne 回報） */
  @media(min-width:821px){#contacts{overscroll-behavior:contain}}
  :root{--moss:#5F6E58;--paper:#F2EDE3;--ink:#1B1A17;--muted:#8a8275;--body:#4A4A45;--line:#E5E0D3;--brick:#8a4a30;--amber:#F3E9C9;--tint:#EEF2E6}
  *{margin:0;padding:0;box-sizing:border-box}
  html{overflow-x:clip}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",-apple-system,sans-serif}
  h1{font-size:18px;letter-spacing:.05em;margin:8px 0 2px}
  .sub{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:10px}
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:12px}
  .wrap>*{min-width:0}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;overflow:hidden}
  .btn{padding:9px 14px;background:var(--moss);color:var(--paper);border:none;border-radius:4px;font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:#fff;color:var(--moss);border:1px solid var(--moss)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn.link{background:none;border:none;color:var(--moss);padding:4px 6px;font-size:12px;text-decoration:underline}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.busy{opacity:.6;pointer-events:none}
  .tabs{display:flex;gap:4px;margin:6px 0 8px}
  .tabs button{flex:1;padding:8px 4px;border:1px solid var(--line);background:#fff;border-radius:4px;font-family:inherit;font-size:13px;color:var(--body);cursor:pointer}
  .tabs button.on{background:var(--moss);color:#fff;border-color:var(--moss)}
  .find{display:flex;gap:6px;margin-bottom:8px}
  .find input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);font-family:inherit;font-size:13px}
  .ct{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
  .ct.on{background:#E9EDE3}
  .ct.hot{background:#FBF9F1}
  .ct .n{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ct .m{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ct .t{font-size:11px;color:var(--muted);float:right}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid #D9D3C4;border-radius:10px;color:#5F6E58;vertical-align:middle;font-weight:400}
  .pill.ap{background:var(--tint);border-color:#B9C4AE}
  .pill.man{background:var(--amber);border-color:#E0CF93;color:#7a5a12}
  .pill.tag{background:#EEF2E6;border-color:#C9D3B8;color:#4B5A42}.pill.wait{background:#F7E4DC;border-color:#E4B9A8;color:var(--brick)}
  .sched{padding:8px;border-bottom:1px solid var(--line);font-size:13px}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .head b{font-size:17px}
  .back{display:none}
  @media(max-width:820px){
    body.view-thread .listcard{display:none}
    body:not(.view-thread) .threadcard{display:none}
    .back{display:inline-block}
  }
  #contacts{max-height:72vh;overflow-y:auto}
  @media(max-width:820px){#contacts{max-height:none}}
  details.dossier{margin:8px 0;border:1px solid var(--line);border-radius:6px;background:#FBF9F3}
  details.dossier summary{padding:8px 10px;font-size:13px;cursor:pointer;color:var(--moss);font-weight:600;list-style:none}
  details.dossier summary::-webkit-details-marker{display:none}
  details.dossier .in{padding:0 10px 10px;font-size:12px;color:var(--body);overflow-wrap:anywhere}
  details.dossier ul{margin-left:16px}
  details.dossier h4{font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  .chat{min-height:200px;max-height:46vh;overflow-y:auto;overflow-x:hidden;padding:6px 2px;border-top:1px solid var(--line);margin-top:6px}
  .msg{max-width:84%;margin:8px 0;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}
  .msg.in{margin-right:auto;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.out{margin-left:auto;background:#DCE8D3;border-bottom-right-radius:3px}
  .msg.event{max-width:100%;background:none;color:var(--muted);font-size:11px;text-align:center;padding:2px}
  .msg .who{font-size:11px;color:var(--muted);margin-bottom:2px}
  .msg.out .who,.msg.out .ts{text-align:right}
  .msg .ts{font-size:11px;color:var(--muted);margin-top:3px}
  .draft{margin-top:10px;padding:12px;border:1px solid #B9C4AE;background:#F6F8F2;border-radius:8px}
  .draft .lab{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .draft textarea{width:100%;padding:10px;border:1px solid var(--line);font-family:inherit;font-size:15px;line-height:1.5;background:#fff;color:var(--ink);border-radius:6px}
  .draft details{margin-top:6px;font-size:12px;color:var(--body)}
  .draft details summary{cursor:pointer;color:var(--moss)}
  .draft .brief{white-space:pre-wrap;padding:6px 8px;background:var(--tint);border-radius:6px;margin-top:4px}
  .actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .actions .btn.main{flex:1 1 140px;font-size:15px;padding:12px}
  .secondary{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;align-items:center}
  .when{display:none;margin-top:8px;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--body)}
  .when.on{display:flex}
  .when input{font-size:13px;padding:5px 6px;border:1px solid var(--line);font-family:inherit}
  .fbbox{display:none;margin-top:8px;padding:10px;background:var(--amber);border-radius:6px}
  .fbbox.on{display:block}
  .fbbox textarea{width:100%;padding:8px;border:1px solid #E0CF93;font-family:inherit;font-size:14px;background:#fff}
  .stars{display:inline-flex;gap:2px;margin-right:8px;vertical-align:middle}
  .stars button{background:none;border:0;padding:0 1px;font-size:18px;line-height:1;cursor:pointer;color:#D9D3C4}
  .stars button.on{color:#C9A227}
  .compose{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .compose textarea{width:100%;padding:10px;border:1px solid var(--line);font-family:inherit;font-size:15px;line-height:1.5;background:#fff;border-radius:6px}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .small{font-size:12px}.muted{color:var(--muted)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #D9D3C4;border-top-color:var(--moss);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{padding:18px 8px;color:var(--muted);font-size:13px}
  .att{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .att .it{position:relative;flex:0 0 auto;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;font-size:11px;color:var(--body);max-width:120px}
  .att .it img{display:block;width:84px;height:84px;object-fit:cover;border-radius:4px}
  .att .it .x{position:absolute;top:-6px;right:-6px;background:var(--brick);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;cursor:pointer;padding:0}
  .attbtn{font-size:12px}
  input[type=text],select{padding:6px 8px;border:1px solid var(--line);font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#EEE9DD;color:#5A5344;border:1px solid #DDD5C2}.chip.ok{background:#E3EFE1;color:#3D6B3A;border-color:#C6DCC3}.chip.warn{background:#FFF1E6;color:#9A4E1E;border-color:#F1CDB0}

  /* ── Workspace 殼同款外觀（2026-09-26）：桌機＝工具列；手機＝上方列＋底部分頁＋☰ 全部工具 ── */
  .page{max-width:1200px;margin:0 auto;padding:12px}
  .yz-tabbar{background:#fff;border-bottom:1px solid rgba(27,26,23,.12);padding:0 24px;display:flex;flex-wrap:wrap;align-items:stretch}
  .yz-tab{display:inline-flex;align-items:center;gap:7px;padding:11px 13px;color:rgba(27,26,23,.62);text-decoration:none;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;cursor:pointer}
  .yz-tab:hover{color:#1B1A17;background:#F2EDE3}
  .yz-tab.active{color:var(--moss);border-bottom-color:var(--moss);background:#E9EDE3;font-weight:500}
  .yz-tab svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .yz-tab.yz-tab-home{border-right:1px solid rgba(27,26,23,.08);margin-right:6px;padding-right:16px;color:rgba(27,26,23,.45)}
  .yz-tab-end{margin-left:auto;display:inline-flex;align-items:stretch;border-left:1px solid rgba(27,26,23,.08);padding-left:2px}   /* 齒輪＋登出一起換行（1440 寬會分家） */
  .yz-tab.yz-tab-out{font-size:12px;color:rgba(27,26,23,.45)}
  .yz-appbar,.yz-bottomnav,.yz-sheet,.yz-sheet-mask{display:none}
  @media(max-width:820px){
    body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
    body.view-thread{padding-bottom:8px}
    .page{padding:8px}
    .yz-tabbar,#app>.page>h1,.tabs{display:none}
    .yz-appbar{display:flex;position:sticky;top:0;z-index:50;align-items:center;gap:6px;height:50px;padding:0 6px 0 4px;background:#fff;border-bottom:1px solid rgba(27,26,23,.10)}
    .yz-appbar a,.yz-appbar button{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:44px;height:44px;padding:0 6px;border:none;background:none;color:#4F6147;font-family:inherit;font-size:14px;text-decoration:none;border-radius:10px;white-space:nowrap}
    .yz-appbar a:active,.yz-appbar button:active{background:var(--paper)}
    .yz-appbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .yz-appbar .yz-appbar-t{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    body.view-thread #yz-home{display:none} body:not(.view-thread) #yz-back{display:none}
    .back{display:none !important}   /* 上方列已有「清單」 */
    .sub{padding:6px 4px 0}
    body.view-thread .sub{display:none}
    .yz-bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid rgba(27,26,23,.10);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:60}
    .yz-bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border:none;background:none;font-family:inherit;font-size:11px;color:rgba(27,26,23,.6);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .yz-bottomnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .yz-bottomnav button.on{color:#4F6147}
    body.view-thread .yz-bottomnav{display:none}
    .yz-sheet-mask.on{display:block;position:fixed;inset:0;background:rgba(27,26,23,.35);z-index:70}
    .yz-sheet.on{display:block;position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:71}
    .yz-sheet h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .yz-sheet h3 button{border:none;background:none;font-family:inherit;font-size:14px;color:rgba(27,26,23,.6);padding:6px 10px}
    .yz-sheet-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .yz-sheet-grid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid rgba(27,26,23,.08);border-radius:12px;text-decoration:none;color:var(--ink);font-size:12px}
    .yz-sheet-grid a svg{width:22px;height:22px;stroke:#4F6147;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .yz-sheet-grid a.active{background:#E9EDE3;border-color:var(--moss)}
    .yz-sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
  }

#imgZoomBox{position:fixed;inset:0;z-index:9999;background:rgba(27,26,23,.94);display:none;flex-direction:column}
#imgZoomBox.on{display:flex}
#imgZoomBox .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;flex:none}
#imgZoomBox .bar button{font-size:16px;padding:10px 18px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:2px}
#imgZoomBox .bar a{color:rgba(255,255,255,.75);font-size:13px;text-decoration:underline}
#imgZoomBox .pic{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
#imgZoomBox .pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
</style>
</head>
<body>
<div id="gate" class="card" style="max-width:420px;width:calc(100% - 16px);margin:40px auto;display:none">
  <h2 style="font-size:16px;margin-bottom:8px">進入收件匣</h2>
  <div class="small muted" style="margin-bottom:10px">輸入信箱收一組驗證碼；同一台裝置通過一次就會記住。</div>
  <div class="row"><input type="email" id="gateEmail" placeholder="waynelin@yuzhiplant.com" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);font-family:inherit;font-size:14px"><button class="btn" id="gateSend">寄驗證碼</button></div>
  <div class="row" id="otpRow" style="display:none"><input type="text" id="gateCode" placeholder="信裡的 8 碼" inputmode="numeric" style="flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--line);font-family:inherit;font-size:14px"><button class="btn" id="gateVerify">進入</button></div>
  <div class="small muted" id="gateMsg" style="margin-top:8px"></div>
</div>
<div id="app" style="display:none">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  </symbol>
<symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

  </symbol>

    <line x1="4" y1="10" x2="4" y2="18"></line>

    <circle cx="12" cy="12" r="8"></circle>
    <polyline points="12 7 12 12 16 14"></polyline>
  </symbol>
<symbol id="icon-contract" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

<symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

    <rect x="3" y="5" width="18" height="14" rx="1"></rect>
    <polyline points="3 7 12 14 21 7"></polyline>
  </symbol>
<symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

    <line x1="4" y1="12" x2="20" y2="12"></line>
    <line x1="4" y1="18" x2="20" y2="18"></line>
  </symbol>
<symbol id="icon-payment" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="6" width="18" height="13" rx="1"></rect>
    <line x1="3" y1="10" x2="21" y2="10"></line>
    <line x1="7" y1="15" x2="11" y2="15"></line>
  </symbol>
<symbol id="icon-plant" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21V11"></path>
    <path d="M12 11C12 8 9 6 6 6c0 3 3 5 6 5z"></path>
    <path d="M12 11c0-3 3-5 6-5 0 3-3 5-6 5z"></path>
  </symbol>
<symbol id="icon-quote" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="14" height="18"></rect>
    <line x1="7" y1="8" x2="15" y2="8"></line>
    <line x1="7" y1="12" x2="15" y2="12"></line>
    <line x1="7" y1="16" x2="12" y2="16"></line>
  </symbol>
<symbol id="icon-report" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18"></rect>
