<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>植間設計｜文件</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans TC", -apple-system, sans-serif; background: #F2EDE3; color: #1B1A17; }
  .top { max-width: 900px; margin: 0 auto; padding: 16px 14px 8px; }
  .brand { font-size: 12px; letter-spacing: .15em; color: #5F6E58; font-weight: 700; }
  .ttl { font-size: 15px; margin-top: 4px; color: #26251F; }
  .pages { max-width: 900px; margin: 0 auto; padding: 0 8px 90px; }
  canvas { display: block; width: 100%; height: auto; margin: 10px 0; background: #fff; box-shadow: 0 2px 14px rgba(27,26,23,.10); border-radius: 4px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(242,237,227,.96); border-top: 1px solid #D8D3C6; padding: 10px 14px; text-align: center; }
  .btn { display: inline-block; background: #5F6E58; color: #FFFCF5; text-decoration: none; padding: 11px 26px; border-radius: 8px; font-size: 15px; font-weight: 700; border: 0; cursor: pointer; }
  .msg { text-align: center; color: #8a8275; font-size: 13px; padding: 40px 12px; }
  .foot { text-align: center; color: #8a8275; font-size: 11px; padding: 6px 0 0; }
</style>
</head>
<body>
<div class="top"><div class="brand">YUZHI PLANT DESIGN</div><div class="ttl" id="ttl">文件載入中…</div></div>
<div class="pages" id="pages"><div class="msg" id="msg">正在準備文件…</div></div>
<div class="bar"><button class="btn" id="dl" disabled>下載 PDF</button><div class="foot">植間設計股份有限公司｜統編 90877240</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* pdf-view v1：由我們的後端取 PDF 內容（JSON base64），PDF.js 逐頁畫出，不經 Drive、不需對外開權限 */
var q = new URLSearchParams(location.search);
var SRC = q.get('src') || '';
var PDF = q.get('pdf') || '';   // 直接給 PDF 網址（同站檔案）；src＝後端 JSON base64
var TITLE = q.get('t') || '';
var inLine = /Line\//i.test(navigator.userAgent);
var bytes = null, fileName = 'document.pdf';
function setMsg(t) { var m = document.getElementById('msg'); if (m) m.textContent = t; }
function b64ToBytes(b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function render(data) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return pdfjsLib.getDocument({ data: data }).promise.then(function (pdf) {
    var box = document.getElementById('pages'); box.innerHTML = '';
    var width = Math.min(box.clientWidth - 16, 900);
    var chain = Promise.resolve();
    for (var n = 1; n <= pdf.numPages; n++) (function (num) {
      chain = chain.then(function () { return pdf.getPage(num); }).then(function (page) {
        var vp0 = page.getViewport({ scale: 1 }); var scale = (width / vp0.width) * (window.devicePixelRatio || 1);
        var vp = page.getViewport({ scale: scale });
        var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; box.appendChild(c);
        return page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      });
    })(n);
    return chain;
  });
}
function download() {
  if (!bytes) return;
  if (inLine) { location.href = location.href + (location.search ? '&' : '?') + 'openExternalBrowser=1'; return; }
  var blob = new Blob([bytes], { type: 'application/pdf' }); var u = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = u; a.download = fileName; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 2000);
}
document.getElementById('dl').onclick = download;
if (PDF) {
  fileName = (TITLE || 'document') + '.pdf'; document.getElementById('ttl').textContent = TITLE || '文件'; if (TITLE) document.title = TITLE + '｜植間設計';
  fetch(PDF).then(function (r) { return r.arrayBuffer(); }).then(function (ab) {
    bytes = new Uint8Array(ab);
    return render(bytes.slice(0)).then(function () { document.getElementById('dl').disabled = false; });
  }).catch(function () { setMsg('文件讀取失敗，請稍後再試'); });
}
else if (!SRC) { setMsg('缺少文件參數'); }
else {
  fetch(SRC, { redirect: 'follow' }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.ok || !d.b64) { setMsg((d && d.msg) || '文件讀取失敗，請稍後再試'); return; }
    fileName = d.name || fileName; document.getElementById('ttl').textContent = d.title || d.name || '文件'; document.title = (d.title || '文件') + '｜植間設計';
    bytes = b64ToBytes(d.b64);
    return render(bytes.slice(0)).then(function () { document.getElementById('dl').disabled = false; });
  }).catch(function () { setMsg('文件讀取失敗，請稍後再試'); });
}
</script>
</body>
</html>
