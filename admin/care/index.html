<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>養護總覽 ｜ 植間後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<style>
:root{--ink:#1B1A17;--ink-60:rgba(27,26,23,.6);--ink-20:rgba(27,26,23,.18);--paper:#F2EDE3;--page-bg:#EFEEE9;--card:#fff;--sage:#5F6E58;--sage-tint:#E9EDE3;--sage-deep:#4F6147;--amber:#B8893E;--amber-tint:#F5EBD7;--terra:#B85A3D;--terra-tint:#F5DDD2;--font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page-bg);color:var(--ink);line-height:1.6;min-height:100vh}
.top{background:var(--sage);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.top .brand{font-weight:500;letter-spacing:.06em;font-size:14px}
.top select{margin-left:auto;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-family:inherit}
.top select option{color:var(--ink)}
.top button,.top a.btn{padding:6px 10px;border:1px solid rgba(255,255,255,.5);border-radius:6px;background:transparent;color:#fff;font-size:12px;font-family:inherit;cursor:pointer;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--ink-20);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:500;letter-spacing:.06em;color:var(--sage);margin-bottom:8px}
.note{font-size:13px;color:var(--ink-60)}
input[type=email],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--ink-20);border-radius:8px;font-size:16px;font-family:inherit;margin-bottom:8px}
.btn{padding:10px 14px;border:none;border-radius:8px;background:var(--sage);color:#fff;font-size:14px;font-family:inherit;cursor:pointer}
.btn[disabled]{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--ink-20);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer}
.stat.on{outline:2px solid var(--sage)}
.stat .v{font-size:22px;font-weight:500;color:var(--sage)}
.stat .l{font-size:11px;color:var(--ink-60);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ink-20)}
.row:first-child{border-top:none}
.row .n{flex:1;min-width:0}
.row .name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--ink-60);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;letter-spacing:.04em}
.chip.ok{background:var(--sage-tint);color:var(--sage-deep)}
.chip.warn{background:var(--amber-tint);color:var(--amber)}
.chip.bad{background:var(--terra-tint);color:var(--terra)}
.chip.mute{background:#EEE;color:var(--ink-60)}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts a{font-size:12px;color:var(--sage);border:1px solid var(--sage);border-radius:6px;padding:5px 8px;text-decoration:none;white-space:nowrap}
.acts a.mute{color:var(--ink-60);border-color:var(--ink-20)}
.acts{flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.acts button.lnk{font-size:12px;color:var(--sage);border:1px solid var(--sage);border-radius:6px;padding:5px 8px;background:#fff;font-family:inherit;cursor:pointer;white-space:nowrap}
.acts button.lnk[disabled]{opacity:.5}
.row .msg{font-size:12px;color:var(--ink-60);margin-top:2px;min-height:0}
.foot{text-align:center;font-size:11px;color:var(--ink-60);margin-top:18px;line-height:1.8}
.ld{text-align:center;color:var(--ink-60);padding:30px 0;font-size:13px}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.acts a{padding:5px 7px}}

.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.bar .tb{padding:11px 4px;border:1px solid var(--sage);border-radius:10px;background:#fff;color:var(--sage-deep);font-size:14px;font-family:inherit;cursor:pointer;line-height:1.3}
.bar .tb.main{background:var(--sage);color:#fff}
.bar .tb[disabled]{opacity:.45}
.selline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-60);margin-bottom:12px}
.selline b{color:var(--ink);font-weight:500}
.selline .more{margin-left:auto;padding:7px 12px;border:1px solid var(--ink-20);border-radius:8px;background:#fff;font-size:13px;font-family:inherit;cursor:pointer;color:var(--ink)}
.menu{display:none;background:var(--card);border:1px solid var(--ink-20);border-radius:12px;padding:6px 14px;margin-bottom:12px}
.menu.on{display:block}
.menu .it{display:flex;align-items:center;padding:12px 0;border-top:1px solid var(--ink-20);font-size:14px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
.menu .it:first-child{border-top:none}
.menu .it small{display:block;color:var(--ink-60);font-size:12px}
.menu .it[disabled]{opacity:.45}
.menu .sub{font-size:12px;color:var(--ink-60);padding:10px 0 4px;letter-spacing:.04em}
.menu a.it{text-decoration:none}
.row.sel{background:var(--sage-tint);margin:0 -16px;padding-left:16px;padding-right:16px}
.row .n{cursor:pointer}
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:84vh;display:flex;flex-direction:column}
.sheet h3{font-size:15px;font-weight:500;color:var(--sage-deep);padding:16px 18px 6px}
.sheet .body{padding:4px 18px 12px;overflow-y:auto;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.sheet .sched{padding:0 18px 10px;display:none}
.sheet .sched.on{display:block}
.sheet .sched input{width:100%;padding:9px 10px;border:1px solid var(--ink-20);border-radius:8px;font-size:16px;font-family:inherit}
.sheet .btns{display:flex;gap:8px;padding:10px 18px 18px;flex-wrap:wrap}
.sheet .btns button{flex:1;min-width:30%;padding:12px 8px;border-radius:10px;border:1px solid var(--sage);background:#fff;color:var(--sage-deep);font-size:14px;font-family:inherit;cursor:pointer}
.sheet .btns button.go{background:var(--sage);color:#fff}
.sheet .btns button[disabled]{opacity:.5}
.qrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ink-20);font-size:13px}
.qrow:first-child{border-top:none}
.qrow span{flex:1}
.qrow button{padding:5px 10px;border:1px solid var(--terra);color:var(--terra);background:#fff;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer}
@media (max-width:480px){.bar .tb{font-size:13px}}

.stats{grid-template-columns:repeat(5,1fr)}
.stat .l{font-size:10.5px}
@media (max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
.banner{background:var(--amber-tint);border:1px solid var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
.banner.on{display:block}
.rv{display:none;position:fixed;inset:0;background:var(--page-bg);z-index:40;overflow-y:auto}
.rv.on{display:block}
.rv .rvtop{position:sticky;top:0;background:var(--sage);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.rv .rvtop b{font-weight:500;flex:1;font-size:15px}
.rv .rvtop button{padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:6px;background:transparent;color:#fff;font-size:13px;font-family:inherit;cursor:pointer}
.rv .rvbody{max-width:760px;margin:0 auto;padding:12px 12px 110px}
.rep{background:#fff;border:1px solid var(--ink-20);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.rep .hd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.rep .hd span.sub{font-weight:400;font-size:12px;color:var(--ink-60)}
.rep .hd button{margin-left:auto;padding:6px 10px;border:1px solid var(--sage);border-radius:8px;background:#fff;color:var(--sage-deep);font-size:13px;font-family:inherit;cursor:pointer}
.rep .tk{margin:6px 0;display:flex;flex-wrap:wrap;gap:4px}
.rep .nt{font-size:13px;color:var(--ink);background:var(--paper);border-radius:8px;padding:6px 10px;margin:6px 0;white-space:pre-wrap}
.zone{border-top:1px solid var(--ink-20);padding:8px 0}
.zone .zn{font-size:13px;font-weight:500}
.zone .cap{font-size:12px;color:var(--ink-60);margin:2px 0 4px;white-space:pre-wrap}
.zone .lab{font-size:11px;color:var(--ink-60);margin:4px 0 2px}
.ph{display:flex;flex-wrap:wrap;gap:6px}
.ph a,.ph span{display:block;width:84px;height:84px;border-radius:8px;overflow:hidden;background:#EEE;font-size:11px;color:var(--ink-60);text-align:center;line-height:84px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.rvfoot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ink-20);padding:10px 14px;display:flex;gap:8px;z-index:3}
.rvfoot button{flex:1;padding:13px 8px;border-radius:10px;border:1px solid var(--sage);background:#fff;color:var(--sage-deep);font-size:15px;font-family:inherit;cursor:pointer}
.rvfoot button.go{background:var(--sage);color:#fff}
.rvfoot button.seen{background:var(--sage-tint)}
.rvfoot button[disabled]{opacity:.5}
.coachbox{display:none;margin-top:8px}
.coachbox.on{display:block}
.coachbox textarea{width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--ink-20);border-radius:8px;font-size:16px;font-family:inherit}
.coachbox .cb{display:flex;gap:8px;margin-top:6px}
.coachbox .cb button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--sage);background:#fff;color:var(--sage-deep);font-size:14px;font-family:inherit;cursor:pointer}
.coachbox .cb button.go{background:var(--sage);color:#fff}
</style>
</head>
<body>
<div class="top"><span class="brand">植間後台｜養護總覽</span><select id="ym"></select><a class="btn" id="gasLink" href="#" target="_blank">後台操作</a><button id="leave" style="display:none">離開</button></div>
<main>
  <div id="gate" class="card" style="display:none;max-width:420px;margin:40px auto">
    <h2>進入後台</h2>
    <div class="note" style="margin-bottom:10px">輸入公司信箱，收驗證碼後進入。</div>
    <input type="email" id="gateEmail" placeholder="信箱" autocomplete="email">
    <button class="btn" id="gateSend">寄驗證碼</button>
    <div id="otpRow" style="display:none;margin-top:10px"><input type="text" id="gateCode" placeholder="驗證碼" inputmode="numeric" autocomplete="one-time-code"><button class="btn" id="gateVerify">進入</button></div>
    <div class="note" id="gateMsg" style="margin-top:8px"></div>
  </div>
  <div id="app" style="display:none">
    <div class="banner" id="banner">回報收齊了：請逐家按「審閱」看每一次回報，需要就「記一筆」提醒夥伴，沒問題按「這家看過了」。只有勾過的家才會推給客戶。</div>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <button class="tb" id="bCheck">回報檢查</button>
      <button class="tb" id="bTest" disabled>試發給我</button>
      <button class="tb main" id="bSend" disabled>發送客戶</button>
      <button class="tb main" id="bAll">全部推播</button>
    </div>
    <div class="selline"><span id="selTxt">點下方案場選一家，才能試發或發送</span><button class="more" id="bMore">更多</button></div>
    <div class="menu" id="menu">
      <button class="it" id="mPdf" disabled><span>產出或重產 PDF<small>先選一家；已發行的會原地更新、連結不變</small></span></button>
      <button class="it" id="mRemind"><span>提醒養護員補回報<small>只送員工、不送客戶</small></span></button>
      <button class="it" id="mQueue"><span>排程中的發送<small>看與取消整批或單家排程</small></span></button>
      <button class="it" id="mCopy" disabled><span>複製客戶連結<small>先選一家</small></span></button>
      <div class="sub">還在舊版後台（尚未搬到這頁）</div>
      <a class="it" id="mOld1" href="#" target="_blank"><span>編輯照片、刪除回報、綁 LINE、記一筆指導<small>開舊版後台</small></span></a>
      <a class="it" id="mOld2" href="#" target="_blank"><span>發送指導、推播設定<small>開舊版後台</small></span></a>
    </div>
    <div class="card" id="list"><div class="ld">載入中</div></div>
    <div class="note" id="hint"></div>
  </div>
  <div class="sheet-bg" id="sheetBg"><div class="sheet"><h3 id="shT"></h3><div class="body" id="shB"></div><div class="sched" id="shS"><input type="datetime-local" id="shAt"></div><div class="btns" id="shBtns"></div></div></div>
  <div class="foot">清單由引擎鏡像出資料（最長落後 5 分）；所有送出動作的確認文字都由系統試算後產生。<br>植間設計股份有限公司</div>
</main>
<div class="rv" id="rv"><div class="rvtop"><b id="rvT"></b><button id="rvClose">關閉</button></div><div class="rvbody" id="rvB"></div><div class="rvfoot" id="rvF"><button id="rvCoach">記一筆</button><button class="go" id="rvSeen">這家看過了</button></div></div>
<script>
(function () {
  var CFG = { supabaseUrl: 'https://ytlakkxrbookftluulbo.supabase.co', anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0bGFra3hyYm9va2Z0bHV1bGJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MDY5MzcsImV4cCI6MjA5NzA4MjkzN30.2b9y-i9Y1niCXWgHFDhNhQ21COxtPde_AE4ixoIW2e4',
    engine: 'https://ytlakkxrbookftluulbo.supabase.co/functions/v1/api', gas: 'https://script.google.com/macros/s/AKfycbynzrz0je8qvKDVPboArvJqvl0M6L9Xr0cZL5t0lyo/exec', careView: 'https://waynelin-yuzhi.github.io/yuzhi-liff/care/' };
  var sb = window.supabase.createClient(CFG.supabaseUrl, CFG.anonKey);
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  var D = { ym: '', data: null, filter: 'all', months: [], sel: '', missing: {}, review: {}, rv: null };
  var wantReview = new URLSearchParams(location.search).get('review') === '1';
  function showGate() { $('gate').style.display = 'block'; $('app').style.display = 'none'; $('leave').style.display = 'none'; }
  function showApp() { $('gate').style.display = 'none'; $('app').style.display = 'block'; $('leave').style.display = 'inline-block'; }
  function api(action, payload) {
    return sb.auth.getSession().then(function (r) {
      var s = r.data && r.data.session; if (!s) { showGate(); throw new Error('請先進入'); }
      return fetch(CFG.engine + '?action=' + action, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.access_token }, body: JSON.stringify(payload || {}) });
    }).then(function (res) { if (res.status === 401 || res.status === 403) { sb.auth.signOut({ scope: 'local' }); showGate(); throw new Error('連線已失效，請重新進入'); } return res.json(); });
  }
  function adminCall(fn, params) { return api('adminCall', { fn: fn, params: params || {} }); }
  function careOp(params) { return adminCall('careAdminOp', params); }
  function careSend(params) { return adminCall('careAdminSend', params); }
  function errText(r) {
    if (!r) return '沒有回應';
    if (r.error === 'backend_error') return '送出結果不明，請重新整理確認';
    if (r.error === 'forbidden_for_agent') return '後台金鑰還沒開通這個功能，請找總管授權';
    return (typeof r.detail === 'string' && r.detail) || r.error || '失敗';
  }
  function thisYm() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function fillMonths(months) {
    var sel = $('ym'); var cur = D.ym; var ms = months.slice(); if (ms.indexOf(thisYm()) < 0) ms.unshift(thisYm()); if (cur && ms.indexOf(cur) < 0) ms.unshift(cur);
    sel.innerHTML = ms.map(function (m) { return '<option value="' + esc(m) + '"' + (m === cur ? ' selected' : '') + '>' + esc(m.replace('-', ' / ')) + '</option>'; }).join('');
  }
  function cur() { return ((D.data && D.data.list) || []).filter(function (x) { return x.clientId === D.sel; })[0] || null; }
  function load(ym) {
    D.ym = ym; D.missing = {}; D.review = {}; D.sel = ''; $('gasLink').href = CFG.gas + '?page=care'; $('mOld1').href = CFG.gas + '?page=care'; $('mOld2').href = CFG.gas + '?page=care'; $('list').innerHTML = '<div class="ld">載入中</div>';
    api('adminCareStatuses', { ym: ym }).then(function (d) {
      if (ym !== D.ym) return;
      if (!d || !d.ok) { $('list').innerHTML = '<div class="ld">載入失敗：' + esc((d && d.error) || '') + '</div>'; return; }
      D.data = d; D.months = d.months || []; fillMonths(D.months); if (wantReview) { D.filter = 'unseen'; $('banner').className = 'banner on'; wantReview = false; } render(); loadReview(ym);
    }).catch(function (e) { if (ym !== D.ym) return; $('list').innerHTML = '<div class="ld">' + esc(e.message || '連線失敗') + '</div>'; });
  }
  function counts(list) {
    return { all: list.length, reported: list.filter(function (c) { return c.hasReport; }).length, unreported: list.filter(function (c) { return !c.hasReport; }).length,
      unpushed: list.filter(function (c) { return c.hasReport && !c.lastPushedAt; }).length, unbound: list.filter(function (c) { return !c.lineBound; }).length, unseen: list.filter(function (c) { return c.hasReport && !isSeen(c.clientId); }).length };
  }
  function pass(c) {
    if (D.filter === 'reported') return c.hasReport; if (D.filter === 'unreported') return !c.hasReport;
    if (D.filter === 'unpushed') return c.hasReport && !c.lastPushedAt; if (D.filter === 'unbound') return !c.lineBound; if (D.filter === 'unseen') return c.hasReport && !isSeen(c.clientId); return true;
  }
  function syncBar() {
    var c = cur(); var has = !!c;
    $('selTxt').innerHTML = c ? '已選：<b>' + esc(c.name) + '</b>' : '點下方案場選一家，才能試發或發送';
    $('bTest').disabled = !(has && c.hasReport); $('bSend').disabled = !(has && c.hasReport); $('mPdf').disabled = !has; $('mCopy').disabled = !(has && c.hash);
  }
  function render() {
    var list = (D.data && D.data.list) || []; var k = counts(list);
    var cards = [['all', k.all, '案場'], ['reported', k.reported, '已回報'], ['unseen', k.unseen, '還沒看過'], ['unpushed', k.unpushed, '未推播'], ['unbound', k.unbound, '未綁 LINE']];
    $('stats').innerHTML = cards.map(function (x) { return '<div class="stat' + (D.filter === x[0] ? ' on' : '') + '" data-f="' + x[0] + '"><div class="v">' + x[1] + '</div><div class="l">' + x[2] + '</div></div>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.stat'), function (el) { el.onclick = function () { D.filter = el.getAttribute('data-f'); render(); }; });
    var rows = list.filter(pass).sort(function (a, b) { return (Number(b.hasReport) - Number(a.hasReport)) || String(a.name).localeCompare(String(b.name), 'zh-Hant'); });
    if (!rows.length) { $('list').innerHTML = '<div class="ld">這個條件下沒有案場</div>'; syncBar(); return; }
    $('list').innerHTML = rows.map(function (c) {
      var chips = c.hasReport ? '<span class="chip ok">已回報</span>' : '<span class="chip mute">未回報</span>';
      var mk = D.missing[c.clientId]; if (mk) chips += '<span class="chip bad">缺 ' + esc(mk) + '</span>';

      var other = (r.items || []).length - items.length;

      var lab = { careAutoPublishMonthlyReports: '整批推播', careLinePushReport: '單家推播', careRequestPushApproval: '送審核卡', careRemindStaffPendingReports: '提醒養護員' };
      var body = items.map(function (x) { return (lab[x.type] || x.type) + ' ' + (x.ym || '') + (x.clientId ? ' ' + x.clientId : '') + '：' + x.scheduledAtLocal; }).join('\n');
      sheet('排程中的發送', body + (other ? '\n\n（另有 ' + other + ' 筆非養護排程，這裡不處理）' : ''),
        [{ t: '關閉' }].concat(items.slice(0, 4).map(function (x) { return { t: '取消 ' + (lab[x.type] || x.type) + ' ' + String(x.scheduledAtLocal).slice(5), fn: function () { cancelQ(x); } }; })));
    }).catch(function (e) { info('讀取失敗', e.message || '連線失敗'); });
  };
  function cancelQ(x) {
    var isBatch = x.type === 'careAutoPublishMonthlyReports' && x.ym;
    var p1 = isBatch ? { op: 'cancelBatch', ym: x.ym } : { op: 'queueCancel', uuid: x.uuid };
    careSend(Object.assign({ dryRun: true }, p1)).then(function (d) {
      if (!d || !d.ok) { info('不能取消', errText(d)); return; }
      confirmThen('取消排程', d.confirmText, '確定取消', function () {
        careSend(p1).then(function (r) { info('取消排程', (r && r.ok) ? '已取消。' : errText(r)); }).catch(function (e) { info('取消失敗', e.message || '連線失敗'); });
      });
    }).catch(function (e) { info('取消失敗', e.message || '連線失敗'); });
  }
  $('ym').onchange = function () { load(this.value); };
  $('gateSend').onclick = function () {
    var em = $('gateEmail').value.trim(); if (!em) return; var btn = this; btn.disabled = true;
    sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: false } }).then(function (r) { btn.disabled = false; $('gateMsg').textContent = r.error ? '寄送失敗，請稍後再試（每小時有次數限制）' : '驗證碼已寄到信箱（一小時內有效）'; if (!r.error) $('otpRow').style.display = 'block'; });
  };
  $('gateVerify').onclick = function () {
    var em = $('gateEmail').value.trim(), code = $('gateCode').value.trim(); if (!em || !code) return; var btn = this; btn.disabled = true;
    sb.auth.verifyOtp({ email: em, token: code, type: 'email' }).then(function (r) { btn.disabled = false; if (r.error) { $('gateMsg').textContent = '驗證碼不對或已過期，請再試一次'; return; } showApp(); boot(); });
  };
  $('leave').onclick = function () { sb.auth.signOut().then(function () { location.reload(); }); };
  function boot() { var q = new URLSearchParams(location.search).get('ym'); var ym = /^\d{4}-\d{2}$/.test(q || '') ? q : thisYm(); D.ym = ym; fillMonths([]); load(ym); }
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) { showApp(); boot(); } else showGate(); });
})();
</script>
